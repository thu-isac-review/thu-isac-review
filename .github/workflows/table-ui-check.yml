name: Table UI checks
on:
  pull_request:
    paths:
      - 'public/assets/js/components/**'
      - 'tests/**'
      - '.github/workflows/table-ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'public/assets/js/components/**'
      - 'tests/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check of all table modules
        run: |
          find public/assets/js/components -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Unit tests
        run: node --test tests/*.test.mjs
