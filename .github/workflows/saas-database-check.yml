name: SaaS database checks
on:
  pull_request:
    paths:
      - 'public/assets/js/components/**'
      - 'tests/saas-database.test.mjs'
      - '.github/workflows/saas-database-check.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find public/assets/js/components -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run SaaS database core tests
        run: node --test tests/saas-database.test.mjs
