    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
        }

        const countriesList = ["中華民國", "大陸地區", "日本", "美國", "越南", "泰國", "澳大利亞", "香港", "澳門", "馬來西亞", "菲律賓", "印尼", "印度", "孟加拉", "緬甸", "柬埔寨", "黎巴嫩", "蒙古", "巴西", "巴拉圭", "秘魯"];
        const citiesList = ["臺北市", "新北市", "基隆市", "桃園市", "新竹縣", "新竹市", "苗栗縣", "臺中市", "彰化縣", "南投縣", "雲林縣", "嘉義縣", "嘉義市", "臺南市", "高雄市", "屏東縣", "宜蘭縣", "花蓮縣", "臺東縣", "澎湖縣", "金門縣", "連江縣"];
        const industriesList = ["農、林、漁、牧業", "礦業及土石採取業", "製造業", "電力及燃氣供應業", "用水供應及污染整治業", "營建工程業", "批發及零售業", "運輸及儲儲業", "住宿及餐飲業", "出版及影音等內容傳播業", "電信及資訊服務業", "金融及保險業", "不動產業", "專業、科學及技術服務業", "支援服務業", "公共行政及國防；強制性社會安全", "教育業", "醫療保健及社會工作服務業", "藝術、運動及休閒服務業", "其他服務業"];
        const venueTypesList = ["企業機構", "政府機構", "其他機構"];

        let treeData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 8; 

        let activeBranchCityFilter = '全部';
        let currentBranchPage = 1;
        const branchItemsPerPage = 5; 

        const viewLoading = document.getElementById('view-loading');
        const viewDashboard = document.getElementById('view-dashboard');
        const viewList = document.getElementById('view-list');
        const viewDetail = document.getElementById('view-detail');
        
        const elList = document.getElementById('inst-list');
        const elLoading = document.getElementById('loading-state');
        const elEmpty = document.getElementById('empty-state');
        const elDetailContent = document.getElementById('detail-content');
        
        const inputSearch = document.getElementById('search-input');
        const inputSearchMobile = document.getElementById('search-input-mobile');
        const selectCountry = document.getElementById('filter-country');
        const selectCity = document.getElementById('filter-city');
        const selectVenue = document.getElementById('filter-venue-type');
        const selectIndustry = document.getElementById('filter-industry');

        const filterWrapper = document.getElementById('filter-wrapper');
        const filterDrawer = document.getElementById('filter-drawer');
        const btnToggleFilter = document.getElementById('btn-toggle-filter');
        const btnCloseFilter = document.getElementById('btn-close-filter');
        const btnApplyFilter = document.getElementById('btn-apply-filter');

        function openFilterDrawer() {
            filterWrapper.classList.remove('hidden');
            setTimeout(() => filterDrawer.classList.add('open'), 10);
        }
        function closeFilterDrawer() {
            filterDrawer.classList.remove('open');
            setTimeout(() => filterWrapper.classList.add('hidden'), 300);
        }
        btnToggleFilter.addEventListener('click', openFilterDrawer);
        btnCloseFilter.addEventListener('click', closeFilterDrawer);
        btnApplyFilter.addEventListener('click', closeFilterDrawer);
        filterWrapper.addEventListener('click', (e) => {
            if (e.target === filterWrapper) closeFilterDrawer();
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                viewLoading.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                setupDropdowns();
                loadData();
            } else {
                window.location.replace('login.html');
            }
        });

        function setupDropdowns() {
            selectCountry.innerHTML = '<option value="">全部國別</option>';
            selectCity.innerHTML = '<option value="">全部縣市</option>';
            selectVenue.innerHTML = '<option value="">全部實習場所</option>';
            selectIndustry.innerHTML = '<option value="">全部行業別</option>';
            countriesList.forEach(c => selectCountry.add(new Option(c, c)));
            citiesList.forEach(c => selectCity.add(new Option(c, c)));
            venueTypesList.forEach(v => selectVenue.add(new Option(v, v)));
            industriesList.forEach(i => selectIndustry.add(new Option(i, i)));
        }

        const handleLogout = () => {
            showConfirm("登出確認", "您確定要登出系統嗎？", async () => {
                await signOut(auth);
            });
        };
        document.getElementById('btn-logout').addEventListener('click', handleLogout);
        document.getElementById('btn-logout-mobile').addEventListener('click', handleLogout);
        document.getElementById('btn-logout-detail').addEventListener('click', handleLogout);

        document.getElementById('btn-back').addEventListener('click', () => {
            viewDetail.classList.add('hidden');
            viewList.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function normalizeItem(d) {
            return {
                id: d.id,
                name: d["input-name"] || d.name || d.input_name || '',
                nameTranslated: d["input-name-translated"] || d.name_translated || d.input_name_translated || '',
                country: d["input-country"] || d.country || d.input_country || '中華民國',
                city: d["input-city"] || d.city || d.input_city || '',
                address: d["input-address"] || d.address || d.input_address || '',
                industry: d["input-industry"] || d.industry || d.input_industry || '',
                venueType: d["input-venue-type"] || d.venue_type || d.input_venue_type || '',
                parentSearchInput: d["parent-search-input"] || d.parent_id || d.parent_search_input || null
            };
        }

        async function loadData() {
            elLoading.classList.remove('hidden');
            elList.classList.add('hidden');
            elEmpty.classList.add('hidden');
            try {
                if (!db) throw new Error("Firestore 未加載成功");
                const snapshot = await getDocs(collection(db, 'internship_institutions'));
                const allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                buildTreeStructure(allData);
                elLoading.classList.add('hidden');

                inputSearch.addEventListener('input', (e) => { inputSearchMobile.value = e.target.value; currentPage = 1; renderList(); });
                inputSearchMobile.addEventListener('input', (e) => { inputSearch.value = e.target.value; currentPage = 1; renderList(); });
                
                selectCountry.addEventListener('change', handleCountryChange);
                selectCity.addEventListener('change', () => { currentPage = 1; renderList(); });
                selectVenue.addEventListener('change', () => { currentPage = 1; renderList(); });
                selectIndustry.addEventListener('change', () => { currentPage = 1; renderList(); });
                renderList();
            } catch (error) {
                console.error("載入失敗:", error);
                elLoading.innerHTML = `<p class="text-xs text-rose-400 py-6 font-medium">連線暫時中斷，請重新整理頁面。</p>`;
            }
        }

        function buildTreeStructure(rawItems) {
            const normalized = rawItems.map(normalizeItem);
            const parents = normalized.filter(d => !d.parentSearchInput);
            const children = normalized.filter(d => d.parentSearchInput);
            treeData = parents.map(p => {
                const branches = children.filter(c => c.parentSearchInput === p.id);
                branches.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
                return { ...p, branches };
            });
            treeData.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
        }

        function handleCountryChange() {
            const countryVal = selectCountry.value;
            currentPage = 1;
            selectCity.value = ''; selectVenue.value = ''; selectIndustry.value = '';
            if (countryVal && countryVal !== '中華民國') {
                selectCity.disabled = true;
                selectCity.classList.add('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
                selectVenue.value = '其他機構'; selectVenue.disabled = true;
                selectVenue.classList.add('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
            } else {
                selectCity.disabled = false; selectCity.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
                selectVenue.disabled = false; selectVenue.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
            }
            renderList();
        }

        function renderList() {
            const term = inputSearch.value.trim().toLowerCase();
            const filterCountry = selectCountry.value;
            const filterCity = selectCity.value;
            const filterVenue = selectVenue.value;
            const filterIndustry = selectIndustry.value;

            filteredData = treeData.filter(p => {
                const matchTerm = !term || p.name.toLowerCase().includes(term) || p.nameTranslated.toLowerCase().includes(term) || p.branches.some(b => b.name.toLowerCase().includes(term));
                const matchCountry = !filterCountry || p.country === filterCountry || p.branches.some(b => b.country === filterCountry);
                const matchCity = selectCity.disabled || !filterCity || p.city === filterCity || p.branches.some(b => b.city === filterCity);
                const matchVenue = !filterVenue || p.venueType === filterVenue;
                const matchIndustry = !filterIndustry || p.industry === filterIndustry;
                return matchTerm && matchCountry && matchCity && matchVenue && matchIndustry;
            });

            if (filteredData.length === 0) {
                elList.classList.add('hidden');
                document.getElementById('pagination-panel').classList.add('hidden');
                elEmpty.classList.remove('hidden');
                return;
            }
            elEmpty.classList.add('hidden');
            elList.classList.remove('hidden');
            renderPage();
        }

        function renderPage() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(startIndex, startIndex + itemsPerPage);

            let listHtml = '';
            for (let i = 0; i < itemsPerPage; i++) {
                const inst = pageItems[i];
                if (inst) {
                    const isOverseas = inst.country && inst.country !== '中華民國';
                    let displayName = (isOverseas && inst.nameTranslated) ? inst.nameTranslated : inst.name;

                    listHtml += `
                        <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-premium flex flex-col justify-between cursor-pointer min-h-[155px] sm:min-h-[165px] transition-all duration-200 lg:hover:-translate-y-0.5 lg:hover:shadow-premium-hover active:scale-[0.98]" onclick="openDetail('${inst.id}')">
                            <div class="flex items-start gap-3 w-full">
                                <div class="w-11 h-11 bg-slate-50 border border-slate-100 text-slate-400 flex items-center justify-center text-base flex-shrink-0 rounded-xl">
                                    <i class="ti ti-building"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-slate-700 text-xs sm:text-sm md:text-base leading-snug break-words whitespace-normal">${displayName}</h4>
                                </div>
                            </div>
                            <div class="flex items-center justify-between gap-2 mt-4 pt-2.5 border-t border-slate-50/80 w-full">
                                <div class="flex flex-wrap gap-1 max-w-[85%]">
                                    ${inst.industry ? `<span class="bg-slate-50 text-slate-500 text-[9px] sm:text-[10px] font-semibold px-2 py-0.5 rounded-md border border-slate-100">${inst.industry}</span>` : ''}
                                    ${inst.venueType ? `<span class="bg-emerald-50 text-emerald-700 text-[9px] sm:text-[10px] font-semibold px-2 py-0.5 rounded-md">${inst.venueType}</span>` : ''}
                                </div>
                                <i class="ti ti-chevron-right text-slate-300 text-sm font-bold flex-shrink-0 ml-auto"></i>
                            </div>
                        </div>
                    `;
                } else {
                    listHtml += `<div class="hidden sm:block opacity-0 pointer-events-none min-h-[165px]"></div>`;
                }
            }
            elList.innerHTML = listHtml;
            renderPaginationControls(totalPages);
        }

        function renderPaginationControls(totalPages) {
            const panel = document.getElementById('pagination-panel');
            if (totalPages <= 1) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="w-10 h-10 rounded-xl border border-slate-200/60 bg-white text-slate-500 flex items-center justify-center disabled:opacity-30 active:bg-slate-50">
                    <i class="ti ti-chevron-left text-base"></i>
                </button>
            `;

            const maxPageButtons = 3; 
            let startPage = Math.max(1, currentPage - 1);
            let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);
            if (endPage - startPage < maxPageButtons - 1) startPage = Math.max(1, endPage - maxPageButtons + 1);

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `<button class="w-10 h-10 rounded-xl bg-thu-blue text-white font-bold text-xs shadow-sm">${i}</button>`;
                } else {
                    html += `<button onclick="changePage(${i})" class="w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-600 font-bold text-xs active:bg-slate-50">${i}</button>`;
                }
            }

            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="w-10 h-10 rounded-xl border border-slate-200/60 bg-white text-slate-500 flex items-center justify-center disabled:opacity-30 active:bg-slate-50">
                    <i class="ti ti-chevron-right text-base"></i>
                </button>
            `;
            panel.innerHTML = html;
        }

        window.changePage = function(page) {
            currentPage = page; renderPage();
            // 如果是手機版，滾動至畫面頂端，但扣除固定置頂列的高度 (約 120px)
            const offset = window.innerWidth < 1024 ? 120 : 0;
            const element = document.getElementById('view-list');
            const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({ top: elementPosition - offset, behavior: 'smooth' });
        };

        window.openDetail = function(instId) {
            const inst = treeData.find(d => d.id === instId);
            if (!inst) return;
            viewList.classList.add('hidden'); viewDetail.classList.remove('hidden');
            activeBranchCityFilter = '全部'; currentBranchPage = 1;
            renderDetailView(inst);
            window.scrollTo({ top: 0, behavior: 'instant' });
        };

        function renderDetailView(inst) {
            const isOverseas = inst.country && inst.country !== '中華民國';
            let displayNameText = (isOverseas && inst.nameTranslated) ? `${inst.nameTranslated} <span class="text-slate-400 font-normal text-xs block mt-1 sm:inline sm:text-sm sm:ml-2">（${inst.name}）</span>` : inst.name;
            const uniqueCities = [...new Set(inst.branches.map(b => b.city).filter(Boolean))].sort();

            let cityFiltersHtml = '';
            if (!isOverseas && inst.branches.length > 0 && uniqueCities.length > 0) {
                cityFiltersHtml = `
                    <div class="flex flex-wrap gap-1 bg-slate-50 p-1 rounded-xl border border-slate-100 overflow-x-auto whitespace-nowrap">
                        <button onclick="filterBranchCity('全部', '${inst.id}')" class="px-3.5 py-2 text-xs font-bold rounded-lg transition-all ${activeBranchCityFilter === '全部' ? 'bg-thu-blue text-white shadow-sm' : 'text-slate-500'}">全部</button>
                        ${uniqueCities.map(city => `<button onclick="filterBranchCity('${city}', '${inst.id}')" class="px-3.5 py-2 text-xs font-bold rounded-lg transition-all ${activeBranchCityFilter === city ? 'bg-thu-blue text-white shadow-sm' : 'text-slate-500'}">${city}</button>`).join('')}
                    </div>
                `;
            }

            elDetailContent.innerHTML = `
                <div class="bg-white border border-slate-100 rounded-2xl p-5 sm:p-7 shadow-premium relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-thu-blue to-thu-accent"></div>
                    <div class="flex flex-col sm:flex-row items-center sm:items-stretch gap-4 sm:gap-5">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl bg-gradient-to-tr from-thu-deep to-thu-blue text-white flex items-center justify-center text-2xl flex-shrink-0 shadow-sm">
                            <i class="ti ti-building"></i>
                        </div>
                        <div class="flex-1 flex flex-col justify-center text-center sm:text-left min-w-0 w-full">
                            <h2 class="text-sm sm:text-base font-bold text-slate-800 tracking-tight leading-snug mb-2">${displayNameText}</h2>
                            <div class="flex flex-wrap justify-center sm:justify-start gap-1 mb-2.5">
                                ${inst.venueType ? `<span class="bg-emerald-50 text-emerald-700 text-[10px] font-semibold px-2 py-0.5 rounded">${inst.venueType}</span>` : ''}
                                ${inst.industry ? `<span class="bg-slate-50 text-slate-500 text-[10px] font-semibold px-2 py-0.5 rounded border border-slate-100">${inst.industry}</span>` : ''}
                            </div>
                            <div class="flex items-center justify-center sm:justify-start gap-1 text-slate-400 text-[11px] sm:text-xs">
                                <i class="ti ti-map-pin text-sm"></i>
                                ${isOverseas ? `<span class="bg-rose-50 text-rose-700 text-[9px] font-bold px-1 py-0.5 rounded mr-1">${inst.country}</span>` : ''}
                                <span class="font-medium text-slate-500 truncate max-w-[70%]">${inst.address || '無主地址登記'}</span>
                                ${inst.address ? `<button onclick="copyAddress('${inst.address}')" class="p-1 text-slate-400 active:text-slate-700"><i class="ti ti-copy text-xs"></i></button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border border-slate-100 rounded-2xl p-5 sm:p-7 shadow-premium">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                        <h3 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1.5"><i class="ti ti-git-branch text-thu-blue"></i> 分支據點清單</h3>
                        <span id="branch-total-count" class="bg-slate-50 text-slate-500 border border-slate-100 font-bold px-2 py-0.5 rounded-md text-[9px]">共 0 處</span>
                    </div>
                    ${cityFiltersHtml}
                    <div class="flex flex-col justify-between min-h-[280px]">
                        <div id="branches-list-wrapper" class="divide-y divide-slate-100/70 flex-1"></div>
                        <div id="branch-local-pagination" class="flex justify-between items-center pt-3 border-t border-slate-100 mt-3"></div>
                    </div>
                </div>
            `;
            renderBranchesContainer(inst);
        }

        function renderBranchesContainer(inst) {
            const isOverseas = inst.country && inst.country !== '中華民國';
            let displayBranches = (activeBranchCityFilter !== '全部') ? inst.branches.filter(b => b.city === activeBranchCityFilter) : (inst.branches || []);
            document.getElementById('branch-total-count').textContent = `共 ${displayBranches.length} 處`;

            const branchesWrapper = document.getElementById('branches-list-wrapper');
            const paginationWrapper = document.getElementById('branch-local-pagination');

            if (displayBranches.length === 0) {
                branchesWrapper.innerHTML = `<div class="h-[220px] flex items-center justify-center text-slate-400 text-xs font-medium">暫無其他據點登記</div>`;
                paginationWrapper.innerHTML = ''; return;
            }

            const totalBranchPages = Math.ceil(displayBranches.length / branchItemsPerPage);
            if (currentBranchPage > totalBranchPages) currentBranchPage = totalBranchPages || 1;
            const startIndex = (currentBranchPage - 1) * branchItemsPerPage;
            const slicedBranches = displayBranches.slice(startIndex, startIndex + branchItemsPerPage);

            let listHtml = '';
            for (let i = 0; i < branchItemsPerPage; i++) {
                const branch = slicedBranches[i];
                if (branch) {
                    const borderClass = i === 0 ? 'border-t-0 pt-0.5' : 'border-t border-slate-100/70 pt-2.5';
                    const cityTag = (!isOverseas && branch.city) ? `<span class="bg-slate-50 text-slate-500 text-[9px] font-bold px-1.5 py-0.5 rounded border border-slate-100 mr-2 flex-shrink-0">${branch.city}</span>` : '';
                    listHtml += `
                        <div class="py-2 flex flex-col justify-center h-[52px] ${borderClass}">
                            <div class="flex items-center min-w-0 w-full mb-0.5">
                                ${cityTag}
                                <span class="font-bold text-slate-700 text-xs truncate flex-1">${branch.name}</span>
                            </div>
                            <span class="text-[10px] text-slate-400 truncate w-full pl-1">${branch.address || '無詳細通訊地址'}</span>
                        </div>
                    `;
                } else {
                    listHtml += `<div class="py-2 h-[52px] border-t border-transparent opacity-0 pointer-events-none"></div>`;
                }
            }
            branchesWrapper.innerHTML = listHtml;

            if (totalBranchPages > 1) {
                paginationWrapper.innerHTML = `
                    <button onclick="changeBranchPage(${currentBranchPage - 1}, '${inst.id}')" ${currentBranchPage === 1 ? 'disabled' : ''} class="px-3 py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-500 disabled:opacity-30 active:bg-slate-50">上一頁</button>
                    <span class="text-[11px] text-slate-400 font-bold">${currentBranchPage} / ${totalBranchPages}</span>
                    <button onclick="changeBranchPage(${currentBranchPage + 1}, '${inst.id}')" ${currentBranchPage === totalBranchPages ? 'disabled' : ''} class="px-3 py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-500 disabled:opacity-30 active:bg-slate-50">下一頁</button>
                `;
            } else {
                paginationWrapper.innerHTML = `<div class="text-[10px] text-slate-300 font-medium tracking-wide">已顯示全部據點</div>`;
            }
        }

        window.changeBranchPage = function(targetPage, instId) {
            currentBranchPage = targetPage;
            const inst = treeData.find(d => d.id === instId);
            if (inst) renderBranchesContainer(inst);
        };

        window.filterBranchCity = function(city, instId) {
            activeBranchCityFilter = city; currentBranchPage = 1;
            const inst = treeData.find(d => d.id === instId);
            if (inst) renderDetailView(inst);
        };

        window.copyAddress = function(text) {
            const tempInput = document.createElement('textarea'); tempInput.value = text;
            document.body.appendChild(tempInput); tempInput.select();
            try { document.execCommand('copy'); showToast("地址已複製", "success"); } catch (err) { showToast("複製失敗", "error"); }
            document.body.removeChild(tempInput);
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-slate-900 text-white' : 'bg-rose-50 text-rose-900 border-rose-100';
            let iconClass = type === 'success' ? 'ti-circle-check-filled text-emerald-400' : 'ti-circle-x-filled text-rose-500';

            toast.className = `flex items-center gap-2 px-3.5 py-2.5 rounded-xl shadow-xl ${bgClass} border text-xs font-semibold mx-auto transition-all duration-300 transform translate-y-2 opacity-0 w-full max-w-[280px]`;
            toast.innerHTML = `<i class="ti ${iconClass} text-sm flex-shrink-0"></i><span class="truncate">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-[-10px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        };

        window.showConfirm = function(title, desc, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            modal.classList.remove('hidden'); modal.classList.add('flex');
            const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
            document.getElementById('confirm-btn-cancel').onclick = close;
            document.getElementById('confirm-btn-ok').onclick = () => { onConfirm(); close(); };
        };
    </script>
</body>
</html>
