    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
        }

        const countriesList = [
            "中華民國", "大陸地區", "日本", "美國", "越南", "泰國", "澳大利亞", "香港", "澳門", "馬來西亞", 
            "菲律賓", "印尼", "印度", "孟加拉", "緬甸", "柬埔寨", "黎巴嫩", "蒙古", "巴西", "巴拉圭", "秘魯"
        ];
        const citiesList = [
            "臺北市", "新北市", "基隆市", "桃園市", "新竹縣", "新竹市", "苗栗縣", "臺中市", "彰化縣", 
            "南投縣", "雲林縣", "嘉義縣", "嘉義市", "臺南市", "高雄市", "屏東縣", "宜蘭縣", "花蓮縣", 
            "臺東縣", "澎湖縣", "金門縣", "連江縣"
        ];
        const industriesList = [
            "農、林、漁、牧業", "礦業及土石採取業", "製造業", "電力及燃氣供應業", "用水供應及污染整治業", 
            "營建工程業", "批發及零售業", "運輸及倉儲業", "住宿及餐飲業", "出版及影音等內容傳播業", 
            "電信及資訊服務業", "金融及保險業", "不動產業", "專業、科學及技術服務業", "支援服務業", 
            "公共行政及國防；強制性社會安全", "教育業", "醫療保健及社會工作服務業", "藝術、運動及休閒服務業", "其他服務業"
        ];
        const venueTypesList = ["企業機構", "政府機構", "其他機構"];

        let treeData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 8; 

        let activeBranchCityFilter = '全部';
        let currentBranchPage = 1;
        const branchItemsPerPage = 5; 

        const viewLoading = document.getElementById('view-loading');
        const viewDashboard = document.getElementById('view-dashboard');
        const viewList = document.getElementById('view-list');
        const viewDetail = document.getElementById('view-detail');
        const elList = document.getElementById('inst-list');
        const elLoading = document.getElementById('loading-state');
        const elEmpty = document.getElementById('empty-state');
        const elDetailContent = document.getElementById('detail-content');
        
        const inputSearch = document.getElementById('search-input');
        const selectCountry = document.getElementById('filter-country');
        const selectCity = document.getElementById('filter-city');
        const selectVenue = document.getElementById('filter-venue-type');
        const selectIndustry = document.getElementById('filter-industry');

        const inputSearchMobile = document.getElementById('search-input-mobile');
        const selectCountryMobile = document.getElementById('filter-country-mobile');
        const selectCityMobile = document.getElementById('filter-city-mobile');
        const selectVenueMobile = document.getElementById('filter-venue-type-mobile');
        const selectIndustryMobile = document.getElementById('filter-industry-mobile');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                viewLoading.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                const displayName = user.email ? user.email.split('@')[0] : '授權人員';
                document.getElementById('user-greeting').textContent = `${displayName}，您好！`;
                document.getElementById('user-greeting-mobile').textContent = `${displayName}，您好！`;
                setupDropdowns();
                loadData();
            } else {
                window.location.replace('login.html');
            }
        });

        function setupDropdowns() {
            [selectCountry, selectCountryMobile].forEach(el => el.innerHTML = '<option value="">全部國別</option>');
            [selectCity, selectCityMobile].forEach(el => el.innerHTML = '<option value="">全部縣市</option>');
            [selectVenue, selectVenueMobile].forEach(el => el.innerHTML = '<option value="">全部實習場所</option>');
            [selectIndustry, selectIndustryMobile].forEach(el => el.innerHTML = '<option value="">全部行業別</option>');

            countriesList.forEach(c => { selectCountry.add(new Option(c, c)); selectCountryMobile.add(new Option(c, c)); });
            citiesList.forEach(c => { selectCity.add(new Option(c, c)); selectCityMobile.add(new Option(c, c)); });
            venueTypesList.forEach(v => { selectVenue.add(new Option(v, v)); selectVenueMobile.add(new Option(v, v)); });
            industriesList.forEach(i => { selectIndustry.add(new Option(i, i)); selectIndustryMobile.add(new Option(i, i)); });
        }

        const handleLogout = () => {
            showConfirm("登出確認", "您確定要登出系統嗎？", async () => { await signOut(auth); });
        };
        document.getElementById('btn-logout').addEventListener('click', handleLogout);
        document.getElementById('btn-logout-mobile').addEventListener('click', handleLogout);

        document.getElementById('btn-back').addEventListener('click', () => {
            viewDetail.classList.add('hidden');
            viewList.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('btn-toggle-filters').addEventListener('click', () => {
            document.getElementById('mobile-filters-panel').classList.toggle('hidden');
        });

        function normalizeItem(d) {
            return {
                id: d.id,
                name: d["input-name"] || d.name || d.input_name || '',
                nameTranslated: d["input-name-translated"] || d.name_translated || d.input_name_translated || '',
                country: d["input-country"] || d.country || d.input_country || '中華民國',
                city: d["input-city"] || d.city || d.input_city || '',
                address: d["input-address"] || d.address || d.input_address || '',
                industry: d["input-industry"] || d.industry || d.input_industry || '',
                venueType: d["input-venue-type"] || d.venue_type || d.input_venue_type || '',
                parentSearchInput: d["parent-search-input"] || d.parent_id || d.parent_search_input || null
            };
        }

        async function loadData() {
            elLoading.classList.remove('hidden');
            elList.classList.add('hidden');
            elEmpty.classList.add('hidden');
            document.getElementById('pagination-panel').classList.add('hidden');

            try {
                if (!db) throw new Error("Firestore 未加載成功");
                const snapshot = await getDocs(collection(db, 'internship_institutions'));
                const allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                buildTreeStructure(allData);
                elLoading.classList.add('hidden');

                // 綁定事件 (簡化綁定邏輯)
                const syncAndRender = (desktopEl, mobileEl, isCountry = false) => {
                    desktopEl.addEventListener('input', (e) => {
                        mobileEl.value = e.target.value;
                        if(isCountry) handleCountryChange(desktopEl.value);
                        else { currentPage = 1; renderList(); }
                    });
                    mobileEl.addEventListener('input', (e) => {
                        desktopEl.value = e.target.value;
                        if(isCountry) handleCountryChange(mobileEl.value);
                        else { currentPage = 1; renderList(); }
                    });
                };

                syncAndRender(inputSearch, inputSearchMobile);
                syncAndRender(selectCountry, selectCountryMobile, true);
                syncAndRender(selectCity, selectCityMobile);
                syncAndRender(selectVenue, selectVenueMobile);
                syncAndRender(selectIndustry, selectIndustryMobile);

                renderList();
            } catch (error) {
                console.error("載入失敗:", error);
                elLoading.innerHTML = `
                    <div class="text-slate-500 py-12 flex flex-col items-center bg-white rounded-2xl border border-slate-100 shadow-soft">
                        <i class="ti ti-alert-triangle text-4xl mb-4 text-rose-400"></i>
                        <h4 class="font-bold text-base">連線暫時中斷</h4>
                        <p class="text-slate-400 text-sm mt-2">無法連接資料庫，請檢查網路狀態。</p>
                    </div>
                `;
            }
        }

        function buildTreeStructure(rawItems) {
            const normalized = rawItems.map(normalizeItem);
            const parents = normalized.filter(d => !d.parentSearchInput);
            const children = normalized.filter(d => d.parentSearchInput);

            treeData = parents.map(p => {
                const branches = children.filter(c => c.parentSearchInput === p.id);
                branches.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
                return { ...p, branches };
            });
            treeData.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
        }

        function handleCountryChange(countryVal) {
            currentPage = 1;
            [selectCity, selectCityMobile, selectVenue, selectVenueMobile, selectIndustry, selectIndustryMobile].forEach(el => el.value = '');
            
            const isOverseas = countryVal && countryVal !== '中華民國';
            [selectCity, selectCityMobile].forEach(el => {
                el.disabled = isOverseas;
                el.className = isOverseas ? 'w-full pl-4 pr-10 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm appearance-none text-slate-400 cursor-not-allowed' 
                                          : 'w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-thu-blue transition-all text-sm appearance-none cursor-pointer text-slate-700';
            });
            [selectVenue, selectVenueMobile].forEach(el => {
                if (isOverseas) el.value = '其他機構';
                el.disabled = isOverseas;
                el.className = isOverseas ? 'w-full pl-4 pr-10 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm appearance-none text-slate-400 cursor-not-allowed' 
                                          : 'w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-thu-blue transition-all text-sm appearance-none cursor-pointer text-slate-700';
            });
            renderList();
        }

        function renderList() {
            const term = inputSearch.value.trim().toLowerCase();
            const filterCountry = selectCountry.value;
            const filterCity = selectCity.value;
            const filterVenue = selectVenue.value;
            const filterIndustry = selectIndustry.value;

            filteredData = treeData.filter(p => {
                const matchTerm = !term || p.name.toLowerCase().includes(term) || p.nameTranslated.toLowerCase().includes(term) || p.branches.some(b => b.name.toLowerCase().includes(term));
                const matchCountry = !filterCountry || p.country === filterCountry || p.branches.some(b => b.country === filterCountry);
                const matchCity = selectCity.disabled || !filterCity || p.city === filterCity || p.branches.some(b => b.city === filterCity);
                const matchVenue = !filterVenue || p.venueType === filterVenue;
                const matchIndustry = !filterIndustry || p.industry === filterIndustry;
                return matchTerm && matchCountry && matchCity && matchVenue && matchIndustry;
            });

            if (filteredData.length === 0) {
                elList.classList.add('hidden');
                document.getElementById('pagination-panel').classList.add('hidden');
                elEmpty.classList.remove('hidden');
                return;
            }

            elEmpty.classList.add('hidden');
            elList.classList.remove('hidden');
            renderPage();
        }

        function renderPage() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages || 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(startIndex, startIndex + itemsPerPage);

            let listHtml = '';
            for (let i = 0; i < itemsPerPage; i++) {
                const inst = pageItems[i];
                if (inst) {
                    const isOverseas = inst.country && inst.country !== '中華民國';
                    let displayName = isOverseas && inst.nameTranslated ? inst.nameTranslated : inst.name;

                    listHtml += `
                        <div class="card-hover group bg-white border border-slate-200 rounded-2xl p-6 shadow-soft hover:shadow-hover hover:border-thu-accent/40 flex flex-col justify-between cursor-pointer min-h-[140px]" onclick="openDetail('${inst.id}')">
                            <div>
                                <div class="flex items-start gap-4 mb-4">
                                    <div class="w-12 h-12 bg-slate-50 group-hover:bg-thu-light text-slate-400 group-hover:text-thu-blue transition-colors flex items-center justify-center text-xl flex-shrink-0 rounded-xl border border-slate-100">
                                        <i class="ti ti-building"></i>
                                    </div>
                                    <div class="flex-1 py-1">
                                        <h4 class="font-bold text-slate-800 text-sm sm:text-base leading-snug group-hover:text-thu-deep transition-colors">${displayName}</h4>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between gap-3 mt-auto pt-4 border-t border-slate-50 group-hover:border-slate-100">
                                <div class="flex flex-wrap gap-2">
                                    ${inst.venueType ? `<span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-100/50">${inst.venueType}</span>` : ''}
                                    ${inst.industry ? `<span class="bg-slate-50 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200/60">${inst.industry}</span>` : ''}
                                </div>
                                <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-thu-blue group-hover:text-white transition-colors flex-shrink-0">
                                    <i class="ti ti-arrow-right text-sm"></i>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    listHtml += `<div class="hidden md:block opacity-0 pointer-events-none min-h-[140px]"></div>`;
                }
            }
            elList.innerHTML = listHtml;
            renderPaginationControls(totalPages);
        }

        function renderPaginationControls(totalPages) {
            const panel = document.getElementById('pagination-panel');
            if (totalPages <= 1) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');

            let btnClass = "w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-thu-blue transition-all disabled:opacity-50 disabled:bg-slate-50 disabled:cursor-not-allowed font-semibold text-sm flex items-center justify-center";
            let activeBtnClass = "w-10 h-10 rounded-xl bg-thu-blue text-white font-bold text-sm shadow-md flex items-center justify-center";

            let html = `<div class="flex items-center justify-center w-full gap-2">`;
            html += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="${btnClass}"><i class="ti ti-chevron-left"></i></button>`;
            
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);

            if (start > 1) {
                html += `<button onclick="changePage(1)" class="${btnClass}">1</button>`;
                if (start > 2) html += `<span class="px-2 text-slate-400">...</span>`;
            }

            for (let i = start; i <= end; i++) {
                html += `<button onclick="changePage(${i})" class="${i === currentPage ? activeBtnClass : btnClass}">${i}</button>`;
            }

            if (end < totalPages) {
                if (end < totalPages - 1) html += `<span class="px-2 text-slate-400">...</span>`;
                html += `<button onclick="changePage(${totalPages})" class="${btnClass}">${totalPages}</button>`;
            }

            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="${btnClass}"><i class="ti ti-chevron-right"></i></button>`;
            html += `</div>`;
            panel.innerHTML = html;
        }

        window.changePage = function(page) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openDetail = function(instId) {
            const inst = treeData.find(d => d.id === instId);
            if (!inst) return;
            viewList.classList.add('hidden');
            viewDetail.classList.remove('hidden');
            activeBranchCityFilter = '全部';
            currentBranchPage = 1;
            renderDetailView(inst);
        };

        function renderDetailView(inst) {
            const isOverseas = inst.country && inst.country !== '中華民國';
            let displayNameText = inst.name;
            if (isOverseas && inst.nameTranslated) displayNameText = `${inst.nameTranslated} <span class="text-slate-400 text-lg font-medium block sm:inline mt-1 sm:mt-0">${inst.name}</span>`;

            const uniqueCities = [...new Set(inst.branches.map(b => b.city).filter(Boolean))].sort();
            let cityFiltersHtml = '';
            
            if (!isOverseas && uniqueCities.length > 0) {
                cityFiltersHtml = `
                    <div class="flex flex-wrap gap-2 mb-6">
                        <button onclick="filterBranchCity('全部', '${inst.id}')" class="px-4 py-2 text-sm font-semibold rounded-xl transition-all ${activeBranchCityFilter === '全部' ? 'bg-thu-blue text-white shadow-md' : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100'}">全部區域</button>
                        ${uniqueCities.map(city => `
                            <button onclick="filterBranchCity('${city}', '${inst.id}')" class="px-4 py-2 text-sm font-semibold rounded-xl transition-all ${activeBranchCityFilter === city ? 'bg-thu-blue text-white shadow-md' : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100'}">${city}</button>
                        `).join('')}
                    </div>
                `;
            }

            elDetailContent.innerHTML = `
                <div class="bg-white border border-slate-100 rounded-2xl p-6 sm:p-10 shadow-soft">
                    <div class="flex flex-col md:flex-row gap-6 lg:gap-8 items-start">
                        <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-2xl bg-gradient-to-br from-thu-deep to-thu-accent text-white flex items-center justify-center text-4xl flex-shrink-0 shadow-lg shadow-thu-blue/20">
                            <i class="ti ti-building-skyscraper"></i>
                        </div>
                        <div class="flex-1 space-y-4 w-full min-w-0">
                            <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight leading-snug">${displayNameText}</h2>
                            <div class="flex flex-wrap gap-2.5">
                                ${inst.venueType ? `<span class="bg-emerald-50 text-emerald-700 text-sm font-semibold px-3 py-1 rounded-md border border-emerald-100/50 flex items-center gap-1.5"><i class="ti ti-category text-base"></i>${inst.venueType}</span>` : ''}
                                ${inst.industry ? `<span class="bg-slate-50 text-slate-600 text-sm font-semibold px-3 py-1 rounded-md border border-slate-200 flex items-center gap-1.5"><i class="ti ti-tag text-base"></i>${inst.industry}</span>` : ''}
                                ${isOverseas ? `<span class="bg-rose-50 text-rose-700 text-sm font-semibold px-3 py-1 rounded-md border border-rose-100 flex items-center gap-1.5"><i class="ti ti-world text-base"></i>${inst.country}</span>` : ''}
                            </div>
                            <div class="flex items-start gap-2 pt-2 text-slate-500">
                                <i class="ti ti-map-pin-filled text-slate-400 text-lg mt-0.5"></i>
                                <span class="text-sm sm:text-base font-medium flex-1">${inst.address || '無登記主要地址'}</span>
                                ${inst.address ? `<button onclick="copyAddress('${inst.address}')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-500 rounded-lg transition-colors border border-slate-200" title="複製地址"><i class="ti ti-copy"></i></button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border border-slate-100 rounded-2xl p-6 sm:p-10 shadow-soft">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5 mb-6">
                        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="ti ti-map-2 text-thu-blue"></i> 服務據點與分支機構
                        </h3>
                        <span id="branch-total-count" class="bg-thu-light text-thu-deep font-bold px-4 py-1.5 rounded-full text-sm">共 0 處</span>
                    </div>

                    ${cityFiltersHtml}

                    <div class="flex flex-col min-h-[350px]">
                        <div id="branches-list-wrapper" class="divide-y divide-slate-100 flex-1"></div>
                        <div id="branch-local-pagination" class="flex justify-between items-center pt-6 mt-4"></div>
                    </div>
                </div>
            `;
            renderBranchesContainer(inst);
        }

        function renderBranchesContainer(inst) {
            let displayBranches = inst.branches || [];
            if (activeBranchCityFilter !== '全部') {
                displayBranches = inst.branches.filter(b => b.city === activeBranchCityFilter);
            }

            document.getElementById('branch-total-count').textContent = `共 ${displayBranches.length} 處`;
            const branchesWrapper = document.getElementById('branches-list-wrapper');
            const paginationWrapper = document.getElementById('branch-local-pagination');

            if (displayBranches.length === 0) {
                branchesWrapper.innerHTML = `
                    <div class="h-[250px] flex flex-col items-center justify-center text-center">
                        <i class="ti ti-map-off text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 text-sm font-medium">該區域暫無分支據點</p>
                    </div>`;
                paginationWrapper.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(displayBranches.length / branchItemsPerPage);
            if (currentBranchPage > totalPages) currentBranchPage = totalPages || 1;
            const sliced = displayBranches.slice((currentBranchPage - 1) * branchItemsPerPage, currentBranchPage * branchItemsPerPage);

            let listHtml = '';
            for (let i = 0; i < branchItemsPerPage; i++) {
                const branch = sliced[i];
                if (branch) {
                    listHtml += `
                        <div class="py-4 flex flex-col md:flex-row md:items-center justify-between gap-3 h-auto md:h-[68px] hover:bg-slate-50/50 transition-colors px-2 rounded-lg">
                            <div class="flex items-center gap-3 min-w-0">
                                ${branch.city && inst.country === '中華民國' ? `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-md flex-shrink-0">${branch.city}</span>` : ''}
                                <span class="font-bold text-slate-700 text-sm md:text-base truncate">${branch.name}</span>
                            </div>
                            <span class="text-sm text-slate-500 truncate w-full md:w-1/2 md:text-right pl-3 md:pl-0 border-l-2 border-slate-100 md:border-0">${branch.address || '無詳細通訊地址'}</span>
                        </div>
                    `;
                } else {
                    listHtml += `<div class="py-4 h-[68px] opacity-0 pointer-events-none"></div>`;
                }
            }
            branchesWrapper.innerHTML = listHtml;

            if (totalPages > 1) {
                paginationWrapper.innerHTML = `
                    <button onclick="changeBranchPage(${currentBranchPage - 1}, '${inst.id}')" ${currentBranchPage === 1 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-thu-blue transition-all disabled:opacity-40 disabled:cursor-not-allowed">上一頁</button>
                    <span class="text-sm text-slate-500 font-semibold bg-slate-50 px-4 py-2 rounded-lg">${currentBranchPage} / ${totalPages}</span>
                    <button onclick="changeBranchPage(${currentBranchPage + 1}, '${inst.id}')" ${currentBranchPage === totalPages ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-thu-blue transition-all disabled:opacity-40 disabled:cursor-not-allowed">下一頁</button>
                `;
            } else {
                paginationWrapper.innerHTML = ``;
            }
        }

        window.changeBranchPage = function(targetPage, instId) {
            currentBranchPage = targetPage;
            const inst = treeData.find(d => d.id === instId);
            if (inst) renderBranchesContainer(inst);
        };

        window.filterBranchCity = function(city, instId) {
            activeBranchCityFilter = city;
            currentBranchPage = 1;
            const inst = treeData.find(d => d.id === instId);
            if (inst) renderDetailView(inst);
        };

        window.copyAddress = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("地址複製成功！", "success");
            }).catch(() => {
                showToast("複製失敗，請手動複製", "error");
            });
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let theme = type === 'success' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200';
            let icon = type === 'success' ? 'ti-circle-check-filled' : 'ti-alert-circle-filled';
            
            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border shadow-lg ${theme} transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="ti ${icon} text-lg"></i><span class="text-sm font-bold">${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });
            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        window.showConfirm = function(title, desc, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
            document.getElementById('confirm-btn-cancel').onclick = close;
            document.getElementById('confirm-btn-ok').onclick = () => { onConfirm(); close(); };
        };
    </script>
</body>
</html>
