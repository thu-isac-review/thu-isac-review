<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合作實習機構 - 東海大學實習專區</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thu: {
                            deep: '#2E4053',      // 莫蘭迪深藍
                            blue: '#4A607A',      // 莫蘭迪石墨藍
                            accent: '#8FA4B5',    // 莫蘭迪粉藍
                            light: '#E5ECF4',     // 莫蘭迪極柔灰藍
                            bg: '#F4F6F8'         // 莫蘭迪淺背景
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F4F6F8;
            -webkit-font-smoothing: antialiased;
        }
        /* 莫蘭迪滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #E5ECF4;
        }
        ::-webkit-scrollbar-thumb {
            background: #8FA4B5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4A607A;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .hero-gradient {
            background: linear-gradient(135deg, #2E4053 0%, #4A607A 50%, #5D6D7E 100%);
        }
        .glow-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(74, 96, 122, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-700">

    <!-- 內部聲明橫幅：移除關閉按鈕，限制無法關閉 -->
    <div id="warning-banner" class="bg-amber-50 border-b border-amber-100 text-amber-900 px-4 py-3 text-xs sm:text-sm flex items-center justify-center gap-2 relative z-50 transition-all duration-300">
        <i class="ti ti-shield-lock text-amber-600 text-lg flex-shrink-0 animate-pulse"></i>
        <span class="font-medium text-center leading-relaxed">
            <strong class="font-bold text-amber-700">內部安全聲明：</strong>
            本系統所列之合作機構資料僅限校內授權人員與實習生瀏覽。嚴禁截圖、轉載或散布。
        </span>
    </div>

    <!-- 驗證等待中遮罩 -->
    <div id="view-loading" class="flex-1 flex flex-col items-center justify-center p-4 min-h-[calc(100vh-60px)] bg-[#F4F6F8]">
        <div class="animate-spin rounded-full h-10 w-10 border-2 border-slate-200 border-t-[#4A607A]"></div>
        <p class="text-xs text-slate-400 mt-4 tracking-wider">正在安全驗證帳戶身分，請稍候...</p>
    </div>

    <!-- 主版面系統介面 -->
    <div id="view-dashboard" class="hidden flex-1 flex flex-col">
        
        <!-- 【首頁滿版一】：上半部 Hero 區塊 (保持視覺大氣清爽) -->
        <header id="dashboard-hero" class="hero-gradient text-white relative min-h-[50vh] flex flex-col justify-between px-6 sm:px-8 overflow-hidden pt-12 pb-16">
            
            <!-- 原 Navbar 的登出與 greeting 元素 -->
            <div class="w-full max-w-6xl mx-auto pt-6 flex items-center justify-end z-30">
                <div class="flex items-center gap-3">
                    <div class="hidden sm:flex items-center gap-2 bg-white/10 border border-white/10 pl-3 pr-4 py-1.5 rounded-xl backdrop-blur-md">
                        <span id="user-greeting" class="text-xs font-semibold text-slate-200">同學，您好！</span>
                    </div>
                    <button id="btn-logout" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all backdrop-blur-md">
                        登出
                    </button>
                </div>
            </div>

            <!-- 置中核心主副標題 (無搜尋控制面板) -->
            <div class="max-w-6xl w-full mx-auto relative z-10 flex flex-col items-center my-auto text-center px-4">
                <div class="max-w-3xl space-y-4">
                    <h2 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight text-white">
                        開創未來航道，探索頂尖合作機構
                    </h2>
                    <p class="text-sm sm:text-lg text-slate-200/90 leading-relaxed max-w-2xl mx-auto font-light">
                        東海大學與全球卓越企業、非營利組織、政府機關展開長期深度合作，為您鋪墊最扎實的職涯銜接之路。
                    </p>
                </div>
            </div>

            <!-- 向下滾動導引 (Scroll Down Indicator) -->
            <div class="w-full flex flex-col items-center justify-center pb-4 z-25 text-slate-300">
                <a href="#view-list" class="flex flex-col items-center gap-1.5 text-xs font-bold hover:text-white transition-colors tracking-widest uppercase">
                    <span>向下探索合作機構</span>
                    <i class="ti ti-chevron-down text-lg animate-bounce"></i>
                </a>
            </div>
        </header>

        <!-- 【首頁滿版二】：下半部搜尋、篩選控制、卡片列表區與分頁控制 -->
        <main id="view-list" class="max-w-6xl w-full mx-auto px-4 sm:px-8 py-16 min-h-screen flex flex-col justify-between">
            <div class="w-full">
                
                <!-- 搜尋與篩選控制面板 (由 Hero 移至下半部起始端) -->
                <div class="w-full bg-white border border-slate-200 rounded-xl p-6 shadow-md mb-8 space-y-4 text-slate-700">
                    <!-- 關鍵字搜尋 -->
                    <div class="relative w-full">
                        <i class="ti ti-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
                        <input type="text" id="search-input" placeholder="搜尋機構名稱、主據點或海外中文譯名關鍵字..." class="w-full pl-12 pr-4 py-3.5 bg-[#F4F6F8] border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#4A607A] focus:border-transparent transition-all text-sm font-medium">
                    </div>

                    <!-- 四欄並排篩選器：國別、縣市、實習場所、行業別 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                        <!-- 1. 國別 -->
                        <div class="relative">
                            <select id="filter-country" class="w-full px-4 py-3 bg-[#F4F6F8] border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#4A607A] focus:border-transparent transition-all text-sm font-semibold appearance-none cursor-pointer text-slate-600">
                                <option value="">全部國別</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>

                        <!-- 2. 縣市別 -->
                        <div class="relative">
                            <select id="filter-city" class="w-full px-4 py-3 bg-[#F4F6F8] border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#4A607A] focus:border-transparent transition-all text-sm font-semibold appearance-none cursor-pointer text-slate-600">
                                <option value="">全部縣市</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>

                        <!-- 3. 實習場所 -->
                        <div class="relative">
                            <select id="filter-venue-type" class="w-full px-4 py-3 bg-[#F4F6F8] border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#4A607A] focus:border-transparent transition-all text-sm font-semibold appearance-none cursor-pointer text-slate-600">
                                <option value="">全部實習場所</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>

                        <!-- 4. 行業別 -->
                        <div class="relative">
                            <select id="filter-industry" class="w-full px-4 py-3 bg-[#F4F6F8] border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#4A607A] focus:border-transparent transition-all text-sm font-semibold appearance-none cursor-pointer text-slate-600">
                                <option value="">全部行業別</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <!-- 加載中 -->
                <div id="loading-state" class="py-20 flex flex-col items-center justify-center text-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-2 border-slate-200 border-t-[#4A607A]"></div>
                    <h3 class="mt-4 text-sm font-bold text-slate-600">資料加載中，請稍候...</h3>
                </div>

                <!-- 空狀態 (無卡片包覆，維持清爽直敘) -->
                <div id="empty-state" class="hidden py-16 flex flex-col items-center justify-center text-center p-8">
                    <div class="w-16 h-16 bg-slate-200/50 text-slate-400 rounded-full flex items-center justify-center mb-4">
                        <i class="ti ti-search-off text-3xl"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-700">未尋找到符合條件的合作機構</h3>
                    <p class="text-slate-400 text-xs mt-1">請嘗試調整您的篩選組合或縮減關鍵字。</p>
                </div>

                <!-- 機構卡片列表 (固定 1 頁 9 家：lg:grid-cols-3) -->
                <div id="inst-list" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- 莫蘭迪分頁器控制面板 -->
            <div id="pagination-panel" class="hidden flex items-center justify-center gap-2 mt-12"></div>
        </main>

        <!-- 個別機構詳情頁面 -->
        <main id="view-detail" class="hidden max-w-6xl w-full mx-auto px-4 sm:px-8 py-16 flex-1">
            <!-- 莫蘭迪圓角返回按鈕 -->
            <button id="btn-back" class="inline-flex items-center gap-2 text-[#4A607A] hover:text-[#2E4053] font-bold text-sm bg-white hover:bg-[#E5ECF4] border border-slate-200 hover:border-[#8FA4B5]/50 px-5 py-2.5 rounded-xl transition-all duration-300 shadow-sm hover:shadow active:scale-95 mb-6">
                <i class="ti ti-chevron-left text-base"></i> 返回機構列表
            </button>

            <!-- 詳情整合生成區 -->
            <div id="detail-content" class="space-y-6"></div>
        </main>
    </div>

    <!-- 全域 Modal 控制 -->
    <div id="confirm-modal" class="fixed inset-0 bg-[#2E4053]/20 backdrop-blur-sm z-[90] hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl border border-slate-200 shadow-2xl max-w-sm w-full p-6 animate-in fade-in zoom-in-95 duration-200">
            <h4 class="text-base font-bold text-slate-800 text-center" id="confirm-title">確認動作</h4>
            <p class="text-xs text-slate-400 text-center mt-2 leading-relaxed" id="confirm-desc">確定要執行此操作嗎？</p>
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button id="confirm-btn-cancel" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-all">
                    取消
                </button>
                <button id="confirm-btn-ok" class="py-2.5 bg-[#4A607A] hover:bg-[#2E4053] text-white font-bold rounded-xl text-xs transition-all shadow-sm">
                    確定
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 輕提示容器 -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none"></div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase 預配置
        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
        }

        // ================== 定義各欄位下拉數值 ==================
        const countriesList = [
            "中華民國", "大陸地區", "日本", "美國", "越南", "泰國", "澳大利亞", "香港", "澳門", "馬來西亞", 
            "菲律賓", "印尼", "印度", "孟加拉", "緬甸", "柬埔寨", "黎巴嫩", "蒙古", "巴西", "巴拉圭", "秘魯"
        ];

        const citiesList = [
            "臺北市", "新北市", "基隆市", "桃園市", "新竹縣", "新竹市", "苗栗縣", "臺中市", "彰化縣", 
            "南投縣", "雲林縣", "嘉義縣", "嘉義市", "臺南市", "高雄市", "屏東縣", "宜蘭縣", "花蓮縣", 
            "臺東縣", "澎湖縣", "金門縣", "連江縣"
        ];

        const industriesList = [
            "農、林、漁、牧業", "礦業及土石採取業", "製造業", "電力及燃氣供應業", "用水供應及污染整治業", 
            "營建工程業", "批發及零售業", "運輸及儲儲業", "住宿及餐飲業", "出版及影音等內容傳播業", 
            "電信及資訊服務業", "金融及保險業", "不動產業", "專業、科學及技術服務業", "支援服務業", 
            "公共行政及國防；強制性社會安全", "教育業", "醫療保健及社會工作服務業", "藝術、運動及休閒服務業", "其他服務業"
        ];

        const venueTypesList = ["企業機構", "政府機構", "其他機構"];

        // 全域狀態變數
        let treeData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 9; // 修改為每頁顯示 9 家機構

        // 當前詳情分支機構的縣市篩選狀態與分頁狀態
        let activeBranchCityFilter = '全部';
        let currentBranchPage = 1;
        const branchItemsPerPage = 5; // 分支機構每頁固定顯示 5 個

        const viewLoading = document.getElementById('view-loading');
        const viewDashboard = document.getElementById('view-dashboard');
        const viewList = document.getElementById('view-list');
        const viewDetail = document.getElementById('view-detail');
        
        const elList = document.getElementById('inst-list');
        const elLoading = document.getElementById('loading-state');
        const elEmpty = document.getElementById('empty-state');
        const elDetailContent = document.getElementById('detail-content');
        
        const inputSearch = document.getElementById('search-input');
        const selectCountry = document.getElementById('filter-country');
        const selectCity = document.getElementById('filter-city');
        const selectVenue = document.getElementById('filter-venue-type');
        const selectIndustry = document.getElementById('filter-industry');

        // ================== Auth 驗證與跳轉 ==================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 已登入，顯示系統
                viewLoading.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
                const displayName = user.email ? user.email.split('@')[0] : '授權人員';
                document.getElementById('user-greeting').textContent = `${displayName}，您好！`;
                
                // 啟動加載
                setupDropdowns();
                loadData();
            } else {
                // 未登入，重導向至登入頁面
                window.location.replace('login.html');
            }
        });

        function setupDropdowns() {
            selectCountry.innerHTML = '<option value="">全部國別</option>';
            selectCity.innerHTML = '<option value="">全部縣市</option>';
            selectVenue.innerHTML = '<option value="">全部實習場所</option>';
            selectIndustry.innerHTML = '<option value="">全部行業別</option>';

            countriesList.forEach(c => selectCountry.add(new Option(c, c)));
            citiesList.forEach(c => selectCity.add(new Option(c, c)));
            venueTypesList.forEach(v => selectVenue.add(new Option(v, v)));
            industriesList.forEach(i => selectIndustry.add(new Option(i, i)));
        }

        // 登出
        document.getElementById('btn-logout').addEventListener('click', () => {
            showConfirm("登出確認", "您確定要登出系統嗎？", async () => {
                await signOut(auth);
            });
        });

        // 返回
        document.getElementById('btn-back').addEventListener('click', () => {
            viewDetail.classList.add('hidden');
            viewList.classList.remove('hidden');
            document.getElementById('dashboard-hero').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 欄位標準化對照
        function normalizeItem(d) {
            return {
                id: d.id,
                name: d["input-name"] || d.name || d.input_name || '',
                nameTranslated: d["input-name-translated"] || d.name_translated || d.input_name_translated || '',
                country: d["input-country"] || d.country || d.input_country || '中華民國',
                city: d["input-city"] || d.city || d.input_city || '',
                address: d["input-address"] || d.address || d.input_address || '',
                industry: d["input-industry"] || d.industry || d.input_industry || '',
                venueType: d["input-venue-type"] || d.venue_type || d.input_venue_type || '',
                parentSearchInput: d["parent-search-input"] || d.parent_id || d.parent_search_input || null
            };
        }

        // ================== 資料讀取流程 ==================
        async function loadData() {
            elLoading.classList.remove('hidden');
            elList.classList.add('hidden');
            elEmpty.classList.add('hidden');
            document.getElementById('pagination-panel').classList.add('hidden');

            try {
                if (!db) throw new Error("Firestore 未加載成功");
                const snapshot = await getDocs(collection(db, 'internship_institutions'));
                const allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                buildTreeStructure(allData);
                
                elLoading.classList.add('hidden');

                // 註冊篩選聯動
                inputSearch.addEventListener('input', () => { currentPage = 1; renderList(); });
                selectCountry.addEventListener('change', handleCountryChange);
                selectCity.addEventListener('change', () => { currentPage = 1; renderList(); });
                selectVenue.addEventListener('change', () => { currentPage = 1; renderList(); });
                selectIndustry.addEventListener('change', () => { currentPage = 1; renderList(); });

                renderList();

            } catch (error) {
                console.error("載入失敗:", error);
                elLoading.innerHTML = `
                    <div class="text-slate-600 py-8 flex flex-col items-center">
                        <i class="ti ti-alert-triangle text-3xl mb-3 text-rose-500"></i>
                        <h4 class="font-bold text-sm">連線暫時中斷</h4>
                        <p class="text-slate-400 text-xs mt-1">無法成功連接 Firebase 資料庫，請檢查您的網路狀態或系統權限設定。</p>
                    </div>
                `;
            }
        }

        function buildTreeStructure(rawItems) {
            const normalized = rawItems.map(normalizeItem);
            const parents = normalized.filter(d => !d.parentSearchInput);
            const children = normalized.filter(d => d.parentSearchInput);

            treeData = parents.map(p => {
                const branches = children.filter(c => c.parentSearchInput === p.id);
                branches.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
                return { ...p, branches };
            });

            treeData.sort((a, b) => (a.name).localeCompare(b.name, 'zh-TW'));
        }

        // ================== 篩選聯動交互 (國別切換，其餘重設並強制海外規則) ==================
        function handleCountryChange() {
            const countryVal = selectCountry.value;
            currentPage = 1;
            
            // 每次切換國別，立刻重設其他三個篩選器
            selectCity.value = '';
            selectVenue.value = '';
            selectIndustry.value = '';
            
            if (countryVal && countryVal !== '中華民國') {
                // 海外鎖定邏輯
                selectCity.disabled = true;
                selectCity.classList.add('bg-slate-200/50', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
                
                selectVenue.value = '其他機構';
                selectVenue.disabled = true;
                selectVenue.classList.add('bg-slate-200/50', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
            } else {
                // 恢復國內 / 全部狀態
                selectCity.disabled = false;
                selectCity.classList.remove('bg-slate-200/50', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
                
                selectVenue.disabled = false;
                selectVenue.classList.remove('bg-slate-200/50', 'text-slate-400', 'cursor-not-allowed', 'opacity-60');
            }
            
            renderList();
        }

        // ================== 分頁與列表渲染邏輯 ==================
        function renderList() {
            const term = inputSearch.value.trim().toLowerCase();
            const filterCountry = selectCountry.value;
            const filterCity = selectCity.value;
            const filterVenue = selectVenue.value;
            const filterIndustry = selectIndustry.value;

            filteredData = treeData.filter(p => {
                const matchTerm = !term || 
                                  p.name.toLowerCase().includes(term) || 
                                  p.nameTranslated.toLowerCase().includes(term) || 
                                  p.branches.some(b => b.name.toLowerCase().includes(term));
                
                const matchCountry = !filterCountry || p.country === filterCountry || p.branches.some(b => b.country === filterCountry);
                const matchCity = selectCity.disabled || !filterCity || p.city === filterCity || p.branches.some(b => b.city === filterCity);
                const matchVenue = !filterVenue || p.venueType === filterVenue;
                const matchIndustry = !filterIndustry || p.industry === filterIndustry;

                return matchTerm && matchCountry && matchCity && matchVenue && matchIndustry;
            });

            if (filteredData.length === 0) {
                elList.classList.add('hidden');
                document.getElementById('pagination-panel').classList.add('hidden');
                elEmpty.classList.remove('hidden');
                return;
            }

            elEmpty.classList.add('hidden');
            elList.classList.remove('hidden');

            renderPage();
        }

        function renderPage() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages || 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(startIndex, startIndex + itemsPerPage);

            elList.innerHTML = pageItems.map(inst => {
                const isOverseas = inst.country && inst.country !== '中華民國';
                
                // 境外機構首頁不顯示原名，只顯示譯名
                let displayName = inst.name;
                if (isOverseas && inst.nameTranslated) {
                    displayName = inst.nameTranslated;
                }

                return `
                    <div class="glow-hover bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm flex flex-col justify-between cursor-pointer min-h-[160px]" onclick="openDetail('${inst.id}')">
                        <div>
                            <!-- LOGO大小固定為正方形，對齊名稱，名稱太長可自動換行 -->
                            <div class="flex items-start gap-4 mb-3">
                                <div class="w-14 h-14 bg-[#E5ECF4] text-[#4A607A] flex items-center justify-center text-xl flex-shrink-0 rounded-xl">
                                    <i class="ti ti-building"></i>
                                </div>
                                <div class="flex-1 min-w-0 py-0.5">
                                    <h4 class="font-bold text-slate-800 text-sm sm:text-base leading-snug break-words whitespace-normal hover:text-[#4A607A] transition-colors">${displayName}</h4>
                                </div>
                            </div>
                        </div>

                        <!-- 標籤改移到箭頭的最左側，去除據點數及底層分隔線 -->
                        <div class="flex items-center justify-between gap-2 mt-auto pt-3 border-t border-slate-100/60">
                            <div class="flex flex-wrap gap-1.5 max-w-[85%]">
                                ${inst.industry ? `<span class="bg-[#E5ECF4] text-[#4A607A] text-[10px] font-semibold px-2.5 py-0.5 rounded">${inst.industry}</span>` : ''}
                                ${inst.venueType ? `<span class="bg-[#EBF3F5] text-[#2E5B44] text-[10px] font-semibold px-2.5 py-0.5 rounded">${inst.venueType}</span>` : ''}
                            </div>
                            <div class="text-slate-300 flex-shrink-0 ml-auto">
                                <i class="ti ti-chevron-right text-lg"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPaginationControls(totalPages);
        }

        // ================== 分頁器：限定鄰近頁碼，防止過多時破圖 ==================
        function renderPaginationControls(totalPages) {
            const panel = document.getElementById('pagination-panel');
            if (totalPages <= 1) {
                panel.classList.add('hidden');
                return;
            }
            panel.classList.remove('hidden');

            let html = '';
            
            // 上一頁
            html += `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-[#4A607A] hover:bg-[#E5ECF4] transition-all disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed text-xs font-bold flex items-center gap-1">
                    <i class="ti ti-chevron-left"></i>
                </button>
            `;

            // 智慧截斷型頁碼生成邏輯
            const maxPageButtons = 5; // 最大同時顯示的頁碼按鈕數
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

            if (endPage - startPage < maxPageButtons - 1) {
                startPage = Math.max(1, endPage - maxPageButtons + 1);
            }

            // 首頁
            if (startPage > 1) {
                html += `
                    <button onclick="changePage(1)" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-[#4A607A] hover:bg-[#E5ECF4] text-xs font-bold transition-all">1</button>
                `;
                if (startPage > 2) {
                    html += `<span class="text-slate-400 text-xs px-1">...</span>`;
                }
            }

            // 區間頁碼
            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `
                        <button class="px-3.5 py-2 rounded-xl bg-[#4A607A] text-white font-bold text-xs shadow-sm transition-all">
                            ${i}
                        </button>
                    `;
                } else {
                    html += `
                        <button onclick="changePage(${i})" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-[#4A607A] hover:bg-[#E5ECF4] font-bold text-xs transition-all">
                            ${i}
                        </button>
                    `;
                }
            }

            // 尾頁
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<span class="text-slate-400 text-xs px-1">...</span>`;
                }
                html += `
                    <button onclick="changePage(${totalPages})" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-[#4A607A] hover:bg-[#E5ECF4] text-xs font-bold transition-all">${totalPages}</button>
                `;
            }

            // 下一頁
            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-[#4A607A] hover:bg-[#E5ECF4] transition-all disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed text-xs font-bold flex items-center gap-1">
                    <i class="ti ti-chevron-right"></i>
                </button>
            `;

            panel.innerHTML = html;
        }

        window.changePage = function(page) {
            currentPage = page;
            renderPage();
            // 平滑滾動至下半部列表起始處
            const listSection = document.getElementById('view-list');
            if (listSection) {
                listSection.scrollIntoView({ behavior: 'smooth' });
            }
        };

        // ================== 個別頁面：詳情與分支機構控制 ==================
        window.openDetail = function(instId) {
            const inst = treeData.find(d => d.id === instId);
            if (!inst) return;

            viewList.classList.add('hidden');
            document.getElementById('dashboard-hero').classList.add('hidden');
            viewDetail.classList.remove('hidden');

            activeBranchCityFilter = '全部';
            currentBranchPage = 1; // 每次打開詳情，重設分支機構分頁
            renderDetailView(inst);
        };

        function renderDetailView(inst) {
            const isOverseas = inst.country && inst.country !== '中華民國';

            let displayNameText = inst.name;
            // 海外機構：中文譯名（原始名稱）
            if (isOverseas && inst.nameTranslated) {
                displayNameText = `${inst.nameTranslated}（${inst.name}）`;
            }

            // 提取子機構的獨特縣市
            const uniqueCities = [...new Set(inst.branches.map(b => b.city).filter(Boolean))].sort();

            // 縣市篩選 Pills 按鈕 (國內機構專屬)
            let cityFiltersHtml = '';
            if (!isOverseas && inst.branches.length > 0 && uniqueCities.length > 0) {
                cityFiltersHtml = `
                    <div class="flex flex-wrap gap-2 mb-5">
                        <button id="pill-all" onclick="filterBranchCity('全部', '${inst.id}')" class="px-3.5 py-1.5 text-xs font-bold rounded-xl transition-all ${activeBranchCityFilter === '全部' ? 'bg-[#4A607A] text-white shadow-sm' : 'bg-[#E5ECF4] text-[#4A607A] hover:bg-[#8FA4B5]/20'}">
                            全部
                        </button>
                        ${uniqueCities.map(city => `
                            <button id="pill-${city}" onclick="filterBranchCity('${city}', '${inst.id}')" class="px-3.5 py-1.5 text-xs font-bold rounded-xl transition-all ${activeBranchCityFilter === city ? 'bg-[#4A607A] text-white shadow-sm' : 'bg-[#E5ECF4] text-[#4A607A] hover:bg-[#8FA4B5]/20'}">
                                ${city}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            elDetailContent.innerHTML = `
                <!-- 1. 上方總機構橫向面版 (圓角修正為 rounded-xl) -->
                <div class="bg-white border border-slate-200 rounded-xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-col md:flex-row items-center md:items-stretch gap-6">
                        
                        <!-- 左側莫蘭迪藍 Office 容器 (與右側三行等高) -->
                        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-gradient-to-tr from-thu-deep to-[#5D6D7E] text-white flex items-center justify-center text-3xl flex-shrink-0 shadow-sm">
                            <i class="ti ti-building"></i>
                        </div>

                        <!-- 右側機構資訊 (標籤與地址字元調大一號) -->
                        <div class="flex-1 flex flex-col justify-between py-1 space-y-2.5 text-center md:text-left min-w-0">
                            <!-- 第一行：機構名稱 -->
                            <div>
                                <h2 class="text-lg sm:text-xl font-bold text-slate-800 tracking-tight leading-snug">${displayNameText}</h2>
                            </div>

                            <!-- 第二行：標籤組 (字元調大一號：text-sm sm:text-base) -->
                            <div class="flex flex-wrap justify-center md:justify-start gap-2">
                                ${inst.venueType ? `
                                    <span class="inline-flex bg-[#EBF3F5] text-[#2E5B44] text-sm sm:text-base font-bold px-3 py-1 rounded-lg">
                                        ${inst.venueType}
                                    </span>
                                ` : ''}

                                ${inst.industry ? `
                                    <span class="inline-flex bg-[#E5ECF4] text-[#4A607A] text-sm sm:text-base font-bold px-3 py-1 rounded-lg">
                                        ${inst.industry}
                                    </span>
                                ` : ''}
                            </div>

                            <!-- 第三行：地址資訊列 (字元調大一號：text-base sm:text-lg) -->
                            <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 text-slate-500 text-base sm:text-lg">
                                <i class="ti ti-map-pin text-[#8FA4B5] text-lg"></i>
                                
                                <!-- 國別標籤置於 Icon 正後方 (字元調大一號：text-sm sm:text-base) -->
                                ${isOverseas ? `
                                    <span class="inline-flex bg-[#F5EBEB] text-[#A66C6C] text-sm sm:text-base font-bold px-3 py-1 rounded-lg">
                                        ${inst.country}
                                    </span>
                                ` : ''}
                                
                                <span class="font-medium text-slate-600 truncate max-w-full" title="${inst.address || ''}">
                                    ${inst.address || '無登記主地址'}
                                </span>
                                ${inst.address ? `
                                    <button onclick="copyAddress('${inst.address}')" class="p-1 hover:bg-slate-100 text-slate-400 hover:text-slate-800 rounded transition-colors" title="複製地址">
                                        <i class="ti ti-copy text-sm"></i>
                                    </button>
                                ` : ''}
                            </div>

                        </div>
                    </div>
                </div>

                <!-- 2. 下方分支機構/分所列表 (高度一律固定為 5 個據點高度，約 250px) -->
                <div class="bg-white border border-slate-200 rounded-xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-5">
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base">
                            分支機構列表
                        </h3>
                        <span id="branch-total-count" class="bg-[#E5ECF4] text-[#4A607A] font-bold px-3 py-1 rounded-xl text-xs">
                            共 0 處
                        </span>
                    </div>

                    <!-- 國內縣市篩選 Pills -->
                    ${cityFiltersHtml}

                    <!-- 分支機構固定 5 行高度的容器 (就算無據點，高度也固定在 250px) -->
                    <div class="flex flex-col justify-between min-h-[300px]">
                        <div id="branches-list-wrapper" class="divide-y divide-slate-100 flex-1">
                            <!-- JS 動態生成分支項目 -->
                        </div>
                        
                        <!-- 分支局部換頁器 -->
                        <div id="branch-local-pagination" class="flex justify-between items-center pt-4 border-t border-slate-100 mt-4">
                            <!-- JS 動態生成上一頁/下一頁按鈕 -->
                        </div>
                    </div>
                </div>
            `;

            renderBranchesContainer(inst);
        }

        // ================== 分支機構列表分頁與固定高度核心 ==================
        function renderBranchesContainer(inst) {
            const isOverseas = inst.country && inst.country !== '中華民國';
            
            // 依據篩選值過濾分支
            let displayBranches = inst.branches || [];
            if (activeBranchCityFilter !== '全部') {
                displayBranches = inst.branches.filter(b => b.city === activeBranchCityFilter);
            }

            // 更新分支數量標籤
            document.getElementById('branch-total-count').textContent = `共 ${displayBranches.length} 處`;

            const branchesWrapper = document.getElementById('branches-list-wrapper');
            const paginationWrapper = document.getElementById('branch-local-pagination');

            if (displayBranches.length === 0) {
                // 無資料狀態：完全移除虛線框與任何卡片包覆，保留固定 250px 高度之極簡居中提示
                branchesWrapper.innerHTML = `
                    <div class="h-[250px] flex items-center justify-center text-center bg-transparent">
                        <p class="text-slate-400 text-xs font-bold">該機構暫無其他分支機構</p>
                    </div>
                `;
                paginationWrapper.innerHTML = '';
                return;
            }

            // 分支分頁計算
            const totalBranchPages = Math.ceil(displayBranches.length / branchItemsPerPage);
            if (currentBranchPage > totalBranchPages) currentBranchPage = totalBranchPages || 1;

            const startIndex = (currentBranchPage - 1) * branchItemsPerPage;
            const slicedBranches = displayBranches.slice(startIndex, startIndex + branchItemsPerPage);

            // 生成分支項目 (固定單個高度，確保不滿 5 個時使用透明佔位槽補齊高度，確保高度固定)
            let listHtml = '';
            for (let i = 0; i < branchItemsPerPage; i++) {
                const branch = slicedBranches[i];
                if (branch) {
                    // 第一個項目不要顯示上方邊框
                    const borderClass = i === 0 ? 'border-t-0 pt-1' : 'border-t border-slate-100 pt-3';
                    const domesticCityTag = (!isOverseas && branch.city) 
                        ? `<span class="bg-[#E5ECF4] text-[#4A607A] text-[11px] font-bold px-2.5 py-0.5 rounded mr-3 flex-shrink-0">${branch.city}</span>` 
                        : '';
                    listHtml += `
                        <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 h-[50px] ${borderClass}">
                            <div class="flex items-center min-w-0">
                                ${domesticCityTag}
                                <span class="font-semibold text-slate-700 text-xs sm:text-sm truncate">${branch.name}</span>
                            </div>
                            <span class="text-[11px] sm:text-xs text-slate-400 break-all truncate max-w-xs sm:max-w-md">${branch.address || '無詳細通訊地址'}</span>
                        </div>
                    `;
                } else {
                    // 佔位項目：維持純白透明，確保高度穩定，第一個項目依然不要邊框
                    const borderClass = i === 0 ? 'border-t-0' : 'border-t border-transparent';
                    listHtml += `
                        <div class="py-3 h-[50px] ${borderClass} opacity-0 pointer-events-none"></div>
                    `;
                }
            }
            branchesWrapper.innerHTML = listHtml;

            // 分支換頁按鈕 (若總頁數 > 1 時顯示)
            if (totalBranchPages > 1) {
                paginationWrapper.innerHTML = `
                    <button onclick="changeBranchPage(${currentBranchPage - 1}, '${inst.id}')" ${currentBranchPage === 1 ? 'disabled' : ''} class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-bold text-[#4A607A] hover:bg-[#E5ECF4] transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                        上一頁
                    </button>
                    <span class="text-xs text-slate-400 font-bold">${currentBranchPage} / ${totalBranchPages}</span>
                    <button onclick="changeBranchPage(${currentBranchPage + 1}, '${inst.id}')" ${currentBranchPage === totalBranchPages ? 'disabled' : ''} class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-bold text-[#4A607A] hover:bg-[#E5ECF4] transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                        下一頁
                    </button>
                `;
            } else {
                paginationWrapper.innerHTML = `
                    <div class="text-xs text-slate-300 font-medium">單頁分支據點</div>
                `;
            }
        }

        // 分支機構換頁事件
        window.changeBranchPage = function(targetPage, instId) {
            currentBranchPage = targetPage;
            const inst = treeData.find(d => d.id === instId);
            if (inst) {
                renderBranchesContainer(inst);
            }
        };

        // 詳情內的分支縣市過濾動態重新整理
        window.filterBranchCity = function(city, instId) {
            activeBranchCityFilter = city;
            currentBranchPage = 1; // 縣市篩選切換時自動回到第一頁
            const inst = treeData.find(d => d.id === instId);
            if (inst) {
                renderDetailView(inst);
            }
        };

        // 地址複製
        window.copyAddress = function(text) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast("地址複製成功！", "success");
            } catch (err) {
                showToast("複製失敗，請手動複製", "error");
            }
            document.body.removeChild(tempInput);
        };

        // ================== Toast 與 Modal 互動 ==================
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-white text-slate-800 border-slate-100';
            let iconClass = 'ti-circle-check text-slate-600';
            
            if (type === 'success') {
                bgClass = 'bg-[#E5ECF4] text-[#4A607A] border-transparent';
                iconClass = 'ti-circle-check text-[#4A607A]';
            } else if (type === 'error') {
                bgClass = 'bg-rose-50 text-rose-900 border-rose-100';
                iconClass = 'ti-circle-x text-rose-600';
            } else if (type === 'info') {
                bgClass = 'bg-slate-100 text-slate-700 border-slate-200';
                iconClass = 'ti-info-circle text-slate-600';
            }

            toast.className = `flex items-center gap-3 px-4 py-2.5 rounded-xl border shadow-lg ${bgClass} transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto max-w-sm w-72 sm:w-auto`;
            toast.style.padding = '10px 16px';
            toast.innerHTML = `
                <i class="ti ${iconClass} text-base flex-shrink-0"></i>
                <span class="text-xs font-semibold leading-normal">${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-[-10px]', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        };

        window.showConfirm = function(title, desc, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const elTitle = document.getElementById('confirm-title');
            const elDesc = document.getElementById('confirm-desc');
            const btnCancel = document.getElementById('confirm-btn-cancel');
            const btnOk = document.getElementById('confirm-btn-ok');

            elTitle.textContent = title;
            elDesc.textContent = desc;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const close = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };

            btnCancel.onclick = close;
            btnOk.onclick = () => {
                onConfirm();
                close();
            };
        };

    </script>
</body>
</html>
