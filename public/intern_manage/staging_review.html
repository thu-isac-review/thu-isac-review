<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯入資料審查中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #f8fafc; margin: 0; padding: 0; font-family: "SF Pro TC", "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* 優雅的滾動條 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #ffffff; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        
        /* 現代 SaaS 輸入框風格 */
        .modern-input { 
            width: 100%; min-height: 38px; 
            background-color: #f1f5f9; border: 1px solid transparent; 
            padding: 6px 12px; border-radius: 8px; 
            font-size: 13px; font-weight: 600; color: #334155; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .modern-input:hover:not(:disabled) { background-color: #e2e8f0; }
        .modern-input:focus:not(:disabled) { 
            background-color: #ffffff; border-color: #818cf8; 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); outline: none; 
        }
        .modern-input:disabled { 
            color: #94a3b8; background-color: #f8fafc; 
            cursor: not-allowed; opacity: 0.7;
        }
        
        /* 下拉選單箭頭優化 */
        .modern-select { 
            appearance: none; 
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); 
            background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.2em 1.2em; 
            padding-right: 2rem; cursor: pointer;
        }

        /* 高質感凍結窗格 (解決滾動破圖) */
        .sticky-col { position: sticky; z-index: 10; background-color: inherit; }
        .sticky-col::after {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
            background-color: #e2e8f0; pointer-events: none;
        }
        .sticky-shadow::after {
            content: ''; position: absolute; top: 0; right: -5px; bottom: 0; width: 5px;
            background: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 100%); pointer-events: none;
        }
        
        thead th.sticky-col { z-index: 30; background-color: #f8fafc; }
        
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <div class="shrink-0 px-8 pt-8 pb-4 z-20 animate-fade">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-50/50 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex items-center gap-5 relative z-10">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-500/20 shrink-0">
                    <i class="fa-solid fa-layer-group text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-slate-800 tracking-tight">批次匯入審查中心</h2>
                    <p class="text-sm text-slate-500 mt-1 font-medium leading-relaxed">
                        上傳總表後資料將安全暫存於雲端。請核實下方機構與紀錄細節，確認無誤後點擊放行。
                    </p>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3 relative z-10">
                <button onclick="window.downloadTemplate()" class="h-11 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-5 rounded-xl text-sm transition-all shadow-sm flex items-center gap-2 active:scale-95">
                    <i class="fa-solid fa-download text-emerald-500 text-base"></i> 下載匯入範本
                </button>
                <button id="btn-upload" onclick="document.getElementById('import-file').click()" class="h-11 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20 flex items-center gap-2 active:scale-95">
                    <i class="fa-solid fa-cloud-arrow-up text-base"></i> 上傳資料總表 (CSV)
                </button>
                <input type="file" id="import-file" accept=".csv" class="hidden" onchange="window.processImport(event)">
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-hidden px-8 pb-8 flex flex-col animate-fade" style="animation-delay: 0.1s;">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-1 overflow-hidden">
            
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex justify-between items-center shrink-0 z-20">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-6 bg-indigo-500 rounded-full"></div>
                    <h3 class="text-base font-black text-slate-800">待核實紀錄</h3>
                    <span id="staging-count" class="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md text-xs font-bold border border-indigo-100/50">載入中...</span>
                </div>
                <div class="flex gap-2.5">
                    <button onclick="window.clearAllStaging()" class="h-9 text-xs bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 px-4 rounded-lg transition-colors font-bold shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> 清空全部暫存
                    </button>
                    <button onclick="window.approveAll()" class="h-9 text-xs bg-emerald-500 hover:bg-emerald-600 text-white px-4 rounded-lg transition-colors font-bold shadow-sm shadow-emerald-500/20 flex items-center gap-1.5">
                        <i class="fa-solid fa-check-double"></i> 批次核准全部
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-auto custom-scrollbar relative">
                <table class="w-full text-left table-fixed border-collapse min-w-[2100px]">
                    <thead class="sticky top-0 z-30 shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
                        <tr class="bg-slate-50">
                            <th colspan="3" class="px-4 py-2.5 text-center text-[11px] font-black text-slate-500 uppercase tracking-widest sticky-col sticky-shadow" style="left: 0; background-color: #f8fafc;">學生與課程 (唯讀區)</th>
                            <th colspan="5" class="px-4 py-2.5 text-center text-[11px] font-black text-indigo-500 uppercase tracking-widest border-l border-slate-200">實習機構資訊核實</th>
                            <th colspan="7" class="px-4 py-2.5 text-center text-[11px] font-black text-emerald-600 uppercase tracking-widest border-l border-slate-200">實習條件紀錄核實</th>
                        </tr>
                        <tr class="bg-white border-b border-slate-200">
                            <th class="px-4 py-3 text-center text-[13px] font-bold text-slate-600 w-[100px] sticky-col" style="left: 0;">操作</th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[160px] sticky-col" style="left: 100px;">學生身分</th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[220px] sticky-col sticky-shadow" style="left: 260px;">聚合課程標籤</th>
                            
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[130px] border-l border-slate-200">國別 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[240px]">機構名稱 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[140px]">統一編號</th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[130px]">縣市別</th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 min-w-[240px]">完整地址 <span class="text-rose-500 ml-0.5">*</span></th>
                            
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[200px] border-l border-slate-200">起訖時間 (Y/M/D) <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-center text-[13px] font-bold text-slate-600 w-[100px]">總時數 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[150px]">時間分類 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[150px]">證明文件 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[150px]">投保情形 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[110px]">勞雇關係 <span class="text-rose-500 ml-0.5">*</span></th>
                            <th class="px-4 py-3 text-left text-[13px] font-bold text-slate-600 w-[160px]">負責系所</th>
                        </tr>
                    </thead>
                    <tbody id="staging-table-body" class="bg-white">
                        <tr>
                            <td colspan="15" class="px-6 py-32 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-indigo-400"></i>
                                <p class="font-bold text-sm tracking-wide">與伺服器連線中...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY", authDomain: "thu-isac-review.firebaseapp.com", projectId: "thu-isac-review", storageBucket: "thu-isac-review.firebasestorage.app", messagingSenderId: "453299876735", appId: "1:453299876735:web:1d8babca3315423161a04a" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);

        let existingStudents = [];
        let existingCourses = [];
        let existingInstitutions = [];
        let stagingData = []; 
        
        const CITIES = ["臺北市","新北市","基隆市","桃園市","新竹縣","新竹市","苗栗縣","臺中市","彰化縣","南投縣","雲林縣","嘉義縣","嘉義市","臺南市","高雄市","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];
        const periodOptions = ['寒假實習', '暑假實習', '學期期間實習', '單一學期實習', '全學年'];
        const proofOptions = ['合約', '公函', '其他證明文件'];
        const insOptions = ['僅校外實習保險', '僅勞保', '兩者皆有', '兩者皆無'];
        const empOptions = ['是', '否'];
        const countryOptions = ["中華民國","大陸地區","日本","美國","越南","泰國","澳大利亞","香港","澳門","馬來西亞","菲律賓","印尼","印度"];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const [sSnap, cSnap, iSnap] = await Promise.all([
                    getDocs(collection(db, "internship_students")),
                    getDocs(collection(db, "internship_courses")),
                    getDocs(collection(db, "internship_institutions"))
                ]);
                existingStudents = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                existingCourses = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                existingInstitutions = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                onSnapshot(collection(db, "internship_staging"), (snapshot) => {
                    stagingData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    document.getElementById('staging-count').innerText = `${stagingData.length} 筆資料`;
                    renderStagingTable();
                });
            }
        });

        const makeSelect = (val, options, fieldName, docId) => {
            let html = `<select id="${fieldName}_${docId}" class="modern-input modern-select" onblur="window.autoSave('${docId}', '${fieldName}', this.value)">`;
            html += `<option value="">請選擇</option>`;
            options.forEach(opt => {
                html += `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`;
            });
            html += `</select>`;
            return html;
        };

        window.downloadTemplate = () => {
            const header = "學生學院,學生學系,學號,姓名,性別,國籍,當學年年級,機構國別,機構名稱,統一編號,縣市別,完整實習地址,學年度,學期,開課學院,開課學系,選課代號,課程名稱,開課學制,實習課程屬性,實習學分數,實習起訖時間,核定時數,實習時間分類,證明文件類型,投保情形,勞雇關係,負責填報系所\n";
            const example = "工學院,工工系,S1101234,王小明,男,本國籍,3,中華民國,台積電,12345678,臺中市,臺灣大道四段1727號,114,1,工學院,工工系,1234,企業實習,日間學士班,必修,3,114/07/01-114/08/31,160,暑假實習,合約,兩者皆有,是,工工系\n";
            const blob = new Blob(['\uFEFF' + header + example], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = "批次匯入審查_標準範本.csv"; link.click();
        };

        window.processImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const btn = document.getElementById('btn-upload');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 處理中...';
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const rows = event.target.result.split('\n').map(row => row.trim()).filter(row => row);
                    const batch = writeBatch(db); 
                    let aggregatedRecordsMap = new Map();

                    for (let i = 1; i < rows.length; i++) {
                        let cols = []; let inQuotes = false; let currentVal = '';
                        for (let char of rows[i]) {
                            if (char === '"') inQuotes = !inQuotes;
                            else if (char === ',' && !inQuotes) { cols.push(currentVal.trim()); currentVal = ''; }
                            else currentVal += char;
                        }
                        cols.push(currentVal.trim());
                        while(cols.length < 28) cols.push('');

                        const stu_id = (cols[2] || '').toUpperCase(); const stu_name = cols[3];
                        const inst_country = cols[7] || '中華民國'; const inst_name = cols[8];
                        const duration = cols[21]; const hours = Number(cols[22]) || 0;

                        if (!stu_id || !inst_name || !duration) continue;

                        const isStuExist = existingStudents.some(s => s.student_id === stu_id);
                        if (!isStuExist) {
                            const stuRef = doc(collection(db, "internship_students"));
                            batch.set(stuRef, { college: cols[0], department: cols[1], student_id: stu_id, name: stu_name, gender: cols[4] || '男', nationality: cols[5] || '本國籍', created_at: serverTimestamp() });
                            existingStudents.push({ id: stuRef.id, student_id: stu_id }); 
                        }

                        const c_code = cols[16]; const c_name = cols[17];
                        if (c_code && c_name) {
                            const isCourseExist = existingCourses.some(c => c.academic_year === cols[12] && c.term === cols[13] && c.course_code === c_code);
                            if (!isCourseExist) {
                                const courseRef = doc(collection(db, "internship_courses"));
                                batch.set(courseRef, { academic_year: cols[12], term: cols[13], semester: `${cols[12]}-${cols[13]}`, college: cols[14], department: cols[15], course_code: c_code, course_name: c_name, edu_system: cols[18], course_type: cols[19], credits: Number(cols[20])||0, sortOrder: 999, created_at: serverTimestamp() });
                                existingCourses.push({ id: courseRef.id, academic_year: cols[12], term: cols[13], course_code: c_code });
                            }
                        }

                        const safeKey = `${stu_id}_${inst_name}_${duration}`.replace(/[\/\\]/g, ''); 
                        const matchCourse = existingCourses.find(c => c.academic_year === cols[12] && c.term === cols[13] && c.course_code === c_code);
                        const courseIdObj = matchCourse ? { id: matchCourse.id, code: c_code, name: c_name } : { id: 'new', code: c_code, name: c_name };

                        if (aggregatedRecordsMap.has(safeKey)) {
                            let existingRecord = aggregatedRecordsMap.get(safeKey);
                            existingRecord.hours += hours;
                            if (!existingRecord.coursesInfo.some(c => c.code === courseIdObj.code)) {
                                existingRecord.coursesInfo.push(courseIdObj);
                            }
                        } else {
                            aggregatedRecordsMap.set(safeKey, {
                                stuId: stu_id, stuName: stu_name, grade: cols[6],
                                inst_country, inst_name, inst_tax: cols[9], inst_city: cols[10], inst_addr: cols[11],
                                duration, hours, period_type: cols[23], proof_type: cols[24], insurance: cols[25], employment: cols[26], resp_dept: cols[27],
                                coursesInfo: [courseIdObj], created_at: serverTimestamp()
                            });
                        }
                    }

                    aggregatedRecordsMap.forEach((data, key) => {
                        const stagingRef = doc(db, 'internship_staging', key);
                        batch.set(stagingRef, data, { merge: true }); 
                    });

                    await batch.commit();
                    alert("✅ 檔案解析完畢！資料已存入雲端暫存區，請接續進行審查。");

                } catch (error) { 
                    alert("處理發生錯誤：\n" + error.message); 
                } finally {
                    e.target.value = '';
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            };
            reader.readAsText(file);
        };

        window.handleRowCountryChange = (docId) => {
            const countryEl = document.getElementById(`inst_country_${docId}`);
            const taxEl = document.getElementById(`inst_tax_${docId}`);
            const cityEl = document.getElementById(`inst_city_${docId}`);
            
            if (countryEl.value !== '中華民國') {
                taxEl.value = ''; taxEl.disabled = true;
                cityEl.value = ''; cityEl.disabled = true;
            } else {
                taxEl.disabled = false;
                cityEl.disabled = false;
            }
            window.autoSave(docId, 'inst_country', countryEl.value);
            window.autoSave(docId, 'inst_tax', taxEl.value);
            window.autoSave(docId, 'inst_city', cityEl.value);
        };

        window.autoSave = (docId, field, value) => {
            const record = stagingData.find(d => d.id === docId);
            if(record && record[field] !== value) {
                setDoc(doc(db, 'internship_staging', docId), { [field]: value }, { merge: true });
            }
        };

        function renderStagingTable() {
            const tbody = document.getElementById('staging-table-body');
            if (stagingData.length === 0) {
                tbody.innerHTML = `<tr>
                    <td colspan="15" class="px-6 py-24 text-center">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 text-slate-300 mb-4">
                            <i class="fa-solid fa-inbox text-3xl"></i>
                        </div>
                        <p class="text-slate-500 font-bold text-base">目前暫存區淨空，尚無待審查紀錄。</p>
                        <p class="text-slate-400 text-sm mt-1">請由右上方點擊「上傳資料總表」匯入 CSV。</p>
                    </td>
                </tr>`;
                return;
            }

            let html = '';
            stagingData.forEach(row => {
                const id = row.id;
                const courseBadges = row.coursesInfo.map(c => `<span class="inline-block bg-indigo-50 border border-indigo-200 text-indigo-700 px-2 py-0.5 rounded text-[11px] font-bold mr-1 mb-1">${c.code} ${c.name}</span>`).join('');
                
                const isOverseas = row.inst_country !== '中華民國';
                const taxDisabled = isOverseas ? 'disabled' : '';
                const cityDisabled = isOverseas ? 'disabled' : '';

                // 行區塊背景設定 (透過 hover 變色提升現代感)
                html += `
                <tr class="bg-white hover:bg-slate-50/80 transition-colors border-b border-slate-100 group" id="tr-${id}">
                    <td class="px-3 py-3 align-middle text-center sticky-col bg-white group-hover:bg-slate-50/80 transition-colors" style="left: 0;">
                        <button onclick="window.approveRow('${id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded-md shadow-sm transition-all text-[11px] mb-1.5 active:scale-95">
                            <i class="fa-solid fa-check mr-0.5"></i> 放行
                        </button>
                        <button onclick="window.deleteStaging('${id}')" class="w-full bg-white hover:bg-rose-50 text-slate-400 hover:text-rose-600 border border-slate-200 hover:border-rose-200 font-bold py-1 rounded-md transition-all text-[10px]">
                            <i class="fa-solid fa-xmark mr-0.5"></i> 刪除
                        </button>
                    </td>
                    <td class="px-4 py-3 align-middle sticky-col bg-white group-hover:bg-slate-50/80 transition-colors" style="left: 100px;">
                        <div class="font-black text-slate-800 text-sm leading-tight truncate" title="${row.stuName}">${row.stuName}</div>
                        <div class="text-[11px] text-slate-400 font-medium mt-1 uppercase tracking-wide">${row.stuId} <span class="mx-1">|</span> ${row.grade}年級</div>
                    </td>
                    <td class="px-4 py-3 align-middle sticky-col sticky-shadow bg-white group-hover:bg-slate-50/80 transition-colors" style="left: 260px;">
                        <div class="max-w-[200px] flex flex-wrap gap-y-1" title="${row.coursesInfo.map(c=>c.name).join(', ')}">${courseBadges || '-'}</div>
                    </td>
                    
                    <td class="px-3 py-3 align-middle border-l border-slate-200">
                        <select id="inst_country_${id}" class="modern-input modern-select" onchange="window.handleRowCountryChange('${id}')">
                            ${countryOptions.map(o => `<option value="${o}" ${row.inst_country === o ? 'selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-3 py-3 align-middle">
                        <input type="text" id="inst_name_${id}" class="modern-input text-indigo-700" value="${row.inst_name}" onblur="window.autoSave('${id}', 'inst_name', this.value)">
                    </td>
                    <td class="px-3 py-3 align-middle">
                        <input type="text" id="inst_tax_${id}" class="modern-input font-mono" value="${row.inst_tax}" ${taxDisabled} placeholder="${isOverseas?'海外免填':'統一編號'}" onblur="window.autoSave('${id}', 'inst_tax', this.value)">
                    </td>
                    <td class="px-3 py-3 align-middle">
                        <select id="inst_city_${id}" class="modern-input modern-select" ${cityDisabled} onchange="window.autoSave('${id}', 'inst_city', this.value)">
                            <option value="">${isOverseas?'免填':'請選擇'}</option>
                            ${CITIES.map(o => `<option value="${o}" ${row.inst_city === o ? 'selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-3 py-3 align-middle">
                        <input type="text" id="inst_addr_${id}" class="modern-input" value="${row.inst_addr}" onblur="window.autoSave('${id}', 'inst_addr', this.value)">
                    </td>

                    <td class="px-3 py-3 align-middle border-l border-slate-200">
                        <input type="text" id="duration_${id}" class="modern-input font-mono text-center text-slate-600" value="${row.duration}" onblur="window.autoSave('${id}', 'duration', this.value)" placeholder="YY/MM/DD-YY/MM/DD">
                    </td>
                    <td class="px-3 py-3 align-middle">
                        <input type="number" id="hours_${id}" class="modern-input text-center text-emerald-700 bg-emerald-50 focus:bg-white" value="${row.hours}" onblur="window.autoSave('${id}', 'hours', Number(this.value))">
                    </td>
                    <td class="px-3 py-3 align-middle">${makeSelect(row.period_type, periodOptions, 'period_type', id)}</td>
                    <td class="px-3 py-3 align-middle">${makeSelect(row.proof_type, proofOptions, 'proof_type', id)}</td>
                    <td class="px-3 py-3 align-middle">${makeSelect(row.insurance, insOptions, 'insurance', id)}</td>
                    <td class="px-3 py-3 align-middle">${makeSelect(row.employment, empOptions, 'employment', id)}</td>
                    <td class="px-3 py-3 align-middle">
                        <input type="text" id="resp_dept_${id}" class="modern-input" value="${row.resp_dept}" onblur="window.autoSave('${id}', 'resp_dept', this.value)">
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.approveRow = async (id) => {
            const inst_country = document.getElementById(`inst_country_${id}`).value;
            const inst_name = document.getElementById(`inst_name_${id}`).value.trim();
            const inst_tax = document.getElementById(`inst_tax_${id}`).value.trim();
            const inst_city = document.getElementById(`inst_city_${id}`).value;
            const inst_addr = document.getElementById(`inst_addr_${id}`).value.trim();
            
            const duration = document.getElementById(`duration_${id}`).value.trim();
            const hours = Number(document.getElementById(`hours_${id}`).value);
            const period_type = document.getElementById(`period_type_${id}`).value;
            const proof_type = document.getElementById(`proof_type_${id}`).value;
            const insurance = document.getElementById(`insurance_${id}`).value;
            const employment = document.getElementById(`employment_${id}`).value;
            const resp_dept = document.getElementById(`resp_dept_${id}`).value.trim();

            if (!inst_name || !duration || !hours || !period_type || !proof_type || !insurance || !employment) {
                alert(`資料不完整！請確認必填欄位 (包含下拉選單) 皆已填寫。`);
                return;
            }

            const rowData = stagingData.find(d => d.id === id);
            
            try {
                const isMatchInst = existingInstitutions.find(i => i.country === inst_country && i.name === inst_name && i.tax_id === inst_tax && i.city === inst_city && i.address === inst_addr);
                if (!isMatchInst) {
                    const instRef = await addDoc(collection(db, "internship_institutions"), {
                        country: inst_country, name: inst_name, tax_id: inst_tax, city: inst_city, address: inst_addr, created_at: serverTimestamp()
                    });
                    existingInstitutions.push({ id: instRef.id, country: inst_country, name: inst_name, tax_id: inst_tax, city: inst_city, address: inst_addr });
                }

                const courseIds = rowData.coursesInfo.map(c => {
                    const match = existingCourses.find(xc => xc.course_code === c.code);
                    return match ? match.id : null;
                }).filter(Boolean);
                
                await addDoc(collection(db, "internship_records"), {
                    student_raw: `${rowData.stuId} - ${rowData.stuName}`, grade: rowData.grade,
                    inst_raw: inst_name,
                    courses: courseIds,
                    duration: duration, hours: hours,
                    period_type: period_type, proof_type: proof_type,
                    insurance: insurance, employment: employment,
                    resp_dept: resp_dept,
                    created_at: serverTimestamp()
                });

                await deleteDoc(doc(db, "internship_staging", id));
                
            } catch(e) {
                alert("寫入資料庫時發生錯誤: " + e.message);
            }
        };

        window.deleteStaging = async (id) => {
            if(confirm("確定要刪除這筆暫存紀錄嗎？此操作不會影響已建立的學生與課程主檔。")) {
                await deleteDoc(doc(db, "internship_staging", id));
            }
        };

        window.approveAll = async () => {
            if(stagingData.length === 0) return;
            if(!confirm(`確定要將畫面上的 ${stagingData.length} 筆資料全部放行寫入系統嗎？`)) return;

            const btn = document.querySelector('button[onclick="window.approveAll()"]');
            const oriHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> 處理中...';
            btn.disabled = true;

            for (let row of stagingData) {
                await window.approveRow(row.id);
            }
            
            btn.innerHTML = oriHtml;
            btn.disabled = false;
        };

        window.clearAllStaging = async () => {
            if(stagingData.length === 0) return;
            if(!confirm(`⚠️ 警告：確定要清空所有的暫存審核資料嗎？\n此操作無法復原！`)) return;
            
            const batch = writeBatch(db);
            stagingData.forEach(row => {
                batch.delete(doc(db, "internship_staging", row.id));
            });
            await batch.commit();
        };

    </script>
</body>
</html>
