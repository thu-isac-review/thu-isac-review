<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>批次匯入審查中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #F4F5F8; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* 滾動條樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; border: 2px solid #F4F5F8; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* 表格樣式 */
        table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        th, td { border-bottom: 1px solid #f3f4f6; vertical-align: middle; background-color: #ffffff; transition: background-color 0.2s ease; }
        th { background-color: #ffffff; border-bottom: 2px solid #f3f4f6; color: #6b7280; font-weight: 700; font-size: 13px; }
        tbody tr:hover td { background-color: #f9fafb; }

        /* 凍結窗格設定 */
        .sticky-col-1 { position: sticky; left: 0; z-index: 10; }
        .sticky-col-2 { position: sticky; left: 50px; z-index: 10; }
        .sticky-col-3 { position: sticky; left: 210px; z-index: 10; }
        .sticky-shadow::after { content: ''; position: absolute; top: 0; right: -6px; bottom: 0; width: 6px; background: linear-gradient(to right, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 15; }
        thead .sticky-col-1, thead .sticky-col-2, thead .sticky-col-3 { z-index: 20; background-color: #ffffff; }

        /* 手機版解除過多凍結，保留橫向滑動空間 */
        @media (max-width: 768px) {
            .sticky-col-2, .sticky-col-3 { position: static; left: auto; z-index: auto; }
            thead .sticky-col-2, thead .sticky-col-3 { z-index: auto; }
            .sticky-col-3.sticky-shadow::after { display: none; }
            .sticky-col-1::after { content: ''; position: absolute; top: 0; right: -6px; bottom: 0; width: 6px; background: linear-gradient(to right, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 100%); pointer-events: none; z-index: 15; }
        }

        /* 無縫輸入框 (Borderless Inputs) */
        .clean-input { width: 100%; height: auto; min-height: 36px; background: transparent; border: 1px solid transparent; padding: 6px 10px; font-size: 14px; font-weight: 600; color: #1f2937; outline: none; transition: all 0.15s; border-radius: 8px; }
        .clean-input:hover:not(:disabled) { background-color: #f3f4f6; border-color: #e5e7eb; }
        .clean-input:focus:not(:disabled) { background-color: #ffffff; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); z-index: 5; position: relative; }
        .clean-input:disabled { color: #9ca3af; cursor: not-allowed; opacity: 0.8; }
        .clean-input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .clean-select { appearance: none; cursor: pointer; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.2em 1.2em; padding-right: 2rem; }

        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden text-slate-800 bg-[#F4F5F8]">

    <div class="flex-1 w-full h-full overflow-y-auto overflow-x-hidden flex flex-col custom-scrollbar">

        <div class="shrink-0 px-4 md:px-10 pt-6 md:pt-10 pb-4 md:pb-6 z-20 animate-fade flex flex-col lg:flex-row justify-between items-start lg:items-end gap-5 lg:gap-0">
            <div class="w-full">
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">批次匯入審查中心</h1>
                <p class="text-slate-500 mt-2 font-bold text-xs md:text-sm">上傳總表後資料將安全暫存於雲端。請核實下方機構與紀錄細節，確認無誤後點擊放行。</p>
            </div>
            <div class="flex flex-row w-full lg:w-auto gap-2 md:gap-3">
                <button onclick="window.downloadTemplate()" class="flex-1 lg:flex-none flex items-center justify-center whitespace-nowrap h-11 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-4 md:px-6 rounded-xl text-sm transition-all shadow-sm active:scale-95">
                    下載範本
                </button>
                <button onclick="document.getElementById('import-file').click()" class="flex-1 lg:flex-none flex items-center justify-center whitespace-nowrap h-11 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 md:px-6 rounded-xl text-sm transition-all shadow-md shadow-indigo-600/20 active:scale-95">
                    上傳資料總表
                </button>
                <input type="file" id="import-file" accept=".csv" class="hidden" onchange="window.processImport(event)">
            </div>
        </div>

        <div class="shrink-0 px-4 md:px-10 pb-4 md:pb-6 grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-6 animate-fade" style="animation-delay: 0.1s;">
            <div class="bg-white p-5 md:p-6 rounded-2xl md:rounded-3xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-slate-100 flex justify-between items-center">
                <div>
                    <div class="text-xs md:text-sm text-slate-500 font-bold mb-1">待審核資料</div>
                    <div class="text-3xl md:text-4xl font-black text-slate-800" id="stat-pending">0</div>
                </div>
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-2xl bg-indigo-50 text-indigo-500 flex items-center justify-center text-xl md:text-2xl"><i class="fa-solid fa-file-lines"></i></div>
            </div>
            <div class="bg-white p-5 md:p-6 rounded-2xl md:rounded-3xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-slate-100 flex justify-between items-center">
                <div>
                    <div class="text-xs md:text-sm text-slate-500 font-bold mb-1">本次登入已核准</div>
                    <div class="text-3xl md:text-4xl font-black text-slate-800" id="stat-approved">0</div>
                </div>
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl md:text-2xl"><i class="fa-solid fa-check"></i></div>
            </div>
            <div class="bg-white p-5 md:p-6 rounded-2xl md:rounded-3xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-slate-100 flex justify-between items-center">
                <div>
                    <div class="text-xs md:text-sm text-slate-500 font-bold mb-1">匯入阻擋 (缺必填)</div>
                    <div class="text-3xl md:text-4xl font-black text-slate-800" id="stat-error">0</div>
                </div>
                <div class="w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center text-xl md:text-2xl"><i class="fa-solid fa-exclamation"></i></div>
            </div>
        </div>

        <div class="flex-1 flex flex-col shrink-0 min-h-[600px] md:min-h-0 px-4 md:px-10 pb-6 md:pb-10 animate-fade" style="animation-delay: 0.2s;">
            <div class="bg-white rounded-2xl md:rounded-[2rem] shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-slate-100 flex flex-col flex-1 overflow-hidden relative min-h-0">
                
                <div class="px-4 md:px-8 py-4 md:py-5 border-b border-slate-100 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 shrink-0 z-20 bg-white">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full lg:w-auto">
                        <div class="relative w-full sm:w-72">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="search-input" oninput="window.renderStagingTable()" placeholder="搜尋學生、機構..." class="w-full bg-slate-50 border border-slate-100 pl-11 pr-4 py-2.5 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto hidden sm:flex">
                            <span class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap" id="badge-count">0 筆待審核</span>
                        </div>
                    </div>
                    <div class="flex flex-row gap-2 w-full lg:w-auto">
                        <button onclick="window.clearAllStaging()" class="flex-1 lg:flex-none justify-center whitespace-nowrap text-sm bg-white hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-slate-200 px-4 py-2.5 rounded-xl transition-colors font-bold shadow-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-trash-can"></i> 清空
                        </button>
                        <button onclick="window.approveAll()" class="flex-[2] lg:flex-none justify-center whitespace-nowrap text-sm bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl transition-colors font-bold shadow-md shadow-indigo-600/20 active:scale-95">
                            批次核准全部
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-auto custom-scrollbar relative bg-white min-h-0">
                    <table class="saas-table">
                        <colgroup>
                            <col style="width: 50px;">  <col style="width: 160px;"> <col style="width: 240px;"> <col style="width: 140px;"> <col style="width: 240px;"> <col style="width: 150px;"> <col style="width: 140px;"> <col style="width: 280px;"> <col style="width: 200px;"> <col style="width: 100px;"> <col style="width: 160px;"> <col style="width: 160px;"> <col style="width: 160px;"> <col style="width: 120px;"> <col style="width: 180px;"> </colgroup>

                        <thead class="sticky top-0 z-30">
                            <tr>
                                <th class="px-4 py-4 text-center sticky-col-1"><i class="fa-solid fa-bolt text-slate-300"></i></th>
                                <th class="px-4 py-4 text-left sticky-col-2">學生資訊</th>
                                <th class="px-4 py-4 text-left sticky-col-3 sticky-shadow">課程標籤</th>
                                <th class="px-4 py-4 text-left pl-8">國別 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">機構名稱 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">機構統編</th>
                                <th class="px-4 py-4 text-left">縣市別</th>
                                <th class="px-4 py-4 text-left">完整地址 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left pl-8">起訖時間 (Y/M/D) <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-center">總時數 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">時間分類 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">證明文件 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">投保情形 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">勞雇 <span class="text-rose-400">*</span></th>
                                <th class="px-4 py-4 text-left">負責系所</th>
                            </tr>
                        </thead>
                        <tbody id="staging-table-body">
                            <tr>
                                <td colspan="15" class="py-32 text-center text-slate-400 border-none">
                                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-indigo-400"></i>
                                    <p class="font-bold text-sm tracking-wide">與資料庫連線中...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="bg-white border-t border-slate-100 px-4 md:px-8 py-3 md:py-4 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0 md:rounded-b-[2rem]">
                    <div id="pagination-info" class="text-xs md:text-sm font-bold text-slate-500">顯示 0 - 0 筆，共 0 筆資料</div>
                </div>

            </div>
        </div>
    </div> <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY", authDomain: "thu-isac-review.firebaseapp.com", projectId: "thu-isac-review", storageBucket: "thu-isac-review.firebasestorage.app", messagingSenderId: "453299876735", appId: "1:453299876735:web:1d8babca3315423161a04a" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);

        let existingStudents = [];
        let existingCourses = [];
        let existingInstitutions = [];
        let stagingData = []; 
        let sessionApprovedCount = 0; 
        let importErrorCount = 0;
        
        const CITIES = ["臺北市","新北市","基隆市","桃園市","新竹縣","新竹市","苗栗縣","臺中市","彰化縣","南投縣","雲林縣","嘉義縣","嘉義市","臺南市","高雄市","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];
        const periodOptions = ['寒假實習', '暑假實習', '學期期間實習', '單一學期實習', '全學年'];
        const proofOptions = ['合約', '公函', '其他證明文件'];
        const insOptions = ['僅校外實習保險', '僅勞保', '兩者皆有', '兩者皆無'];
        const empOptions = ['是', '否'];
        const countryOptions = ["中華民國","大陸地區","日本","美國","越南","泰國","澳大利亞","香港","澳門","馬來西亞","菲律賓","印尼","印度"];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const [sSnap, cSnap, iSnap] = await Promise.all([
                    getDocs(collection(db, "internship_students")),
                    getDocs(collection(db, "internship_courses")),
                    getDocs(collection(db, "internship_institutions"))
                ]);
                existingStudents = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                existingCourses = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                existingInstitutions = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                onSnapshot(collection(db, "internship_staging"), (snapshot) => {
                    stagingData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    updateDashboard();
                    window.renderStagingTable();
                });
            }
        });

        function updateDashboard() {
            document.getElementById('stat-pending').innerText = stagingData.length;
            document.getElementById('stat-approved').innerText = sessionApprovedCount;
            document.getElementById('stat-error').innerText = importErrorCount;
            document.getElementById('badge-count').innerText = `${stagingData.length} 筆待審核`;
        }

        const makeSelect = (val, options, fieldName, docId) => {
            let html = `<select id="${fieldName}_${docId}" class="clean-input clean-select" onblur="window.autoSave('${docId}', '${fieldName}', this.value)">`;
            html += `<option value="">請選擇</option>`;
            options.forEach(opt => {
                html += `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`;
            });
            html += `</select>`;
            return html;
        };

        window.downloadTemplate = () => {
            const header = "學生學院,學生學系,學號,姓名,性別,國籍,當學年年級,機構國別,機構名稱,統一編號,縣市別,完整實習地址,學年度,學期,開課學院,開課學系,選課代號,課程名稱,開課學制,實習課程屬性,實習學分數,實習起訖時間,核定時數,實習時間分類,證明文件類型,投保情形,勞雇關係,負責填報系所\n";
            const example = "工學院,工工系,S1101234,王小明,男,本國籍,3,中華民國,台灣積體電路製造股份有限公司,12345678,臺中市,臺灣大道四段1727號,114,1,工學院,工工系,1234,企業實習,日間學士班,必修,3,114/07/01-114/08/31,160,暑假實習,合約,兩者皆有,是,工工系\n";
            const blob = new Blob(['\uFEFF' + header + example], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = "批次匯入審查_標準範本.csv"; link.click();
        };

        window.processImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            importErrorCount = 0; 
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const rows = event.target.result.split('\n').map(row => row.trim()).filter(row => row);
                    const batch = writeBatch(db); 
                    let aggregatedRecordsMap = new Map();

                    for (let i = 1; i < rows.length; i++) {
                        let cols = []; let inQuotes = false; let currentVal = '';
                        for (let char of rows[i]) {
                            if (char === '"') inQuotes = !inQuotes;
                            else if (char === ',' && !inQuotes) { cols.push(currentVal.trim()); currentVal = ''; }
                            else currentVal += char;
                        }
                        cols.push(currentVal.trim());
                        while(cols.length < 28) cols.push('');

                        const stu_id = (cols[2] || '').toUpperCase(); const stu_name = cols[3];
                        const inst_country = cols[7] || '中華民國'; const inst_name = cols[8];
                        const duration = cols[21]; const hours = Number(cols[22]) || 0;

                        if (!stu_id || !inst_name || !duration) {
                            importErrorCount++;
                            continue;
                        }

                        if (!existingStudents.some(s => s.student_id === stu_id)) {
                            const stuRef = doc(collection(db, "internship_students"));
                            batch.set(stuRef, { college: cols[0], department: cols[1], student_id: stu_id, name: stu_name, gender: cols[4] || '男', nationality: cols[5] || '本國籍', created_at: serverTimestamp() });
                            existingStudents.push({ id: stuRef.id, student_id: stu_id }); 
                        }

                        const c_code = cols[16]; const c_name = cols[17];
                        if (c_code && c_name) {
                            if (!existingCourses.some(c => c.academic_year === cols[12] && c.term === cols[13] && c.course_code === c_code)) {
                                const courseRef = doc(collection(db, "internship_courses"));
                                batch.set(courseRef, { academic_year: cols[12], term: cols[13], semester: `${cols[12]}-${cols[13]}`, college: cols[14], department: cols[15], course_code: c_code, course_name: c_name, edu_system: cols[18], course_type: cols[19], credits: Number(cols[20])||0, sortOrder: 999, created_at: serverTimestamp() });
                                existingCourses.push({ id: courseRef.id, academic_year: cols[12], term: cols[13], course_code: c_code });
                            }
                        }

                        const safeKey = `${stu_id}_${inst_name}_${duration}`.replace(/[\/\\]/g, ''); 
                        const matchCourse = existingCourses.find(c => c.academic_year === cols[12] && c.term === cols[13] && c.course_code === c_code);
                        const courseIdObj = matchCourse ? { id: matchCourse.id, code: c_code, name: c_name } : { id: 'new', code: c_code, name: c_name };

                        if (aggregatedRecordsMap.has(safeKey)) {
                            let existingRecord = aggregatedRecordsMap.get(safeKey);
                            existingRecord.hours += hours;
                            if (!existingRecord.coursesInfo.some(c => c.code === courseIdObj.code)) existingRecord.coursesInfo.push(courseIdObj);
                        } else {
                            aggregatedRecordsMap.set(safeKey, {
                                stuId: stu_id, stuName: stu_name, grade: cols[6],
                                inst_country, inst_name, inst_tax: cols[9], inst_city: cols[10], inst_addr: cols[11],
                                duration, hours, period_type: cols[23], proof_type: cols[24], insurance: cols[25], employment: cols[26], resp_dept: cols[27],
                                coursesInfo: [courseIdObj], created_at: serverTimestamp()
                            });
                        }
                    }

                    aggregatedRecordsMap.forEach((data, key) => {
                        const stagingRef = doc(db, 'internship_staging', key);
                        batch.set(stagingRef, data, { merge: true }); 
                    });

                    await batch.commit();
                    updateDashboard();

                } catch (error) { 
                    alert("處理發生錯誤：\n" + error.message); 
                } finally {
                    e.target.value = '';
                }
            };
            reader.readAsText(file);
        };

        window.handleRowCountryChange = (docId) => {
            const countryEl = document.getElementById(`inst_country_${docId}`);
            const taxEl = document.getElementById(`inst_tax_${docId}`);
            const cityEl = document.getElementById(`inst_city_${docId}`);
            
            if (countryEl.value !== '中華民國') {
                taxEl.value = ''; taxEl.disabled = true;
                cityEl.value = ''; cityEl.disabled = true;
            } else {
                taxEl.disabled = false;
                cityEl.disabled = false;
            }
            window.autoSave(docId, 'inst_country', countryEl.value);
            window.autoSave(docId, 'inst_tax', taxEl.value);
            window.autoSave(docId, 'inst_city', cityEl.value);
        };

        window.autoSave = (docId, field, value) => {
            const record = stagingData.find(d => d.id === docId);
            if(record && record[field] !== value) {
                setDoc(doc(db, 'internship_staging', docId), { [field]: value }, { merge: true });
            }
        };

        window.renderStagingTable = () => {
            const tbody = document.getElementById('staging-table-body');
            const searchTerm = (document.getElementById('search-input').value || '').toLowerCase();
            
            const filteredData = stagingData.filter(d => 
                (d.stuName || '').toLowerCase().includes(searchTerm) || 
                (d.inst_name || '').toLowerCase().includes(searchTerm)
            );

            document.getElementById('pagination-info').innerText = `顯示 1 - ${filteredData.length} 筆，共 ${filteredData.length} 筆資料`;

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr>
                    <td colspan="15" class="py-32 text-center border-none">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 text-slate-300 mb-4">
                            <i class="fa-solid fa-inbox text-3xl"></i>
                        </div>
                        <p class="text-slate-500 font-bold text-base">目前暫存區淨空或查無結果。</p>
                    </td>
                </tr>`;
                return;
            }

            let html = '';
            filteredData.forEach(row => {
                const id = row.id;
                const courseBadges = row.coursesInfo.map(c => `<span class="inline-flex items-center bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-[12px] font-bold mr-1.5 mb-1.5"><span class="mr-1.5 text-indigo-500">${c.code}</span>${c.name}</span>`).join('');
                
                const isOverseas = row.inst_country !== '中華民國';
                const taxDisabled = isOverseas ? 'disabled' : '';
                const cityDisabled = isOverseas ? 'disabled' : '';

                html += `
                <tr id="tr-${id}">
                    <td class="px-2 py-2 align-middle text-center sticky-col-1 bg-white group-hover:bg-slate-50/80 transition-colors">
                        <div class="flex flex-col gap-1.5 px-1 items-center justify-center">
                            <button onclick="window.approveRow('${id}')" class="w-full h-8 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-md flex items-center justify-center transition-colors shadow-sm text-[11px] font-bold" title="核准放行">
                                放行
                            </button>
                            <button onclick="window.deleteStaging('${id}')" class="w-full h-7 bg-white text-slate-400 hover:bg-rose-500 hover:text-white rounded-md flex items-center justify-center transition-colors shadow-sm border border-slate-200 hover:border-rose-500 text-[10px] font-bold" title="刪除捨棄">
                                刪除
                            </button>
                        </div>
                    </td>
                    
                    <td class="px-4 py-4 align-middle sticky-col-2 bg-white group-hover:bg-slate-50/80 transition-colors">
                        <div class="font-black text-slate-800 text-[14px] leading-relaxed">${row.stuName}</div>
                        <div class="text-[12px] text-slate-500 font-medium mt-0.5">${row.stuId} • ${row.grade}年級</div>
                    </td>
                    
                    <td class="px-4 py-4 align-middle sticky-col-3 sticky-shadow bg-white group-hover:bg-slate-50/80 transition-colors">
                        <div class="w-full flex flex-wrap pt-1">${courseBadges || '-'}</div>
                    </td>
                    
                    <td class="px-4 pl-8 py-4 align-middle">
                        ${makeSelect(row.inst_country, countryOptions, 'inst_country', id)}
                    </td>
                    <td class="px-4 py-4 align-middle">
                        <input type="text" id="inst_name_${id}" class="clean-input text-indigo-900" value="${row.inst_name}" onblur="window.autoSave('${id}', 'inst_name', this.value)">
                    </td>
                    <td class="px-4 py-4 align-middle">
                        <input type="text" id="inst_tax_${id}" class="clean-input uppercase" value="${row.inst_tax}" ${taxDisabled} placeholder="${isOverseas?'海外免填':'統一編號'}" onblur="window.autoSave('${id}', 'inst_tax', this.value)">
                    </td>
                    <td class="px-4 py-4 align-middle">
                        <select id="inst_city_${id}" class="clean-input clean-select" ${cityDisabled} onchange="window.autoSave('${id}', 'inst_city', this.value)">
                            <option value="">${isOverseas?'免填':'請選擇'}</option>
                            ${CITIES.map(o => `<option value="${o}" ${row.inst_city === o ? 'selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-4 py-4 align-middle">
                        <input type="text" id="inst_addr_${id}" class="clean-input" value="${row.inst_addr}" onblur="window.autoSave('${id}', 'inst_addr', this.value)">
                    </td>

                    <td class="px-4 pl-8 py-4 align-middle">
                        <input type="text" id="duration_${id}" class="clean-input text-slate-700" value="${row.duration}" onblur="window.autoSave('${id}', 'duration', this.value)" placeholder="YY/MM/DD-YY/MM/DD">
                    </td>
                    <td class="px-4 py-4 align-middle">
                        <input type="number" id="hours_${id}" class="clean-input text-center text-emerald-700 font-black bg-emerald-50 focus:bg-white" value="${row.hours}" onblur="window.autoSave('${id}', 'hours', Number(this.value))">
                    </td>
                    <td class="px-4 py-4 align-middle">${makeSelect(row.period_type, periodOptions, 'period_type', id)}</td>
                    <td class="px-4 py-4 align-middle">${makeSelect(row.proof_type, proofOptions, 'proof_type', id)}</td>
                    <td class="px-4 py-4 align-middle">${makeSelect(row.insurance, insOptions, 'insurance', id)}</td>
                    <td class="px-4 py-4 align-middle">${makeSelect(row.employment, empOptions, 'employment', id)}</td>
                    <td class="px-4 py-4 align-middle">
                        <input type="text" id="resp_dept_${id}" class="clean-input" value="${row.resp_dept}" onblur="window.autoSave('${id}', 'resp_dept', this.value)">
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        };

        window.approveRow = async (id) => {
            const inst_country = document.getElementById(`inst_country_${id}`).value;
            const inst_name = document.getElementById(`inst_name_${id}`).value.trim();
            const inst_tax = document.getElementById(`inst_tax_${id}`).value.trim();
            const inst_city = document.getElementById(`inst_city_${id}`).value;
            const inst_addr = document.getElementById(`inst_addr_${id}`).value.trim();
            
            const duration = document.getElementById(`duration_${id}`).value.trim();
            const hours = Number(document.getElementById(`hours_${id}`).value);
            const period_type = document.getElementById(`period_type_${id}`).value;
            const proof_type = document.getElementById(`proof_type_${id}`).value;
            const insurance = document.getElementById(`insurance_${id}`).value;
            const employment = document.getElementById(`employment_${id}`).value;
            const resp_dept = document.getElementById(`resp_dept_${id}`).value.trim();

            if (!inst_name || !duration || !hours || !period_type || !proof_type || !insurance || !employment) {
                alert(`資料不完整！請確認必填欄位皆已填寫。`); return;
            }

            const rowData = stagingData.find(d => d.id === id);
            
            try {
                const isMatchInst = existingInstitutions.find(i => i.country === inst_country && i.name === inst_name && i.tax_id === inst_tax && i.city === inst_city && i.address === inst_addr);
                if (!isMatchInst) {
                    const instRef = await addDoc(collection(db, "internship_institutions"), {
                        country: inst_country, name: inst_name, tax_id: inst_tax, city: inst_city, address: inst_addr, created_at: serverTimestamp()
                    });
                    existingInstitutions.push({ id: instRef.id, country: inst_country, name: inst_name, tax_id: inst_tax, city: inst_city, address: inst_addr });
                }

                const courseIds = rowData.coursesInfo.map(c => {
                    const match = existingCourses.find(xc => xc.course_code === c.code);
                    return match ? match.id : null;
                }).filter(Boolean);
                
                await addDoc(collection(db, "internship_records"), {
                    student_raw: `${rowData.stuId} - ${rowData.stuName}`, grade: rowData.grade,
                    inst_raw: inst_name, courses: courseIds, duration: duration, hours: hours,
                    period_type: period_type, proof_type: proof_type, insurance: insurance, employment: employment, resp_dept: resp_dept,
                    created_at: serverTimestamp()
                });

                await deleteDoc(doc(db, "internship_staging", id));
                sessionApprovedCount++;
                
            } catch(e) {
                alert("寫入資料庫時發生錯誤: " + e.message);
            }
        };

        window.deleteStaging = async (id) => {
            if(confirm("確定要刪除這筆暫存紀錄嗎？此操作不會影響已建立的學生與課程主檔。")) {
                await deleteDoc(doc(db, "internship_staging", id));
            }
        };

        window.approveAll = async () => {
            if(stagingData.length === 0) return;
            if(!confirm(`確定要將畫面上的 ${stagingData.length} 筆資料全部放行寫入系統嗎？`)) return;

            for (let row of stagingData) { await window.approveRow(row.id); }
            updateDashboard();
        };

        window.clearAllStaging = async () => {
            if(stagingData.length === 0) return;
            if(!confirm(`⚠️ 警告：確定要清空所有的暫存審核資料嗎？\n此操作無法復原！`)) return;
            
            const batch = writeBatch(db);
            stagingData.forEach(row => { batch.delete(doc(db, "internship_staging", row.id)); });
            await batch.commit();
        };

    </script>
</body>
</html>
