<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東海大學實習中心 - 實習課程書面審查作業系統</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* 預設配色 (經典藍) */
            --brand: #1a56db;
            --brand-hover: #1649c0;
            --brand-light: #eff4ff;
            --brand-border: #c3d2f9;
            
            --sidebar-w: 250px;
            --sidebar-collapsed-w: 72px;
            --topbar-h: 56px;
            --bg: #f8f9fc;
            --surface: #ffffff;
            --border: #e5e7ef;
            --border-strong: #cdd0dd;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --success: #059669;
            --danger: #dc2626;
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            --transition: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        html, body, #app { 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Noto Sans TC', sans-serif; 
            color: var(--text-primary); 
            background: var(--bg); 
            -webkit-font-smoothing: antialiased; 
        }

        /* ─── 安全防禦：未驗證前完全隱藏介面（防閃現） ─── */
        body { visibility: hidden; }

        /* ─── SIDEBAR 樣式 ─── */
        #sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 30;
            transition: width var(--transition), transform var(--transition);
        }
        
        /* 桌面端收闔狀態 */
        #sidebar.collapsed { width: var(--sidebar-collapsed-w); }
        #sidebar.collapsed .logo-text, 
        #sidebar.collapsed .logo-sub,
        #sidebar.collapsed .nav-item span,
        #sidebar.collapsed .user-info,
        #sidebar.collapsed .settings-icon { display: none; }
        
        #sidebar.collapsed .nav-group-label { text-align: center; font-size: 0; padding: 10px 0; margin: 8px 0 0; }
        #sidebar.collapsed .nav-group-label::after { content: '•••'; font-size: 12px; }
        #sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }

        .sidebar-logo {
            height: var(--topbar-h);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow: hidden;
        }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px; font-weight: 500;
            transition: background 0.2s, color 0.2s;
            user-select: none;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .nav-item i { font-size: 18px; flex-shrink: 0; text-align: center; width: 20px; }
        .nav-item:hover { background: var(--bg); color: var(--text-primary); }
        .nav-item.active { background: var(--brand-light); color: var(--brand); font-weight: 700; }

        /* ─── 內容工作區 ─── */
        #content-frame {
            border: none;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* 自訂捲軸 */
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        /* 手機端響應式 RWD */
        @media (max-width: 768px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25; }
        }

        /* 動畫效果 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1.2s linear infinite; display: inline-block; }
    </style>
</head>
<body>

    <div id="sysLoading" class="fixed inset-0 flex flex-col items-center justify-center bg-[#f8f9fc] z-[9999]">
        <i class="ti ti-loader icon-spin text-4xl" style="color: var(--brand)"></i>
        <p class="mt-3 text-sm font-bold text-gray-400">環境配置中，請稍候...</p>
    </div>

    <div id="mobileOverlay" class="mobile-overlay hidden" onclick="toggleMobileSidebar(false)"></div>

    <div id="app" class="flex w-full h-full overflow-hidden">
        
        <nav id="sidebar" class="custom-scroll overflow-y-auto overflow-x-hidden flex-shrink-0">
            <div class="sidebar-logo">
                <div class="flex-shrink-0 w-8 h-8 rounded-md flex items-center justify-center text-white font-bold" style="background: var(--brand)">
                    <i class="ti ti-briefcase-2 text-lg"></i>
                </div>
                <div class="logo-info">
                    <div class="logo-text font-bold text-sm text-gray-900 leading-tight">東海大學實習中心</div>
                    <div class="logo-sub text-[10px] text-gray-400">書面審查作業系統</div>
                </div>
            </div>
            
            <div class="flex-1 px-2 py-3 overflow-y-auto custom-scroll" id="sidebarMenu">
                <div class="nav-item" data-page="dashboard" data-path="/dashboard-content.html" data-roles="all">
                    <i class="ti ti-home"></i><span>首頁</span>
                </div>
                
                <div class="nav-group-label text-[10px] font-bold text-gray-400 tracking-wider px-2 mt-4 mb-1" data-roles="admin,teacher">審查作業</div>
                <div class="nav-item" data-page="list" data-path="/list.html" data-roles="admin,teacher">
                    <i class="ti ti-user-check"></i><span>學生待查核名單</span>
                </div>
                <div class="nav-item" data-page="review-dept" data-path="/review/department.html" data-roles="admin,teacher">
                    <i class="ti ti-building-community"></i><span>系所審查作業</span>
                </div>
                <div class="nav-item" data-page="review-school" data-path="/review/school.html" data-roles="admin">
                    <i class="ti ti-building-bank"></i><span>校級審查作業</span>
                </div>
                <div class="nav-item" data-page="review-inst" data-path="/review/institution.html" data-roles="admin,teacher">
                    <i class="ti ti-building-skyscraper"></i><span>機構審查作業</span>
                </div>
                
                <div class="nav-group-label text-[10px] font-bold text-gray-400 tracking-wider px-2 mt-4 mb-1" data-roles="admin,teacher">實習資料瀏覽</div>
                <div class="nav-item" data-page="view-course" data-path="/intern_view/course.html" data-roles="admin,teacher">
                    <i class="ti ti-book"></i><span>實習課程清單</span>
                </div>
                <div class="nav-item" data-page="view-students" data-path="/intern_view/students.html" data-roles="admin,teacher">
                    <i class="ti ti-address-book"></i><span>實習學生清單</span>
                </div>
                <div class="nav-item" data-page="view-inst" data-path="/intern_view/institution.html" data-roles="admin,teacher">
                    <i class="ti ti-building"></i><span>實習機構清單</span>
                </div>
                <div class="nav-item" data-page="view-record" data-path="/intern_view/record.html" data-roles="admin,teacher">
                    <i class="ti ti-clipboard-list"></i><span>實習記錄清單</span>
                </div>
                
                <div class="nav-group-label text-[10px] font-bold text-gray-400 tracking-wider px-2 mt-4 mb-1" data-roles="admin">實習資料管理</div>
                <div class="nav-item" data-page="manage-staging" data-path="/intern_manage/staging_review.html" data-roles="admin">
                    <i class="ti ti-cloud-upload"></i><span>批次匯入審查中心</span>
                </div>
                <div class="nav-item" data-page="manage-course" data-path="/intern_manage/course.html" data-roles="admin">
                    <i class="ti ti-book"></i><span>實習課程管理</span>
                </div>
                <div class="nav-item" data-page="manage-students" data-path="/intern_manage/students.html" data-roles="admin">
                    <i class="ti ti-user-cog"></i><span>實習學生管理</span>
                </div>
                <div class="nav-item" data-page="manage-inst" data-path="/intern_manage/institution.html" data-roles="admin">
                    <i class="ti ti-building"></i><span>實習機構管理</span>
                </div>
                <div class="nav-item" data-page="manage-record" data-path="/intern_manage/record.html" data-roles="admin">
                    <i class="ti ti-clipboard-check"></i><span>實習記錄管理</span>

                <div class="nav-group-label text-[10px] font-bold text-gray-400 tracking-wider px-2 mt-4 mb-1" data-roles="admin">審查項目設定</div>
                <div class="nav-item" data-page="set-moe" data-path="/settings/moe-indicators.html" data-roles="admin">

                </div>
                <div class="nav-item" data-page="set-admin" data-path="/settings/administrative_files.html" data-roles="admin">
                    <i class="ti ti-folder"></i><span>行政文件審查設定</span>
                </div>
                <div class="nav-item" data-page="set-stu" data-path="/settings/students_files.html" data-roles="admin">
                    <i class="ti ti-file-text"></i><span>學生文件審查設定</span>
                </div>
                <div class="nav-item" data-page="set-inst" data-path="/settings/institution_files.html" data-roles="admin">
                    <i class="ti ti-file-pencil"></i><span>機構文件審查設定</span>

                <div class="nav-group-label text-[10px] font-bold text-gray-400 tracking-wider px-2 mt-4 mb-1" data-roles="admin">系統設定</div>
                <div class="nav-item" data-page="sys-dept" data-path="/manage/departments.html" data-roles="admin">
                    <i class="ti ti-school"></i><span>系所清單管理</span>
                </div>
                <div class="nav-item" data-page="sys-roles" data-path="/manage/roles.html" data-roles="admin">
                    <i class="ti ti-shield-lock"></i><span>用戶權限管理</span>
                </div>
            </div>
            
            <div class="p-2 border-t border-gray-200 bg-white flex-shrink-0">
                <div class="nav-item !mb-0" id="profileBtn" data-page="profile" data-path="profile-settings" data-roles="all">
                    <div class="w-7 h-7 rounded-full text-xs font-bold flex items-center justify-center" style="background: var(--brand-light); color: var(--brand); border: 1.5px solid var(--brand-border)" id="userAvatar">U</div>
                    <div class="user-info flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-900 truncate" id="userTitleName">載入中...</div>
                        <div class="text-[10px] text-gray-400 truncate" id="userUnit">讀取權限中...</div>

                    <i class="ti ti-settings settings-icon text-gray-400 text-sm"></i>
                </div>

        <div id="main" class="flex-1 flex flex-col overflow-hidden min-w-0">
            
            <header id="topbar" class="h-14 bg-white border-bottom border-gray-200 flex items-center px-4 md:px-6 gap-3 flex-shrink-0 z-20 border-b">
                <button class="hidden md:flex p-1.5 rounded-md border border-gray-200 text-gray-500 hover:text-blue-600 hover:bg-gray-50 transition" onclick="toggleDesktopSidebar()" title="收合選單">
                    <i class="ti ti-menu-2 text-lg"></i>
                </button>
                
                <button class="flex md:hidden text-gray-500 hover:text-blue-600 focus:outline-none" onclick="toggleMobileSidebar(true)">
                    <i class="ti ti-menu-2 text-xl"></i>
                </button>
                
                <div class="flex items-center gap-1.5 text-xs font-medium text-gray-400 flex-1 truncate">
                    <span class="hidden sm:inline">實習書審</span>
                    <i class="ti ti-chevron-right hidden sm:inline"></i>
                    <span id="breadcrumbParent">首頁</span>
                    <i class="ti ti-chevron-right id-sub-arrow hidden"></i>
                    <span id="breadcrumbChild" class="text-gray-900 font-semibold"></span>
                </div>
                
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-md border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-50 cursor-pointer transition relative" title="系統通知">
                        <i class="ti ti-bell text-lg"></i>
                    </div>
                    <div class="w-px h-5 bg-gray-200 mx-1"></div>
                    <div class="w-8 h-8 rounded-md border border-red-100 bg-red-50 text-red-600 flex items-center justify-center hover:bg-red-100 cursor-pointer transition" id="logoutBtn" title="登出系統">
                        <i class="ti ti-logout text-lg"></i>
                    </div>
                </div>
            </header>

            <div id="content" class="flex-1 overflow-hidden bg-[#f8f9fc]">
                <iframe id="content-frame" class="w-full h-full hidden animate-fade" title="系統工作區"></iframe>
                <div id="profile-view-container" class="w-full h-full overflow-y-auto hidden"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 全域主題配置字典檔
        const THEMES = {
            blue: { brand: '#1a56db', hover: '#1649c0', light: '#eff4ff', border: '#c3d2f9' },
            emerald: { brand: '#059669', hover: '#047857', light: '#ecfdf5', border: '#a7f3d0' },
            violet: { brand: '#7c3aed', hover: '#6d28d9', light: '#f5f3ff', border: '#ddd6fe' },
            rose: { brand: '#e11d48', hover: '#be123c', light: '#fff1f2', border: '#fecdd3' },
            slate: { brand: '#475569', hover: '#334155', light: '#f8fafc', border: '#cbd5e1' }
        };

        const applySystemTheme = (themeKey) => {
            const t = THEMES[themeKey] || THEMES.blue;
            const root = document.documentElement;
            root.style.setProperty('--brand', t.brand);
            root.style.setProperty('--brand-hover', t.hover);
            root.style.setProperty('--brand-light', t.light);
            root.style.setProperty('--brand-border', t.border);
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 頁面初次載入安全守衛
        const checkAuthLocally = () => {
            const role = localStorage.getItem('user_role');
            if (!role) {
                // 無角色狀態，高機率未登入，強制導向登入 (使用相對路徑以防佈署問題)
                window.location.replace('login.html');
                return false;
            }
            // 預先同步快取的主題色彩
            const cacheTheme = localStorage.getItem('user_theme') || 'blue';
            applySystemTheme(cacheTheme);
            document.body.style.visibility = 'visible';
            return true;
        };

        if (checkAuthLocally()) {
            // 監聽 Firebase 真實登入狀態
            onAuthStateChanged(auth, async (user) => {
                const sysLoading = document.getElementById('sysLoading');
                if (user) {
                    try {
                        let role = localStorage.getItem('user_role');
                        let name = localStorage.getItem('user_name') || '管理員';
                        let uData = null;

                        // 雙重安全機制：若快取丟失則回火網補抓
                        if (!role) {
                            const userDoc = await getDoc(doc(db, "users", user.uid));
                            if (userDoc.exists()) {
                                uData = userDoc.data();
                                role = uData.role || 'user';
                                name = uData.name || '未命名';
                                localStorage.setItem('user_role', role);
                                localStorage.setItem('user_name', name);
                                localStorage.setItem('user_theme', uData.theme || 'blue');
                            } else if (user.email === 'thu.isac.review@gmail.com') {
                                role = 'admin';
                                name = '最高權限管理者';
                            }
                        }

                        // 更新主控框架上用戶的 UI 資訊
                        document.getElementById('userAvatar').textContent = name.charAt(0);
                        document.getElementById('userTitleName').textContent = name;
                        document.getElementById('userUnit').textContent = role.toUpperCase();

                        // 執行 RBAC 側欄按鈕過濾渲染
                        filterSidebarMenuByRole(role);
                        
                        // 初始化 SPA 路由引擎
                        initSpaRouter();

                    } catch (err) {
                        console.error("安全權限鏈解析失敗", err);
                    } finally {
                        // 修正：強制使用 style.display = 'none' 關閉，避免 Tailwind flex 覆蓋
                        if(sysLoading) sysLoading.style.display = 'none';
                    }
                } else {
                    // Firebase 判定未登入，清除快取並逐出後台
                    localStorage.clear();
                    window.location.replace('login.html');
                }
            });
        }

        // ─── 核心功能一：基於角色權限（RBAC）動態渲染側欄 ───
        function filterSidebarMenuByRole(userRole) {
            const menuItems = document.querySelectorAll('#sidebarMenu .nav-item, #sidebarMenu .nav-group-label');
            menuItems.forEach(item => {
                const allowedRoles = item.getAttribute('data-roles');
                if (allowedRoles === 'all') {
                    item.style.display = 'flex';
                    return;
                }
                const rolesArray = allowedRoles.split(',');
                if (rolesArray.includes(userRole)) {
                    item.style.display = item.classList.contains('nav-group-label') ? 'block' : 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ─── 核心功能二：單頁應用程式（SPA）輕量路由引擎 ───
        function initSpaRouter() {
            const contentFrame = document.getElementById('content-frame');
            const profileContainer = document.getElementById('profile-view-container');

            const handleHashRouting = () => {
                let hash = window.location.hash.replace('#', '');
                
                // 修正：直接更改 window.location.hash 來觸發跳轉，避免 early return 卡住畫面
                if (!hash) {
                    window.location.hash = '/dashboard-content.html';
                    return;
                }

                // 點擊高亮狀態同步切換
                document.querySelectorAll('#sidebar .nav-item, #profileBtn').forEach(btn => {
                    const btnPath = btn.getAttribute('data-path');
                    if (hash === btnPath || (hash === 'profile-settings' && btn.getAttribute('data-page') === 'profile')) {
                        btn.classList.add('active');
                        updateBreadcrumbs(btn);
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 特殊原生 View 處理
                if (hash === 'profile-settings') {
                    contentFrame.classList.add('hidden');
                    profileContainer.classList.remove('hidden');
                    loadNativeProfileView();
                    return;
                }

                // 常規工作子頁面
                profileContainer.classList.add('hidden');
                contentFrame.classList.remove('hidden');
                
                // 防抖優化
                const currentIframeSrc = contentFrame.contentWindow.location.pathname + contentFrame.contentWindow.location.search;
                if (!currentIframeSrc.includes(hash)) {
                    contentFrame.src = hash;
                }
            };

            window.addEventListener('hashchange', handleHashRouting);
            handleHashRouting();

            // 綁定選單點擊路由事件
            document.querySelectorAll('#sidebarMenu .nav-item, #profileBtn').forEach(item => {
                item.addEventListener('click', () => {
                    const path = item.getAttribute('data-path');
                    if(path) {
                        window.location.hash = path;
                        toggleMobileSidebar(false);
                    }
                });
            });
        }

        // ─── 核心功能三：麵包屑 (Breadcrumbs) 動態更新 ───
        function updateBreadcrumbs(activeElement) {
            // 修正：檢查 span 是否存在以防拋錯
            const spanEl = activeElement.querySelector('span');
            const labelName = spanEl ? spanEl.textContent : (activeElement.id === 'profileBtn' ? '個人資料設定' : '系統選項');
            
            const breadParent = document.getElementById('breadcrumbParent');
            const breadChild = document.getElementById('breadcrumbChild');
            const subArrow = document.querySelector('.id-sub-arrow');

            let previousLabel = "";
            let sibling = activeElement.previousElementSibling;
            while (sibling) {
                if (sibling.classList.contains('nav-group-label') && sibling.style.display !== 'none') {
                    previousLabel = sibling.textContent;
                    break;
                }
                sibling = sibling.previousElementSibling;
            }

            if (previousLabel) {
                breadParent.textContent = previousLabel;
                breadChild.textContent = labelName;
                breadChild.classList.remove('hidden');
                subArrow.classList.remove('hidden');
            } else {
                breadParent.textContent = labelName;
                breadChild.textContent = "";
                breadChild.classList.add('hidden');
                subArrow.classList.add('hidden');
            }
        }

        // ─── 核心功能四：登出解構 ───
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm("確認要登出東海實習書審作業系統？")) {
                signOut(auth).then(() => {
                    localStorage.clear();
                    window.location.replace('login.html');
                });
            }
        });

        // ─── 核心功能五：個人資料與配色同步 View ───
        function loadNativeProfileView() {
            const container = document.getElementById('profile-view-container');
            const currentTheme = localStorage.getItem('user_theme') || 'blue';
            const uName = localStorage.getItem('user_name') || '管理員';
            const uRole = localStorage.getItem('user_role') || 'user';

            container.innerHTML = `
                <div class="w-full max-w-4xl mx-auto p-4 md:p-8 animate-fade">
                    <div class="mb-6 bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-sm font-bold mb-5 flex items-center gap-2 text-gray-800">
                            <i class="ti ti-user-circle text-lg" style="color: var(--brand)"></i> 帳號基本資料
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-gray-400">姓名</label>
                                <div class="p-3 bg-gray-50 border border-gray-200 rounded-md text-xs text-gray-700">${uName}</div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-gray-400">系統權限角色</label>
                                <div class="p-3 bg-gray-50 border border-gray-200 rounded-md text-xs text-gray-700">${uRole.toUpperCase()}</div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-6 bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                        <h3 class="text-sm font-bold mb-1 flex items-center gap-2 text-gray-800">
                            <i class="ti ti-palette text-lg" style="color: var(--brand)"></i> 自訂系統配色
                        </h3>
                        <p class="text-xs text-gray-400 mb-5">選擇您喜歡的品牌主題色，設定將自動同步變更。</p>
                        <div class="flex flex-wrap gap-5" id="themePickerContainer"></div>
                    </div>
                </div>
            `;

            const pickerContainer = document.getElementById('themePickerContainer');
            const themeNames = { blue: '經典藍', emerald: '翡翠綠', violet: '羅蘭紫', rose: '玫瑰紅', slate: '沉穩灰' };
            
            Object.keys(THEMES).forEach(key => {
                const isActive = currentTheme === key;
                const btn = document.createElement('button');
                btn.className = 'flex flex-col items-center gap-2 transition-transform hover:-translate-y-0.5 active:scale-95';
                btn.innerHTML = `
                    <div style="width: 44px; height: 44px; background: ${THEMES[key].brand}; border: ${isActive ? '3px solid #111827' : '3px solid transparent'}" class="rounded-full flex items-center justify-center text-white shadow-sm transition-all">
                        ${isActive ? '<i class="ti ti-check text-xl"></i>' : ''}
                    </div>
                    <span class="text-xs ${isActive ? 'font-bold text-gray-900' : 'text-gray-500'}">${themeNames[key]}</span>
                `;
                btn.onclick = () => {
                    localStorage.setItem('user_theme', key);
                    applySystemTheme(key);
                    loadNativeProfileView(); 
                };
                pickerContainer.appendChild(btn);
            });
        }
    </script>

    <script>
        function toggleDesktopSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function toggleMobileSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            if (open) {
                sidebar.classList.add('open');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
