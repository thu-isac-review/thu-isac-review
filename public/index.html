<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實習課程書面審查作業系統 - 東海大學實習中心</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --brand: #1a56db;
          --brand-hover: #1649c0;
          --brand-light: #eff4ff;
          --brand-border: #c3d2f9;
          --sidebar-w: 240px;
          --topbar-h: 56px;
          --bg: #f8f9fc;
          --surface: #ffffff;
          --border: #e5e7ef;
          --border-strong: #cdd0dd;
          --text-primary: #111827;
          --text-secondary: #4b5563;
          --text-muted: #9ca3af;
          --success: #059669;
          --danger: #dc2626;
          --radius-sm: 6px;
          --radius: 8px;
          --radius-lg: 12px;
          --radius-xl: 16px;
          --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
          --transition: 150ms cubic-bezier(0.4,0,0.2,1);
        }

        html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: var(--text-primary); background: var(--bg); -webkit-font-smoothing: antialiased; }

        /* ─── LAYOUT ─── */
        #app { display: flex; height: 100vh; overflow: hidden; }

        /* ─── SIDEBAR ─── */
        #sidebar {
          width: var(--sidebar-w);
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex;
          flex-direction: column;
          flex-shrink: 0;
          z-index: 30;
          transition: transform 0.3s ease;
        }
        .sidebar-logo {
          height: var(--topbar-h);
          padding: 0 16px;
          display: flex;
          align-items: center;
          gap: 10px;
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }
        .sidebar-logo .logo-icon {
          width: 30px; height: 30px;
          background: var(--brand);
          border-radius: var(--radius-sm);
          display: flex; align-items: center; justify-content: center;
          color: white;
          font-size: 18px;
          flex-shrink: 0;
        }
        .sidebar-logo .logo-text { font-size: 13px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
        .sidebar-logo .logo-sub { font-size: 10px; color: var(--text-muted); font-weight: 400; }
        
        .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
        .nav-group-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; padding: 0 8px; margin: 16px 0 4px; }
        .nav-group-label:first-child { margin-top: 4px; }
        .nav-item {
          display: flex; align-items: center; gap: 9px;
          padding: 8px 10px;
          border-radius: var(--radius);
          cursor: pointer;
          color: var(--text-secondary);
          font-size: 13px; font-weight: 500;
          transition: background var(--transition), color var(--transition);
          user-select: none;
          margin-bottom: 1px;
        }
        .nav-item i { width: 18px; text-align: center; font-size: 16px; flex-shrink: 0; }
        .nav-item:hover { background: var(--bg); color: var(--text-primary); }
        .nav-item.active { background: var(--brand-light); color: var(--brand); font-weight: 700; }
        
        .sidebar-footer {
          padding: 12px 8px;
          border-top: 1px solid var(--border);
          flex-shrink: 0;
        }
        .user-row {
          display: flex; align-items: center; gap: 9px;
          padding: 8px 10px;
          border-radius: var(--radius);
          cursor: pointer;
          transition: background var(--transition);
        }
        .user-row:hover { background: var(--bg); }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-light); border: 1.5px solid var(--brand-border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--brand); flex-shrink: 0; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ─── MAIN ─── */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        /* ─── TOPBAR ─── */
        #topbar {
          height: var(--topbar-h);
          background: var(--surface);
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center;
          padding: 0 24px;
          gap: 12px;
          flex-shrink: 0;
          z-index: 20;
        }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); flex: 1; }
        .breadcrumb .crumb-active { color: var(--text-primary); font-weight: 600; }
        .breadcrumb i { font-size: 14px; }
        .topbar-actions { display: flex; align-items: center; gap: 8px; }
        
        .icon-btn {
          width: 32px; height: 32px;
          border-radius: var(--radius);
          border: 1px solid var(--border);
          background: var(--surface);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          color: var(--text-secondary);
          transition: all var(--transition);
          position: relative;
          font-size: 18px;
        }
        .icon-btn:hover { background: var(--bg); border-color: var(--border-strong); color: var(--text-primary); }
        .icon-btn.danger:hover { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
        .v-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

        /* ─── CONTENT AREA ─── */
        #content { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
        iframe { border: none; width: 100%; height: 100%; background: transparent; }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        /* Mobile specific styles */
        @media (max-width: 768px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #topbar { padding: 0 16px; }
            .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25; }
        }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; }
        @media (max-width: 768px) { .mobile-menu-btn { display: block; margin-right: 8px; } }

        /* Loader & Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1.2s linear infinite; display: inline-block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null); 
            const [loading, setLoading] = useState(true);
            const [currentHash, setCurrentHash] = useState(''); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(false); 
            
            const getCacheBustedUrl = (url) => {
                if (!url) return '';
                const [path, queryStr] = url.split('?');
                let finalUrl = `${path}?v=${new Date().getTime()}`;
                if (queryStr) finalUrl += `&${queryStr}`;
                return finalUrl;
            };

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        try {
                            const userDoc = await getDoc(doc(db, "users", u.uid));
                            if(userDoc.exists()) {
                                setUserData(userDoc.data());
                            } else if (u.email === 'thu.isac.review@gmail.com') {
                                setUserData({
                                    level1Unit: '系統管理中心',
                                    level2Unit: '核心維運組',
                                    jobTitle: '管理員',
                                    name: '預設管理者',
                                    isFirstLogin: false
                                });
                            }
                        } catch (err) {
                            console.error("載入資料失敗", err);
                        }
                        setLoading(false);
                    } else {
                        setUser(null);
                        setUserData(null);
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const handleHashChange = () => {
                    let hash = window.location.hash.replace('#', '');
                    if (!hash) {
                        hash = '/dashboard-content.html';
                        window.history.replaceState(null, null, '#' + hash);
                    }
                    setCurrentHash(hash);
                };
                
                window.addEventListener('hashchange', handleHashChange);
                handleHashChange(); 
                
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const navigate = (path) => {
                window.location.hash = path;
                setIsSidebarOpen(false); 
            };

            const handleLogout = () => {
                if (window.confirm("確定要登出系統嗎？")) {
                    signOut(auth);
                }
            };

            if (loading) return (
                <div className="h-full flex items-center justify-center bg-[#f8f9fc]">
                    <div className="flex flex-col items-center gap-4">
                        <i className="ti ti-loader icon-spin text-4xl" style={{color: 'var(--brand)'}}></i>
                        <p style={{color: 'var(--text-muted)', fontSize: '13px', fontWeight: 'bold'}}>系統載入中...</p>
                    </div>
                </div>
            );

            if (!user) return <LoginView />;

            if (userData?.isFirstLogin) {
                return <FirstTimeSetupView user={user} onComplete={() => setUserData({...userData, isFirstLogin: false})} />;
            }

            const getPageTitle = () => {
                if (currentHash.includes('dashboard')) return '首頁';
                if (currentHash.includes('list')) return '審查作業 / 學生待查核名單';
                
                if (currentHash.includes('review/department')) return '審查作業 / 系所審查作業';
                if (currentHash.includes('review/school')) return '審查作業 / 校級審查作業';
                
                if (currentHash.includes('intern_view/course')) return '實習資料瀏覽 / 實習課程清單';
                if (currentHash.includes('intern_view/students')) return '實習資料瀏覽 / 實習學生清單';
                if (currentHash.includes('intern_view/institution')) return '實習資料瀏覽 / 實習機構清單';
                if (currentHash.includes('intern_view/record')) return '實習資料瀏覽 / 實習記錄清單';
                
                if (currentHash.includes('intern_manage/staging_review')) return '實習資料管理 / 批次匯入審查中心';
                if (currentHash.includes('intern_manage/course')) return '實習資料管理 / 實習課程管理';
                if (currentHash.includes('intern_manage/students')) return '實習資料管理 / 實習學生管理';
                if (currentHash.includes('intern_manage/institution')) return '實習資料管理 / 實習機構管理';
                if (currentHash.includes('intern_manage/record')) return '實習資料管理 / 實習記錄管理';

                if (currentHash.includes('moe-indicators')) return '審查項目設定 / 教育部審查指標設定';
                if (currentHash.includes('administrative_files')) return '審查項目設定 / 行政文件審查設定';
                if (currentHash.includes('students_files')) return '審查項目設定 / 學生文件審查設定';
                if (currentHash.includes('institution_files')) return '審查項目設定 / 機構文件審查設定';
                if (currentHash.includes('other_files')) return '審查項目設定 / 其他文件審查設定';
                
                if (currentHash.includes('departments')) return '系統設定 / 系所清單管理';
                if (currentHash.includes('roles')) return '系統設定 / 用戶權限管理';
                
                return '實習課程書面審查作業系統';
            };

            return (
                <div id="app">
                    {/* Mobile Overlay */}
                    {isSidebarOpen && <div className="mobile-overlay" onClick={() => setIsSidebarOpen(false)}></div>}

                    {/* Sidebar */}
                    <nav id="sidebar" className={`custom-scroll ${isSidebarOpen ? 'open' : ''}`}>
                        <div className="sidebar-logo">
                            <div className="logo-icon"><i className="ti ti-shield-half"></i></div>
                            <div>
                                <div className="logo-text">書面審查作業系統</div>
                                <div className="logo-sub">東海大學 ISAC</div>
                            </div>
                        </div>
                        
                        <div className="sidebar-nav custom-scroll">
                            <MenuBtn active={currentHash === '/dashboard-content.html'} label="首頁" icon="ti ti-home" onClick={() => navigate('/dashboard-content.html')} />
                            
                            <div className="nav-group-label">審查作業</div>
                            <MenuBtn active={currentHash === '/list.html'} label="學生待查核名單" icon="ti ti-user-check" onClick={() => navigate('/list.html')} />
                            <MenuBtn active={currentHash === '/review/department.html'} label="系所審查作業" icon="ti ti-building-community" onClick={() => navigate('/review/department.html')} />
                            <MenuBtn active={currentHash === '/review/school.html'} label="校級審查作業" icon="ti ti-building-bank" onClick={() => navigate('/review/school.html')} />
                            
                            <div className="nav-group-label">實習資料瀏覽</div>
                            <MenuBtn active={currentHash === '/intern_view/course.html'} label="實習課程清單" icon="ti ti-book" onClick={() => navigate('/intern_view/course.html')} />
                            <MenuBtn active={currentHash === '/intern_view/students.html'} label="實習學生清單" icon="ti ti-address-book" onClick={() => navigate('/intern_view/students.html')} />
                            <MenuBtn active={currentHash === '/intern_view/institution.html'} label="實習機構清單" icon="ti ti-building" onClick={() => navigate('/intern_view/institution.html')} />
                            <MenuBtn active={currentHash === '/intern_view/record.html'} label="實習記錄清單" icon="ti ti-clipboard-list" onClick={() => navigate('/intern_view/record.html')} />
                            
                            <div className="nav-group-label">實習資料管理</div>
                            <MenuBtn active={currentHash === '/intern_manage/staging_review.html'} label="批次匯入審查中心" icon="ti ti-cloud-upload" onClick={() => navigate('/intern_manage/staging_review.html')} />
                            <MenuBtn active={currentHash === '/intern_manage/course.html'} label="實習課程管理" icon="ti ti-book" onClick={() => navigate('/intern_manage/course.html')} />
                            <MenuBtn active={currentHash === '/intern_manage/students.html'} label="實習學生管理" icon="ti ti-user-cog" onClick={() => navigate('/intern_manage/students.html')} />
                            <MenuBtn active={currentHash === '/intern_manage/institution.html'} label="實習機構管理" icon="ti ti-building" onClick={() => navigate('/intern_manage/institution.html')} />
                            <MenuBtn active={currentHash === '/intern_manage/record.html'} label="實習記錄管理" icon="ti ti-clipboard-check" onClick={() => navigate('/intern_manage/record.html')} />
                            
                            <div className="nav-group-label">審查項目設定</div>
                            <MenuBtn active={currentHash === '/settings/moe-indicators.html'} label="教育部審查指標設定" icon="ti ti-list-check" onClick={() => navigate('/settings/moe-indicators.html')} />
                            <MenuBtn active={currentHash === '/settings/administrative_files.html'} label="行政文件審查設定" icon="ti ti-folder" onClick={() => navigate('/settings/administrative_files.html')} />
                            <MenuBtn active={currentHash === '/settings/students_files.html'} label="學生文件審查設定" icon="ti ti-file-text" onClick={() => navigate('/settings/students_files.html')} />
                            <MenuBtn active={currentHash === '/settings/institution_files.html'} label="機構文件審查設定" icon="ti ti-file-pencil" onClick={() => navigate('/settings/institution_files.html')} />
                            <MenuBtn active={currentHash === '/settings/other_files.html'} label="其他文件審查設定" icon="ti ti-file-plus" onClick={() => navigate('/settings/other_files.html')} />
                            
                            <div className="nav-group-label">系統設定</div>
                            <MenuBtn active={currentHash === '/manage/departments.html'} label="系所清單管理" icon="ti ti-school" onClick={() => navigate('/manage/departments.html')} />
                            <MenuBtn active={currentHash === '/manage/roles.html'} label="用戶權限管理" icon="ti ti-shield-lock" onClick={() => navigate('/manage/roles.html')} />
                        </div>
                        
                        <div className="sidebar-footer">
                            <div className="user-row" onClick={() => alert('個人資料設定即將推出')}>
                                <div className="user-avatar">{userData?.name ? userData.name.charAt(0) : 'U'}</div>
                                <div className="user-info">
                                    <div className="user-name">{userData ? `${userData.jobTitle || ''} ${userData.name || '管理員'}` : '使用者'}</div>
                                    <div className="user-role">{userData ? `${userData.level1Unit || ''} | ${userData.level2Unit || ''}` : '資料讀取中...'}</div>
                                </div>
                                <i className="ti ti-settings" style={{fontSize:'16px', color:'var(--text-muted)'}}></i>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <div id="main">
                        <header id="topbar">
                            <div className="breadcrumb">
                                <button className="mobile-menu-btn" onClick={() => setIsSidebarOpen(true)}>
                                    <i className="ti ti-menu-2"></i>
                                </button>
                                <span className="hidden sm:inline">實習書審系統</span>
                                <i className="ti ti-chevron-right hidden sm:inline" style={{fontSize: '14px', margin: '0 2px'}}></i>
                                <span className="crumb-active">{getPageTitle()}</span>
                            </div>
                            
                            <div className="topbar-actions">
                                <div className="icon-btn" title="系統通知">
                                    <i className="ti ti-bell"></i>
                                </div>
                                <div className="v-divider"></div>
                                <div className="icon-btn danger" title="登出系統" onClick={handleLogout}>
                                    <i className="ti ti-logout"></i>
                                </div>
                            </div>
                        </header>

                        <div id="content" className="custom-scroll" style={{ WebkitOverflowScrolling: 'touch' }}>
                            {currentHash && (
                                <iframe 
                                    src={getCacheBustedUrl(currentHash)} 
                                    key={currentHash}
                                    className="animate-fade"
                                    title="Content View"
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function MenuBtn({ active, label, icon, onClick }) {
            return (
                <div onClick={onClick} className={`nav-item ${active ? 'active' : ''}`}>
                    <i className={icon}></i>
                    <span>{label}</span>
                </div>
            );
        }

        function FirstTimeSetupView({ user, onComplete }) {
            const [isUpdating, setIsUpdating] = useState(false);
            const [showPwd, setShowPwd] = useState(false);
            const [showConfirmPwd, setShowConfirmPwd] = useState(false);

            const handleUpdate = async (e) => {
                e.preventDefault();
                const pwd = e.target.password.value;
                const confirmPwd = e.target.confirmPassword.value;
                const pwdRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,20}$/;
                if (!pwdRegex.test(pwd)) {
                    alert("密碼不符合安全規則！\n請輸入 8~20 個字元，並包含至少一個「大寫字母」、一個「小寫字母」及「數字」。");
                    return;
                }
                if (pwd !== confirmPwd) {
                    alert("兩次輸入的密碼不相符，請重新確認！");
                    return;
                }
                setIsUpdating(true);
                try {
                    await updatePassword(user, pwd);
                    await updateDoc(doc(db, "users", user.uid), { isFirstLogin: false });
                    alert("✅ 專屬密碼設定成功！即將為您導向系統。");
                    onComplete();
                } catch (err) {
                    if (err.code === 'auth/requires-recent-login') {
                        alert("基於安全考量，請重新登入後再進行密碼設定。");
                        signOut(auth);
                    } else { alert("密碼設定失敗：" + err.message); }
                } finally { setIsUpdating(false); }
            };

            return (
                <div className="h-full flex items-center justify-center p-4" style={{backgroundColor: 'var(--bg)'}}>
                    <form onSubmit={handleUpdate} className="w-full max-w-md animate-fade" style={{background: 'var(--surface)', padding: '40px', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow)', border: '1px solid var(--border)'}}>
                        <div className="flex flex-col items-center mb-8 text-center">
                            <div style={{width: '48px', height: '48px', borderRadius: 'var(--radius-lg)', background: 'var(--success-bg)', color: 'var(--success)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '16px', fontSize: '24px'}}>
                                {/* 改為 user-key */}
                                <i className="ti ti-user-key"></i>
                            </div>
                            <h1 style={{fontSize: '18px', fontWeight: '700', color: 'var(--text-primary)'}}>初次啟用帳號</h1>
                            <p style={{fontSize: '13px', color: 'var(--text-secondary)', marginTop: '8px', lineHeight: '1.6'}}>
                                歡迎加入實習書審平台！<br/>基於安全規範，請設定您的專屬登入密碼。
                            </p>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <div className="relative">
                                    <input name="password" type={showPwd ? "text" : "password"} placeholder="設定新密碼" style={{width: '100%', padding: '12px 16px', borderRadius: 'var(--radius)', border: '1px solid var(--border)', background: 'var(--bg)', outline: 'none', fontSize: '13px', fontFamily: 'inherit'}} required />
                                    <button type="button" onClick={() => setShowPwd(!showPwd)} className="absolute right-4 top-1/2 -translate-y-1/2" style={{color: 'var(--text-muted)', fontSize: '18px'}}>
                                        <i className={showPwd ? 'ti ti-eye-off' : 'ti ti-eye'}></i>
                                    </button>
                                </div>
                                <p style={{fontSize: '11px', color: 'var(--text-muted)', marginTop: '6px', display: 'flex', alignItems: 'center', gap: '4px'}}><i className="ti ti-info-circle" style={{color: 'var(--brand)', fontSize: '14px'}}></i> 需為 8~20 碼，並包含大小寫字母與數字。</p>
                            </div>
                            <div className="relative">
                                <input name="confirmPassword" type={showConfirmPwd ? "text" : "password"} placeholder="再次確認新密碼" style={{width: '100%', padding: '12px 16px', borderRadius: 'var(--radius)', border: '1px solid var(--border)', background: 'var(--bg)', outline: 'none', fontSize: '13px', fontFamily: 'inherit'}} required />
                                <button type="button" onClick={() => setShowConfirmPwd(!showConfirmPwd)} className="absolute right-4 top-1/2 -translate-y-1/2" style={{color: 'var(--text-muted)', fontSize: '18px'}}>
                                    <i className={showConfirmPwd ? 'ti ti-eye-off' : 'ti ti-eye'}></i>
                                </button>
                            </div>
                        </div>
                        <button disabled={isUpdating} style={{width: '100%', background: 'var(--brand)', color: 'white', padding: '12px', borderRadius: 'var(--radius)', fontWeight: '600', marginTop: '24px', border: 'none', cursor: isUpdating ? 'not-allowed' : 'pointer', opacity: isUpdating ? 0.7 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'}}>
                            {isUpdating ? <><i className="ti ti-loader icon-spin text-lg"></i> 設定中...</> : "確認設定並進入系統"}
                        </button>
                    </form>
                </div>
            );
        }

        function LoginView() {
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                let emailInput = email.trim();

                if (emailInput && !emailInput.includes('@')) {
                    const fullEmail = emailInput + '@thu.edu.tw';
                    setEmail(fullEmail); 
                    emailInput = fullEmail;
                }

                try {
                    await signInWithEmailAndPassword(auth, emailInput, password);
                } catch (err) {
                    alert("登入失敗：請確認帳號或密碼是否正確。\n(若為初次啟用，請使用管理員配發之初始密碼)");
                } finally { setIsLoggingIn(false); }
            };

            return (
                <div className="h-full flex items-center justify-center p-4" style={{backgroundColor: 'var(--bg)'}}>
                    <form onSubmit={handleLogin} className="w-full max-w-md animate-fade" style={{background: 'var(--surface)', padding: '40px', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow)', border: '1px solid var(--border)'}}>
                        <div className="flex flex-col items-center mb-8 text-center">
                            <div style={{width: '56px', height: '56px', borderRadius: 'var(--radius-lg)', background: 'var(--brand)', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '16px', fontSize: '28px', boxShadow: 'var(--shadow-sm)'}}>
                                {/* 改為 user-key */}
                                <i className="ti ti-user-key"></i>
                            </div>
                            <h1 style={{fontSize: '18px', fontWeight: '700', color: 'var(--text-primary)'}}>東海大學 實習與學生成就中心</h1>
                            <p style={{fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px'}}>實習課程書面審查作業系統</p>
                        </div>
                        <div className="space-y-4">
                            <input 
                                name="email" 
                                type="text" 
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder="請輸入帳號或電子郵件 (@thu.edu.tw)" 
                                style={{width: '100%', padding: '14px 16px', borderRadius: 'var(--radius)', border: '1px solid var(--border)', background: 'var(--bg)', outline: 'none', fontSize: '13px', fontFamily: 'inherit'}}
                                required 
                            />
                            <div className="relative">
                                <input 
                                    name="password" 
                                    type={showPassword ? "text" : "password"} 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="請輸入密碼" 
                                    style={{width: '100%', padding: '14px 16px', borderRadius: 'var(--radius)', border: '1px solid var(--border)', background: 'var(--bg)', outline: 'none', fontSize: '13px', fontFamily: 'inherit'}}
                                    required 
                                />
                                <button 
                                    type="button" 
                                    onClick={() => setShowPassword(!showPassword)} 
                                    className="absolute right-4 top-1/2 -translate-y-1/2"
                                    style={{color: 'var(--text-muted)', fontSize: '18px'}}
                                >
                                    <i className={showPassword ? 'ti ti-eye-off' : 'ti ti-eye'}></i>
                                </button>
                            </div>
                        </div>
                        <button disabled={isLoggingIn} style={{width: '100%', background: 'var(--brand)', color: 'white', padding: '14px', borderRadius: 'var(--radius)', fontWeight: '600', marginTop: '24px', border: 'none', cursor: isLoggingIn ? 'not-allowed' : 'pointer', opacity: isLoggingIn ? 0.7 : 1, transition: 'background var(--transition)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'}}>
                            {isLoggingIn ? <><i className="ti ti-loader icon-spin text-lg"></i> 連線中...</> : "進入系統"}
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
