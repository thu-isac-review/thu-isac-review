<div class="student-module-container">
    <!-- 頂部操作與搜尋區 -->
    <div class="module-header">
        <div class="search-filters">
            <input type="text" id="student-search-input" placeholder="搜尋學號、姓名或系所..." />
            <select id="student-status-filter">
                <option value="">所有狀態</option>
                <option value="pending">審核中</option>
                <option value="active">實習中</option>
                <option value="completed">已結案</option>
            </select>
        </div>
        <div class="header-actions">
            <button id="btn-add-student" class="btn btn-primary" style="display: none;">+ 新增學生</button>
        </div>
    </div>

    <!-- 資料表格區 -->
    <div class="table-responsive">
        <table class="data-table" id="student-table">
            <thead>
                <tr>
                    <th>學號</th>
                    <th>姓名</th>
                    <th>系級</th>
                    <th>實習機構</th>
                    <th>狀態</th>
                    <th class="action-column" style="display: none;">操作</th>
                </tr>
            </thead>
            <tbody id="student-table-body">
                <!-- 資料將由 JS 動態渲染 -->
            </tbody>
        </table>
    </div>

    <!-- 分頁區 -->
    <div class="pagination-container" id="student-pagination">
        <!-- 分頁按鈕動態渲染 -->
    </div>

    <!-- 新增/編輯 學生 Modal -->
    <div id="student-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="student-modal-title">新增學生</h3>
                <button class="btn-close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="student-form">
                    <input type="hidden" id="student-id" name="id">
                    <div class="form-group">
                        <label for="student-number">學號 <span class="required">*</span></label>
                        <input type="text" id="student-number" name="number" required>
                    </div>
                    <div class="form-group">
                        <label for="student-name">姓名 <span class="required">*</span></label>
                        <input type="text" id="student-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="student-dept">系級 <span class="required">*</span></label>
                        <input type="text" id="student-dept" name="department" required>
                    </div>
                    <div class="form-group">
                        <label for="student-company">實習機構</label>
                        <input type="text" id="student-company" name="company">
                    </div>
                    <div class="form-group">
                        <label for="student-status">狀態</label>
                        <select id="student-status" name="status">
                            <option value="pending">審核中</option>
                            <option value="active">實習中</option>
                            <option value="completed">已結案</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary btn-cancel-modal">取消</button>
                        <button type="submit" class="btn btn-primary">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
