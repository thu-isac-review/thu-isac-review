<link rel="stylesheet" href="./assets/css/student.css">
<style id="dynamic-col-styles"></style>

<div id="student-page-wrapper" style="height: 100%; display: flex; flex-direction: column;">
    <!-- ─── TOOLBAR ─── -->
    <div class="toolbar">
        <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="search-input" placeholder="搜尋學號或姓名..." class="search-input">
        </div>
        
        <div class="flex-spacer"></div>
        
        <div class="toolbar-actions">
            <button id="btn-export-csv" class="btn btn-success-solid">
                <i class="ti ti-file-export"></i> <span class="btn-text">匯出清單</span>
            </button>
            <button id="btn-import-trigger" class="btn btn-indigo-solid">
                <i class="ti ti-file-import"></i> <span class="btn-text">批次匯入</span>
            </button>
            <div class="v-divider"></div>
            <button id="btn-create-student" class="btn btn-primary">
                <i class="ti ti-plus"></i> <span class="btn-text">新增學生</span>
            </button>
        </div>
        <input type="file" id="import-file" accept=".csv" style="display:none;">
    </div>

    <!-- ─── FILTER ROW & BATCH BAR ─── -->
    <div class="filter-row">
        <div class="filters-scroll-area custom-scroll">
            <div class="filter-pill-wrap" id="pill-wrap-college">
                <button class="filter-pill" id="pill-college">全部學院 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-college">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-college-input" placeholder="搜尋學院...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="college" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list custom-scroll" id="college-options-container"></div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-dept">
                <button class="filter-pill" id="pill-dept">全部學系 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-dept">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-dept-input" placeholder="搜尋學系...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="dept" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list custom-scroll" id="dept-options-container"></div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-gender">
                <button class="filter-pill" id="pill-gender">全部性別 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-gender">
                    <div class="filter-dropdown-list custom-scroll" id="gender-options-container"></div>
                    <div class="filter-dropdown-footer" style="padding: 6px 8px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
                        <button type="button" class="btn-clear-filter" data-type="gender" style="font-size: 11px; font-weight: 600; color: var(--danger); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: var(--radius-sm);">清除此篩選</button>
                    </div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-nationality">
                <button class="filter-pill" id="pill-nationality">全部國籍 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-nationality">
                    <div class="filter-dropdown-list custom-scroll" id="nationality-options-container"></div>
                    <div class="filter-dropdown-footer" style="padding: 6px 8px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
                        <button type="button" class="btn-clear-filter" data-type="nationality" style="font-size: 11px; font-weight: 600; color: var(--danger); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: var(--radius-sm);">清除此篩選</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="batch-bar">
            <div class="batch-info"><i class="ti ti-checks" style="font-size:18px;"></i> 已選 <span id="selected-count">0</span> 名學生</div>
            <button id="btn-select-all-filtered" class="btn btn-sm btn-secondary">選取全部符合條件</button>
            <button id="btn-clear-selection" class="btn btn-sm btn-secondary">取消選取</button>
            <div class="flex-spacer"></div>
            <button id="btn-batch-delete" class="btn btn-sm btn-danger-solid"><i class="ti ti-trash"></i> 批次刪除</button>
        </div>
    </div>

    <!-- ─── TABLE AREA ─── -->
    <div class="table-wrap">
        <div class="table-scroll custom-scroll">
            <table>
                <thead id="student-table-head">
                    <tr>
                        <th class="col-checkbox" style="width: 48px; text-align: center;">
                            <div class="flex-center">
                                <input type="checkbox" id="selectAll" style="accent-color: var(--brand); cursor: pointer; width: 14px; height: 14px; margin: 0;">
                            </div>
                        </th>
                        <th data-sort="college" class="col-college" style="width: 130px; text-align: center;">學院 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="department" class="col-department" style="width: 130px; text-align: center;">學系 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="student_id" class="col-student_id" style="width: 130px; text-align: center;">學號 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="name" class="col-name" style="width: 130px; text-align: center;">姓名 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="gender" class="col-gender" style="width: 130px; text-align: center;">性別 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="nationality" class="col-nationality" style="width: 130px; text-align: center;">國籍 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="record_count" class="col-record_count" style="width: 90px; text-align: center;">實習紀錄 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <!-- 🌟 [新增] 獨立的查看紀錄欄位 -->
                        <th class="col-view_record" style="width: 100px; text-align: center;">查看紀錄</th>
                        <!-- 🌟 [修改] 操作欄位寬度調回 90px -->
                        <th class="col-actions" style="width: 90px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
        </div>
        
        <div id="empty-state-container" class="empty-state" style="display: none;">
            <i class="ti ti-loader-2 ti-spin empty-icon" style="color:var(--brand); opacity:1;"></i>
            <div class="empty-text">資料載入中...</div>
        </div>

        <div class="pagination-bar">
            <div class="pagination-info" id="pagination-info">共 0 筆</div>
            <div class="pagination-bar-right">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-size:12px; color:var(--text-muted)">每頁顯示</span>
                    <select class="per-page-select" id="per-page-select">
                        <option value="15">15 筆</option>
                        <option value="25">25 筆</option>
                        <option value="50">50 筆</option>
                    </select>
                </div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </div>
        </div>
    </div>

    <!-- ─── MODAL ─── -->
    <div id="data-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 600px;">
            <div class="dialog-header flex-col items-start p-0 border-none" style="flex-direction: column; align-items: flex-start; padding: 0; border: none;">
                <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px;">
                    <h3 id="modal-title" style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;"><i class="ti ti-user-plus text-brand" style="font-size: 20px;"></i> 新增學生資料</h3>
                    <button type="button" class="dialog-close" id="btn-close-modal-x"><i class="ti ti-x"></i></button>
                </div>
            </div>

            <div class="dialog-body-container">
                <form id="data-form" class="custom-scroll" style="display: flex; flex-direction: column; width: 100%; padding: 24px; overflow-y: auto;">
                    <div class="form-section-title"><i class="ti ti-info-circle"></i> 學生基本資料</div>
                    
                    <div class="form-grid">
                        <div class="field">
                            <label class="field-label">所屬學院 <span class="req">*</span></label>
                            <select id="input-college" required class="field-select">
                                <option value="">請選擇學院...</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">所屬學系 <span class="req">*</span></label>
                            <select id="input-department" required class="field-select">
                                <option value="">請先選擇學院...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label class="field-label">學號 <span class="req">*</span></label>
                            <input type="text" id="input-student-id" required placeholder="例如：S1101234" class="field-input" style="text-transform:uppercase;">
                        </div>
                        <div class="field">
                            <label class="field-label">姓名 <span class="req">*</span></label>
                            <input type="text" id="input-name" required placeholder="例如：王小明" class="field-input">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label class="field-label">性別 <span class="req">*</span></label>
                            <select id="input-gender" required class="field-select">
                                <option value="男" selected>男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label">國籍 <span class="req">*</span></label>
                            <select id="input-nationality" required class="field-select">
                                <option value="本國籍" selected>本國籍</option>
                                <option value="外籍生">外籍生</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" id="btn-cancel-modal">取消</button>
                <button type="button" id="btn-submit" class="btn btn-primary"><i class="ti ti-check"></i> 確認儲存</button>
            </div>
        </div>
    </div>
</div>
