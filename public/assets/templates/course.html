<!-- 頁面標題與操作區 -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0 text-gray-800">課程管理</h2>
    <!-- 只有管理端需要顯示新增按鈕，可由 JS 控制顯示/隱藏或由 CSS 預設隱藏 -->
    <button id="add-course-btn" class="btn btn-primary btn-sm manage-only-element">
        <i class="fas fa-plus fa-sm text-white-50 mr-1"></i> 新增課程
    </button>
</div>

<!-- 篩選與搜尋區塊 -->
<div class="card shadow mb-4">
    <div class="card-body">
        <div class="row align-items-center form-row">
            <div class="col-md-3 mb-2 mb-md-0">
                <input type="text" id="search-input" class="form-control" placeholder="搜尋課程名稱或代碼...">
            </div>
            <div class="col-md-3 mb-2 mb-md-0">
                <select id="semester-filter" class="form-control custom-select">
                    <option value="">所有學期</option>
                    <option value="112-1">112-1</option>
                    <option value="112-2">112-2</option>
                </select>
            </div>
            <div class="col-md-3 mb-2 mb-md-0">
                <select id="department-filter" class="form-control custom-select">
                    <option value="">所有開課單位</option>
                </select>
            </div>
            <div class="col-md-3 text-right">
                <button id="search-btn" class="btn btn-secondary">
                    <i class="fas fa-search"></i> 搜尋
                </button>
                <button id="reset-btn" class="btn btn-outline-secondary ml-1">重設</button>
            </div>
        </div>
    </div>
</div>

<!-- 資料表格區塊 -->
<div class="card shadow mb-4">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-bordered mb-0" id="course-table">
                <thead class="thead-light">
                    <tr>
                        <th width="10%">學期</th>
                        <th width="15%">課程代碼</th>
                        <th width="30%">課程名稱</th>
                        <th width="20%">開課單位</th>
                        <th width="10%">學分</th>
                        <th width="15%" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="course-table-body">
                    <!-- 列表資料將由 JS 動態渲染 -->
                    <tr>
                        <td colspan="6" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="sr-only">載入中...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 分頁區塊 -->
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <div id="pagination-info" class="text-muted small"></div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0" id="pagination-container">
                <!-- 分頁按鈕將由 JS 動態渲染 -->
            </ul>
        </nav>
    </div>
</div>

<!-- 新增/編輯課程 Modal (表單) -->
<div class="modal fade" id="courseModal" tabindex="-1" role="dialog" aria-labelledby="courseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="courseModalLabel">新增/編輯課程</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="course-form">
                    <input type="hidden" id="course-id" name="id">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="course-semester">學期 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="course-semester" name="semester" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="course-code">課程代碼 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="course-code" name="code" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="course-name">課程名稱 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="course-name" name="name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="course-department">開課單位 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="course-department" name="department" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="course-credits">學分 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="course-credits" name="credits" min="0" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="save-course-btn">儲存</button>
            </div>
        </div>
    </div>
</div>

<!-- 刪除確認 Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">確認刪除</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                確定要刪除這筆課程資料嗎？此操作無法復原。
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">確認刪除</button>
            </div>
        </div>
    </div>
</div>
