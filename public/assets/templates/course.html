<link rel="stylesheet" href="./assets/css/course.css">
<style id="dynamic-col-styles"></style>

<div id="course-page-wrapper" style="height: 100%; display: flex; flex-direction: column;">
    <div class="toolbar">
        <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="search-input" placeholder="搜尋課程名稱、代碼或系所..." class="search-input">
        </div>
        <div class="flex-spacer"></div>
        <div class="toolbar-actions">
            <button id="btn-export-csv" class="btn btn-success-solid"><i class="ti ti-file-export"></i> <span class="btn-text">匯出清單</span></button>
            <button id="btn-import-trigger" class="btn btn-indigo-solid"><i class="ti ti-file-import"></i> <span class="btn-text">批次匯入</span></button>
            <div class="v-divider"></div>
            <button id="btn-create-course" class="btn btn-primary"><i class="ti ti-plus"></i> <span class="btn-text">新增課程</span></button>
        </div>
        <input type="file" id="import-file" accept=".csv" style="display:none;">
    </div>

    <div class="filter-row">
        <div class="filters-scroll-area custom-scroll">
            <div class="filter-pill-wrap" id="pill-wrap-semester">
                <button class="filter-pill" id="pill-semester">全部學期 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-semester">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-semester-input" placeholder="搜尋學期...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="semester" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list" id="semester-options-container"></div>
                </div>
            </div>
            
            <div class="filter-pill-wrap" id="pill-wrap-edu-system">
                <button class="filter-pill" id="pill-edu-system">全部學制 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-edu-system">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-edu-system-input" placeholder="搜尋學制...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="edu-system" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list" id="edu-system-options-container"></div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-college">
                <button class="filter-pill" id="pill-college">全部學院 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-college">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-college-input" placeholder="搜尋學院...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="college" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list" id="college-options-container"></div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-department">
                <button class="filter-pill" id="pill-department">全部系所 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-department">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-department-input" placeholder="搜尋系所...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="department" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list" id="department-options-container"></div>
                </div>
            </div>

            <div class="filter-pill-wrap" id="pill-wrap-course-type">
                <button class="filter-pill" id="pill-course-type">全部選必修 <i class="ti ti-chevron-down"></i></button>
                <div class="filter-dropdown" id="drop-course-type">
                    <div class="filter-dropdown-search">
                        <input type="text" id="search-course-type-input" placeholder="搜尋選必修...">
                        <div style="margin-top:8px; padding:0 4px; display: flex; justify-content: flex-end;">
                            <button type="button" class="btn-light-blue btn-filter-toggle" data-type="course-type" data-state="none">全選</button>
                        </div>
                    </div>
                    <div class="filter-dropdown-list" id="course-type-options-container"></div>
                </div>
            </div>
        </div>

        <div class="relative inline-block text-left" id="display-settings-wrap">
            <button id="btn-display-settings" class="btn btn-secondary btn-sm" style="font-weight: 500;"><i class="ti ti-settings"></i> 顯示設定</button>
            <div id="display-settings-menu" style="position:absolute; right:0; top:calc(100% + 4px); width:200px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:8px; z-index:100; display:none;" class="menu-popup">
                <div style="font-size:11px; font-weight:700; color:var(--text-muted); padding:4px 8px;">顯示欄位設定</div>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="semester" checked> 學期</label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="edu_system" checked> 學制</label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="college" checked> 學院</label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="department" checked> 系所</label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="course_type" checked> 選必修</label>
                <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:13px; cursor:pointer;"><input type="checkbox" class="col-toggle-chk" value="credits" checked> 學分</label>
            </div>
        </div>

        <div id="batch-bar">
            <div class="batch-info"><i class="ti ti-checks" style="font-size:18px;"></i> 已選 <span id="selected-count">0</span> 筆課程</div>
            <button id="btn-select-all-filtered" class="btn btn-sm btn-secondary">選取全部符合條件</button>
            <button id="btn-clear-selection" class="btn btn-sm btn-secondary">取消選取</button>
            <div class="flex-spacer"></div>
            <button id="btn-batch-edit" class="btn btn-sm btn-primary"><i class="ti ti-edit"></i> 批次修改屬性</button>
            <button id="btn-batch-delete" class="btn btn-sm btn-danger-solid"><i class="ti ti-trash"></i> 批次刪除</button>
        </div>
    </div>

    <div class="table-wrap">
        <div class="table-scroll custom-scroll">
            <table>
                <thead>
                    <tr id="course-table-head">
                        <th class="col-checkbox">
                            <div class="flex-center">
                                <input type="checkbox" id="selectAll" style="accent-color: var(--brand); cursor: pointer; width: 14px; height: 14px; margin: 0;">
                            </div>
                        </th>
                        <th class="col-name" data-sort="course_name">課程名稱與代碼 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="semester" class="col-semester">學期 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="edu_system" class="col-edu_system">學制 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="college" class="col-college">學院 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="department" class="col-department">系所 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="course_type" class="col-course_type">選必修 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th data-sort="credits" class="col-credits">學分 <i class="ti ti-arrows-sort sort-icon"></i></th>
                        <th class="col-actions">操作</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div id="empty-state-container" class="empty-state" style="display: none;">
            <i class="ti ti-loader-2 ti-spin empty-icon" style="color:var(--brand); opacity:1;"></i>
            <div class="empty-text">資料載入中...</div>
        </div>

        <div class="pagination-bar">
            <div class="pagination-info" id="pagination-info">共 0 門課程</div>
            <div class="pagination-bar-right">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-size:12px; color:var(--text-muted)">每頁顯示</span>
                    <select class="per-page-select" id="per-page-select">
                        <option value="15">15 筆</option>
                        <option value="25">25 筆</option>
                        <option value="50">50 筆</option>
                    </select>
                </div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </div>
        </div>
    </div>

    <!-- 編輯/新增課程 Modal -->
    <div id="data-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 750px;">
            <div class="dialog-header flex-col items-start p-0 border-none">
                <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 16px; border-bottom:1px solid var(--border);">
                    <h3 id="modal-title" style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;"><i class="ti ti-book text-brand" style="font-size: 20px;"></i> 新增課程</h3>
                    <button type="button" class="dialog-close" id="btn-close-modal-x"><i class="ti ti-x"></i></button>
                </div>
            </div>

            <div class="dialog-body-container">
                <form id="data-form" class="custom-scroll" style="display: flex; gap: 24px; width: 100%; padding: 24px; overflow-y: auto;">
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <div class="form-section-title"><i class="ti ti-notebook"></i> 課程基本資訊</div>
                        
                        <div style="display: flex; gap: 12px;">
                            <div class="field" style="flex: 1;"><label class="field-label">學年度 <span class="req">*</span></label><input type="text" id="input-academic-year" required placeholder="如: 112" class="field-input"></div>
                            <div class="field" style="flex: 1;"><label class="field-label">學期 <span class="req">*</span></label><select id="input-term" class="field-select" required><option value="1">第一學期</option><option value="2">第二學期</option><option value="暑">暑期</option></select></div>
                        </div>

                        <div class="field"><label class="field-label">學制 <span class="req">*</span></label><select id="input-edu-system" required class="field-select"></select></div>
                        <div class="field"><label class="field-label">學院名稱</label><input type="text" id="input-college" placeholder="如: 管理學院" class="field-input"></div>
                        <div class="field" style="margin-bottom:0;"><label class="field-label">開課系所 <span class="req">*</span></label><input type="text" id="input-department" required placeholder="如: 資訊管理學系" class="field-input"></div>
                    </div>
                    <div class="v-divider-modal" style="width: 1px; background: var(--border); margin: 0;"></div>
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <div class="form-section-title"><i class="ti ti-id-badge"></i> 課程學分配置</div>
                        <div class="field"><label class="field-label">課程代碼 <span class="req">*</span></label><input type="text" id="input-course-code" required placeholder="如: IM301" class="field-input"></div>
                        <div class="field"><label class="field-label">課程名稱 <span class="req">*</span></label><input type="text" id="input-course-name" required placeholder="如: 實習導論" class="field-input"></div>
                        <div class="field"><label class="field-label">選必修 <span class="req">*</span></label><select id="input-course-type" required class="field-select"></select></div>
                        <div class="field" style="margin-bottom: 0;"><label class="field-label">學分數 <span class="req">*</span></label><input type="number" id="input-credits" required placeholder="如: 3" class="field-input" min="0" step="0.5"></div>
                    </div>
                </form>
            </div>

            <div class="dialog-footer">
                <button type="button" class="btn btn-secondary" id="btn-cancel-modal">取消</button>
                <button type="button" id="btn-submit" class="btn btn-primary"><i class="ti ti-check"></i> 確認儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 批次修改屬性 Modal -->
    <div id="batch-edit-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 450px;">
            <div class="dialog-header flex-col items-start p-0 border-none">
                <div style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--border); background:#f8fafc;">
                    <h3 style="display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; color:var(--text-primary);"><i class="ti ti-edit" style="color:var(--brand); font-size:20px;"></i> 批次修改課程屬性</h3>
                    <button type="button" class="dialog-close" id="btn-close-batch-x"><i class="ti ti-x"></i></button>
                </div>
            </div>
            <div class="dialog-body custom-scroll" style="background:#f8fafc; padding:24px;">
                <div style="background:white; border:1px solid var(--border); border-radius:8px; padding:16px; box-shadow:var(--shadow-sm); margin-bottom:16px;">
                    <p style="font-size: 13px; color: var(--text-primary); line-height: 1.5; margin:0;">
                        將針對已選取的 <span id="batch-edit-count" style="font-size: 16px; font-weight: 700; color: var(--brand); margin: 0 2px;">0</span> 筆課程進行統一修改。<br>
                        <span style="color: var(--text-muted); font-size: 12px;">若保持「-- 不修改 --」，則該欄位維持原資料不變。</span>
                    </p>
                </div>
                <div class="field"><label class="field-label">批次套用：選必修</label><select id="batch-input-course-type" class="field-select"></select></div>
                <div class="field"><label class="field-label">批次套用：學分數</label><input type="number" id="batch-input-credits" class="field-input" placeholder="-- 不修改 --" min="0" step="0.5"></div>
            </div>
            <div class="dialog-footer" style="background:#f8fafc; border-top:1px solid var(--border); padding:16px 24px; border-radius: 0 0 12px 12px; display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" class="btn btn-secondary" style="background:white;" id="btn-cancel-batch">取消</button>
                <button type="button" id="btn-batch-edit-submit" class="btn btn-primary" style="box-shadow:var(--shadow-sm);"><i class="ti ti-check"></i> 確認批次更新</button>
            </div>
        </div>
    </div>
</div>
