<link rel="stylesheet" href="/assets/css/course.css">
<style>
  /* 若外部 (index.html) 已經有定義這些變數，此段 style 可視情況移除 */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
  }
</style>

<div id="course-page-wrapper">
  
  <!-- 批次操作工具列 (隱藏狀態) -->
  <div id="batch-bar">
    <div class="batch-info" id="batch-info">已選取 <span id="batch-count">0</span> 筆課程資料</div>
    <button class="btn btn-danger-solid btn-sm" id="btn-batch-delete"><i class="ti ti-trash"></i> 批次刪除</button>
    <div class="flex-spacer"></div>
    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('batch-bar').classList.remove('visible')">取消</button>
  </div>

  <!-- 上方工具列 -->
  <div class="toolbar">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" class="search-input" id="search-input" placeholder="搜尋課程名稱、代碼...">
    </div>
    <div class="flex-spacer"></div>
    
    <div class="toolbar-actions">
      <!-- 扁平化輕量全選按鈕 -->
      <button class="btn btn-light-blue" id="btn-select-all-page" title="全選此頁"><i class="ti ti-checkbox"></i> 全選</button>
      <div class="v-divider"></div>
      <button class="btn btn-secondary" id="btn-import"><i class="ti ti-upload"></i> 匯入</button>
      <!-- 扁平化主按鈕 -->
      <button class="btn btn-primary" id="btn-add-course"><i class="ti ti-plus"></i> 新增課程</button>
    </div>
  </div>

  <!-- 篩選器 (支援手機橫向滑動) -->
  <div class="filter-row">
    <div class="filters-scroll-area" id="filter-container">
      <!-- 狀態 Pill -->
      <div class="filter-pill-wrap">
        <div class="filter-pill active" data-status="all">
          全部課程 <span class="pill-count" id="count-all">120</span>
        </div>
      </div>
      <div class="filter-pill-wrap">
        <div class="filter-pill" data-status="active">
          開課中 <span class="pill-count" id="count-active">85</span>
        </div>
      </div>

      <!-- 可搜尋下拉選單 (Searchable Dropdown) 範例 -->
      <div class="searchable-select-wrap">
        <div class="filter-pill" id="department-filter-toggle">
          系所分類 <i class="ti ti-chevron-down"></i>
        </div>
        <!-- 點擊上方 Pill 後加上 show class 展開 -->
        <div class="searchable-dropdown" id="department-dropdown">
          <div class="search-input-box">
            <input type="text" id="department-search" placeholder="搜尋系所...">
          </div>
          <div id="department-list">
            <div class="opt-item searchable-option">資訊工程學系</div>
            <div class="opt-item searchable-option">企業管理學系</div>
            <div class="opt-item searchable-option">外國語文學系</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 表格區塊 -->
  <div class="table-wrap">
    <div class="table-scroll custom-scroll">
      <table id="course-table">
        <thead>
          <tr>
            <!-- 凍結左側 -->
            <th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
            <th data-sort="code" style="width: 150px;">課程代碼 <i class="ti ti-arrows-sort sort-icon"></i></th>
            <th data-sort="name" style="width: auto;">課程名稱 <i class="ti ti-arrows-sort sort-icon"></i></th>
            <th style="width: 120px;">學分數</th>
            <th style="width: 150px;">授課教師</th>
            <!-- 凍結右側 -->
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <!-- 將此 ID 替換為您 render.js 實際呼叫的目標 ID -->
        <tbody id="table-body">
          <!-- JS 渲染目標區域 -->
        </tbody>
      </table>
    </div>

    <!-- 空狀態提示 -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <i class="ti ti-file-off empty-icon"></i>
      <div class="empty-text" id="empty-text">找不到相關課程</div>
    </div>
  </div>

  <!-- 分頁器 -->
  <div class="pagination-bar" id="pagination">
    <div class="pagination-info" id="pagination-info">
      顯示 <strong>0</strong> 到 <strong>0</strong> 筆，共 <strong>0</strong> 筆
    </div>
    <div class="pagination-bar-right">
      <select class="per-page-select" id="per-page-select">
        <option value="10">10 筆/頁</option>
        <option value="20">20 筆/頁</option>
        <option value="50">50 筆/頁</option>
      </select>
      <div class="pagination-controls" id="pagination-controls">
        <!-- JS 渲染分頁按鈕 -->
      </div>
    </div>
  </div>

</div>

<!-- 新增/編輯課程彈窗 -->
<div class="dialog-overlay" id="course-modal">
  <div class="dialog-box">
    <div class="dialog-header">
      <h3 id="modal-title"><i class="ti ti-book"></i> 新增課程</h3>
      <button class="dialog-close" onclick="document.getElementById('course-modal').classList.remove('open')">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="dialog-body custom-scroll" id="modal-body">
      <div class="form-section-title"><i class="ti ti-info-circle"></i> 課程基本資訊</div>
      <div class="form-grid">
        <div class="field">
          <label class="field-label">課程代碼 <span class="req">*</span></label>
          <input type="text" class="field-input" id="course-code" placeholder="例如: CS101">
        </div>
        <div class="field">
          <label class="field-label">課程名稱 <span class="req">*</span></label>
          <input type="text" class="field-input" id="course-name" placeholder="輸入課程名稱">
        </div>
        <div class="field">
          <label class="field-label">所屬系所 <span class="req">*</span></label>
          <select class="field-select" id="course-department">
            <option value="">請選擇系所</option>
            <option value="CS">資訊工程學系</option>
            <option value="BA">企業管理學系</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">學分數 <span class="req">*</span></label>
          <input type="number" class="field-input" id="course-credits" placeholder="例如: 3">
        </div>
      </div>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('course-modal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" id="btn-save-course">儲存課程</button>
    </div>
  </div>
</div>
