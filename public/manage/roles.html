<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶權限管理 - 東海大學實習課程書面審查作業系統</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8f9fc;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        }
        /* 隱藏原生捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1.2s linear infinite; display: inline-block; }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">用戶權限管理</h1>
                <p class="text-xs text-gray-400 mt-1">管理全校各系所審查助教、教師及系統管理員之核心存取權限。</p>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">總註冊用戶</div>
                <div class="text-2xl font-bold text-gray-900 mt-1" id="statTotal">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-blue-500 uppercase tracking-wider">系統管理員 (Admin)</div>
                <div class="text-2xl font-bold text-blue-600 mt-1" id="statAdmin">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-emerald-500 uppercase tracking-wider">審查教師 (Teacher)</div>
                <div class="text-2xl font-bold text-emerald-600 mt-1" id="statTeacher">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">一般用戶 (User)</div>
                <div class="text-2xl font-bold text-gray-700 mt-1" id="statUser">0</div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="w-full md:w-96 relative">
                <i class="ti ti-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base"></i>
                <input type="text" id="searchBar" placeholder="搜尋姓名、電子郵件或單位..." class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:bg-white focus:border-blue-600 focus:outline-none transition">
            </div>
            <div class="w-full md:w-auto flex items-center gap-2 self-start md:self-auto">
                <select id="roleFilter" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs text-gray-600 focus:bg-white focus:outline-none transition">
                    <option value="all">所有權限角色</option>
                    <option value="admin">系統管理員 (Admin)</option>
                    <option value="teacher">審查教師 (Teacher)</option>
                    <option value="user">一般用戶 (User)</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                            <th class="py-3 px-4">基本資料</th>
                            <th class="py-3 px-4">電子郵件</th>
                            <th class="py-3 px-4">一級單位 / 二級單位</th>
                            <th class="py-3 px-4">職稱</th>
                            <th class="py-3 px-4">權限角色</th>
                            <th class="py-3 px-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-100 text-xs text-gray-700">
                        <tr id="tableLoadingRow">
                            <td colspan="6" class="py-8 text-center text-gray-400 font-medium">
                                <i class="ti ti-loader icon-spin text-xl mr-2 align-middle text-blue-600"></i>安全資料鏈同步中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="p-4 bg-gray-50 border-t border-gray-200 flex items-center justify-between flex-col sm:flex-row gap-3">
                <div class="text-[11px] font-medium text-gray-400" id="pageInfo">顯示第 0 到 0 筆，共 0 筆用戶</div>
                <div class="flex items-center gap-1">
                    <button id="btnPrev" class="p-1.5 rounded-md border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition" disabled><i class="ti ti-chevron-left text-sm"></i></button>
                    <div id="pageSelectorContainer" class="flex items-center gap-1"></div>
                    <button id="btnNext" class="p-1.5 rounded-md border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition" disabled><i class="ti ti-chevron-right text-sm"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl border border-gray-100 w-full max-w-md overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="modalCard">
            <div class="px-5 py-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-sm font-bold text-gray-900 flex items-center gap-1.5"><i class="ti ti-shield-cog text-blue-600 text-base"></i> 編輯用戶系統權限</h3>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeEditModal()"><i class="ti ti-x text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">用戶對象</label>
                    <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                        <div class="font-bold text-xs text-gray-800" id="modalName">載入中...</div>
                        <div class="text-[10px] text-gray-400 mt-0.5" id="modalEmail">...</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">一級單位</label>
                        <input type="text" id="inputL1" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:bg-white focus:border-blue-600 focus:outline-none transition" placeholder="如：管理學院">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">二級單位</label>
                        <input type="text" id="inputL2" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:bg-white focus:border-blue-600 focus:outline-none transition" placeholder="如：法律學系">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">主要職稱</label>
                    <input type="text" id="inputJob" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:bg-white focus:border-blue-600 focus:outline-none transition" placeholder="如：專任教授 / 行政秘書">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">系統權限角色</label>
                    <select id="selectRole" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-xs text-gray-700 focus:bg-white focus:border-blue-600 focus:outline-none transition">
                        <option value="user">一般用戶 (User) - 僅能查閱個人基本相關授權</option>
                        <option value="teacher">審查教師 (Teacher) - 可執行各學系實習書面查核</option>
                        <option value="admin">系統管理員 (Admin) - 具備開課、指標等最高控制權</option>
                    </select>
                </div>
            </div>
            <div class="px-5 py-3.5 bg-gray-50 border-t border-gray-200 flex items-center justify-end gap-2">
                <button class="px-4 py-2 border border-gray-200 bg-white hover:bg-gray-50 text-gray-500 rounded-lg text-xs font-semibold transition" onclick="closeEditModal()">取消</button>
                <button id="btnSavePermission" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">確認儲存變更</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 全域核心本地記憶體狀態（SPA 省流底座）
        let allUsers = [];
        let filteredUsers = [];
        
        // 分頁參數配置
        let currentPage = 1;
        const rowsPerPage = 10;
        let currentEditingId = null;

        // 身分安全關測
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchUsersOnce();
            } else {
                window.location.replace('../login.html');
            }
        });

        // 核心一：單次下載機制 (Get Once)
        async function fetchUsersOnce() {
            try {
                const snapshot = await getDocs(collection(db, "users"));
                allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 補充安全設定：如果資料庫完全沒建立預設管理員帳號
                const isExistAdminEmail = allUsers.some(u => u.email === 'thu.isac.review@gmail.com');
                if(!isExistAdminEmail) {
                    allUsers.push({
                        id: "default_system_admin",
                        name: "預設管理者",
                        email: "thu.isac.review@gmail.com",
                        role: "admin",
                        level1Unit: "實習中心",
                        level2Unit: "系統維運組",
                        jobTitle: "系統管理主任"
                    });
                }

                updateDashboardStats();
                applyLocalFilters();
            } catch (error) {
                console.error("權限鏈載入失敗:", error);
                document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500 font-medium">❌ 無法同步資料庫：權限不足。</td></tr>`;
            }
        }

        // 核心二：數據字卡本地重新計算 (0 消耗)
        function updateDashboardStats() {
            document.getElementById('statTotal').textContent = allUsers.length;
            document.getElementById('statAdmin').textContent = allUsers.filter(u => u.role === 'admin').length;
            document.getElementById('statTeacher').textContent = allUsers.filter(u => u.role === 'teacher').length;
            document.getElementById('statUser').textContent = allUsers.filter(u => u.role === 'user' || !u.role).length;
        }

        // 核心三：本地複合交叉條件篩選 (0 消耗)
        function applyLocalFilters() {
            const query = document.getElementById('searchBar').value.trim().toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;

            filteredUsers = allUsers.filter(user => {
                // 1. 角色篩選
                if (roleFilter !== 'all') {
                    const uRole = user.role || 'user';
                    if (uRole !== roleFilter) return false;
                }
                // 2. 關鍵字搜尋 (姓名、Email、單位)
                if (query) {
                    const uName = (user.name || '').toLowerCase();
                    const uEmail = (user.email || '').toLowerCase();
                    const uL1 = (user.level1Unit || '').toLowerCase();
                    const uL2 = (user.level2Unit || '').toLowerCase();
                    return uName.includes(query) || uEmail.includes(query) || uL1.includes(query) || uL2.includes(query);
                }
                return true;
            });

            currentPage = 1; // 重新篩選後回到第一頁
            executeRenderTable();
        }

        // 核心四：分頁與純前端 DOM 渲染
        function executeRenderTable() {
            const tbody = document.getElementById('userTableBody');
            const total = filteredUsers.length;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-400">🔍 沒有找到符合條件的權限用戶。</td></tr>`;
                document.getElementById('pageInfo').textContent = `顯示第 0 到 0 筆，共 0 筆用戶`;
                document.getElementById('btnPrev').disabled = true;
                document.getElementById('btnNext').disabled = true;
                document.getElementById('pageSelectorContainer').innerHTML = '';
                return;
            }

            const startIdx = (currentPage - 1) * rowsPerPage;
            const endIdx = Math.min(startIdx + rowsPerPage, total);
            const pageData = filteredUsers.slice(startIdx, endIdx);

            let html = '';
            pageData.forEach(user => {
                const role = user.role || 'user';
                let roleBadge = `<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-gray-100 text-gray-600">一般用戶 User</span>`;
                if (role === 'admin') roleBadge = `<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-blue-50 text-blue-600 border border-blue-100">管理員 Admin</span>`;
                if (role === 'teacher') roleBadge = `<span class="px-2 py-1 rounded-md text-[10px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100">教師 Teacher</span>`;

                html += `
                    <tr class="hover:bg-gray-50/80 transition-colors">
                        <td class="py-3 px-4 font-bold text-gray-900">${user.name || '未命名'}</td>
                        <td class="py-3 px-4 text-gray-500 font-mono">${user.email || '無'}</td>
                        <td class="py-3 px-4 text-gray-600 font-medium">${user.level1Unit || '—'} / <span class="text-gray-400">${user.level2Unit || '—'}</span></td>
                        <td class="py-3 px-4 text-gray-500">${user.jobTitle || '—'}</td>
                        <td class="py-3 px-4">${roleBadge}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="openEditModalGate('${user.id}')" class="p-1 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition" title="變更權限角色">
                                <i class="ti ti-edit text-base"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            document.getElementById('pageInfo').textContent = `顯示第 ${startIdx + 1} 到 ${endIdx} 筆，共 ${total} 筆用戶`;
            
            // 更新按鈕狀態
            const totalPages = Math.ceil(total / rowsPerPage);
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === totalPages);

            // 渲染頁碼選擇按鈕
            renderPageSelectors(totalPages);
        }

        function renderPageSelectors(totalPages) {
            const container = document.getElementById('pageSelectorContainer');
            container.innerHTML = '';
            for(let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `w-7 h-7 text-[11px] font-bold rounded-md border transition ${i === currentPage ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`;
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    executeRenderTable();
                };
                container.appendChild(btn);
            }
        }

        // 核心五：點擊開啟 Modal 與資料綁定
        window.openEditModalGate = (userId) => {
            const target = allUsers.find(u => u.id === userId);
            if (!target) return;

            currentEditingId = userId;
            document.getElementById('modalName').textContent = target.name || '未命名';
            document.getElementById('modalEmail').textContent = target.email || '無電子郵件';
            document.getElementById('inputL1').value = target.level1Unit || '';
            document.getElementById('inputL2').value = target.level2Unit || '';
            document.getElementById('inputJob').value = target.jobTitle || '';
            document.getElementById('selectRole').value = target.role || 'user';

            // 顯示燈箱
            const modal = document.getElementById('editModal');
            const card = document.getElementById('modalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 20);
        };

        // 核心六：儲存變更（僅消耗 1 次寫入，0 次重新載入讀取）
        document.getElementById('btnSavePermission').addEventListener('click', async () => {
            if (!currentEditingId) return;

            const saveBtn = document.getElementById('btnSavePermission');
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="ti ti-loader icon-spin mr-1"></i> 儲存中...`;

            const payload = {
                level1Unit: document.getElementById('inputL1').value.trim(),
                level2Unit: document.getElementById('inputL2').value.trim(),
                jobTitle: document.getElementById('inputJob').value.trim(),
                role: document.getElementById('selectRole').value
            };

            try {
                // 1. 寫入雲端資料庫 (僅消耗 1 次 Write)
                // 預設管理者為記憶體虛擬物件，不寫入 Firebase 避免報錯
                if (currentEditingId !== 'default_system_admin') {
                    await updateDoc(doc(db, "users", currentEditingId), payload);
                }

                // 2. 💡【關鍵優化】直接對本地記憶體進行異動更新，絕不執行 getDocs 重新加載
                const idx = allUsers.findIndex(u => u.id === currentEditingId);
                if (idx > -1) {
                    allUsers[idx] = { ...allUsers[idx], ...payload };
                }

                // 3. 重新本地刷新視圖
                updateDashboardStats();
                applyLocalFilters();
                closeEditModal();

            } catch (error) {
                console.error("儲存變更失敗:", error);
                alert("儲存變更失敗：您的權限等級不符或發生網路異常。");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `確認儲存變更`;
            }
        });

        // 綁定控制元件事件
        document.getElementById('searchBar').addEventListener('input', applyLocalFilters);
        document.getElementById('roleFilter').addEventListener('change', applyLocalFilters);
        
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; executeRenderTable(); }
        });
        document.getElementById('btnNext').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredUsers.length / rowsPerPage);
            if (currentPage < totalPages) { currentPage++; executeRenderTable(); }
        });
    </script>

    <script>
        function closeEditModal() {
            const modal = document.getElementById('editModal');
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }
    </script>
</body>
</html>
