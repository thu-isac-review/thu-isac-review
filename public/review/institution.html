<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機構審查作業 (依機構彙整)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
/* ─── 核心樣式變數 (承襲實習資料管理風格) ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #1a56db;
  --brand-hover: #1649c0;
  --brand-light: #eff4ff;
  --brand-border: #c3d2f9;
  --topbar-h: 56px;
  --bg: #f8f9fc;
  --surface: #ffffff;
  --border: #e5e7ef;
  --border-strong: #cdd0dd;
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --success: #059669;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --indigo: #4f46e5;
  --indigo-bg: #e0e7ff;
  --indigo-border: #c7d2fe;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --transition: 150ms cubic-bezier(0.4,0,0.2,1);
}

html, body { 
  height: 100%; overflow: hidden; 
  font-family: 'Noto Sans TC', sans-serif; font-size: 14px; 
  color: var(--text-primary); background: var(--bg); 
  -webkit-font-smoothing: antialiased; 
  display: flex; flex-direction: column;
}

/* ─── SCROLLBAR ─── */
.custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.custom-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

/* ─── 動畫 ─── */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.ti-spin { animation: spin 1s linear infinite; display: inline-block; }

/* ─── TOOLBAR ─── */
.toolbar {
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; flex-wrap: wrap;
}

.search-wrap { position: relative; flex: 0 0 260px; }
.search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
.search-input {
  width: 100%; height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0 10px 0 34px;
  font-size: 13px; font-family: inherit;
  color: var(--text-primary); outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }

.flex-spacer { flex: 1; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 14px; height: 34px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; border: none; white-space: nowrap;
  transition: all var(--transition); text-decoration: none;
}
.btn-primary { background: var(--brand); color: white; border: 1px solid var(--brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg); border-color: var(--border-strong); color: var(--text-primary); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

/* ─── FILTER ROW ─── */
.filter-row {
  padding: 10px 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; flex-wrap: wrap; position: relative;
}
.filter-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0 10px; height: 28px;
  border: 1px solid var(--border);
  border-radius: 99px; background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition);
}
.filter-pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
.filter-pill.active { border-color: var(--brand); background: var(--brand-light); color: var(--brand); }

/* ─── TABLE ─── */
.table-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); min-height: 0; }
.table-scroll { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 800px; }

th {
  padding: 12px 16px; text-align: center; 
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  box-shadow: inset 0 -2px 0 var(--border); 
}

td { padding: 12px 16px; vertical-align: middle; word-break: break-word; border-bottom: 1px solid var(--border); }
tr:hover td { background: #fafbff; }

.cell-primary { font-size: 13px; color: var(--text-primary); line-height: 1.4; }
.cell-primary.bold { font-weight: 600; }

/* Status Badges */
.badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.badge-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #fcd34d; }
.badge-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border-strong); }

/* ─── PAGINATION ─── */
.pagination-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 24px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; gap: 10px;
}
.pagination-info { font-size: 12px; color: var(--text-muted); }
.pagination-info strong { color: var(--text-primary); }
.pagination-bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.per-page-select { height: 30px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 12px; padding: 0 6px; outline: none; }
.page-btn {
  min-width: 30px; height: 30px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 8px;
}
.page-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--border-strong); }
.page-btn.active { background: var(--brand); color: white; border-color: var(--brand); font-weight: 700; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── DIALOG MODALS ─── */
.dialog-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.dialog-overlay.open { display: flex; }

.dialog-box {
  background: var(--surface); border-radius: var(--radius-xl);
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  width: 100%; display: flex; flex-direction: column; overflow: hidden;
  animation: dialogIn 0.25s cubic-bezier(0.16,1,0.3,1);
}
@keyframes dialogIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } }

.dialog-header {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; background: var(--surface);
}
.dialog-header h3 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
.dialog-header h3 i { font-size: 22px; color: var(--brand); }
.dialog-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
.dialog-body { padding: 24px; overflow-y: auto; max-height: calc(90vh - 100px); }

/* ─── SPLIT LAYOUT ─── */
.split-layout { display: flex; gap: 24px; align-items: stretch; }
.split-left { flex: 6; min-width: 0; display: flex; flex-direction: column; }
.split-right { 
    flex: 4; min-width: 0; background: var(--bg); 
    padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); 
    display: flex; flex-direction: column;
}

.form-section-title { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.field-input, .field-select {
  width: 100%; height: 38px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 0 12px; font-size: 13px; outline: none; transition: 0.2s;
}
.field-input:focus, .field-select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }

.empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

/* 子表格樣式 (系所清單與學生展開用) */
.inner-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.inner-table th { background: var(--bg); font-size: 12px; padding: 12px; border-bottom: 1px solid var(--border); text-align: center; color: var(--text-secondary); }
.inner-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: center; }
.inner-table tr.dept-row { cursor: pointer; transition: 0.2s; }
.inner-table tr.dept-row:hover { background: var(--brand-light); }
.inner-table tr.dept-row.active { background: var(--indigo-bg); border-left: 3px solid var(--indigo); }
.student-row { display: none; background: #fafbff; }
.student-row.show { display: table-row; }
.student-cell { padding-left: 30px !important; border-bottom: 1px dashed var(--border-strong) !important; font-size: 12px !important; text-align: left !important; color: var(--text-secondary); }

/* 學生選擇清單 */
.student-check-list {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
    max-height: 240px; overflow-y: auto; background: var(--surface); display: flex; flex-direction: column; gap: 4px;
}
.student-check-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: var(--radius-sm); cursor: pointer; transition: 0.2s; border: 1px solid transparent;
}
.student-check-item:hover { background: var(--bg); border-color: var(--border); }
.student-check-item input[type="checkbox"] { accent-color: var(--indigo); cursor: pointer; width: 16px; height: 16px; }
.student-check-item span { font-size: 13px; color: var(--text-primary); flex: 1; display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="search-input" placeholder="搜尋機構名稱或統編..." class="search-input">
        </div>
        <div class="flex-spacer"></div>
        <div class="toolbar-actions">
            <button class="btn btn-secondary" onclick="window.location.reload()">
                <i class="ti ti-refresh"></i> 重新整理
            </button>
        </div>
    </div>

    <div class="filter-row">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 8px;">機構整體狀態：</span>
        <button class="filter-pill active" id="filter-all" onclick="setFilter('all')">全部機構</button>
        <button class="filter-pill" id="filter-pass" onclick="setFilter('pass')">全部系所皆通過</button>
        <button class="filter-pill" id="filter-attention" onclick="setFilter('attention')">需注意 (含逾期/未評估)</button>
        <button class="filter-pill" id="filter-empty" onclick="setFilter('empty')">無關聯實習紀錄</button>
    </div>

    <div class="table-wrap">
        <div class="table-scroll custom-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">實習機構名稱</th>
                        <th style="width: 15%;">統一編號</th>
                        <th style="width: 15%;">關聯系所數</th>
                        <th style="width: 15%;">關聯學生總數</th>
                        <th style="width: 18%;">機構整體審查狀態</th>
                        <th style="width: 12%;">操作</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="ti ti-loader-2 ti-spin" style="font-size: 24px; color:var(--brand);"></i>
                            <div style="margin-top: 8px; font-size: 13px;">機構與紀錄彙整中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="pagination-bar">
            <div class="pagination-info" id="pagination-info">共 0 筆</div>
            <div class="pagination-bar-right">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span style="font-size:12px; color:var(--text-muted)">每頁顯示</span>
                    <select class="per-page-select" id="per-page-select" onchange="window.changePerPage(this.value)">
                        <option value="15">15 筆</option>
                        <option value="25">25 筆</option>
                        <option value="50">50 筆</option>
                    </select>
                </div>
                <div style="display: flex; gap: 4px;" id="pagination-controls"></div>
            </div>
        </div>
    </div>

    <div id="manage-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 1200px; width: 95%;">
            <div class="dialog-header">
                <h3 id="manage-modal-title">
                    <i class="ti ti-building-skyscraper"></i> 
                    <span id="view-inst-name" style="margin-left: 4px;"></span>
                </h3>
                <button type="button" class="dialog-close" onclick="closeManageModal()"><i class="ti ti-x"></i></button>
            </div>
            
            <div class="dialog-body custom-scroll">
                <div class="split-layout">
                    
                    <div class="split-left">
                        <div class="form-section-title"><i class="ti ti-list-details"></i> 關聯系所狀況 (點擊列可切換評估對象)</div>
                        <table class="inner-table" style="background: var(--surface);">
                            <thead>
                                <tr>
                                    <th style="text-align: left; width: 35%;">負責填報系所</th>
                                    <th style="width: 15%;">總學生數</th>
                                    <th style="width: 20%;">審查涵蓋率</th>
                                    <th style="width: 30%;">整體審查狀態</th>
                                </tr>
                            </thead>
                            <tbody id="dept-list-tbody">
                                </tbody>
                        </table>
                    </div>

                    <div class="split-right">
                        <div class="form-section-title" style="color: var(--indigo); border-color: var(--indigo-border);">
                            <i class="ti ti-clipboard-check"></i> 登錄評估紀錄
                        </div>
                        
                        <div class="field">
                            <label class="field-label">選擇評估系所 <span style="color:var(--danger)">*</span></label>
                            <select id="input-eval-dept" class="field-select" onchange="window.onEvalDeptChange()" style="border-color: var(--indigo-border); background: var(--surface);">
                                </select>
                        </div>
                        
                        <div class="field" style="flex: 1;">
                            <label class="field-label">
                                選擇套用學生 <span style="color:var(--danger)">*</span> 
                                <span style="font-weight:normal; color:var(--text-muted); font-size:11px; margin-left:4px;">(預設勾選異常者)</span>
                            </label>
                            <div id="eval-student-list" class="student-check-list custom-scroll">
                                <div class="empty-state" style="padding: 20px;"><i class="ti ti-hand-click" style="font-size:24px; margin-bottom:8px;"></i><br>請先選擇左側系所</div>
                            </div>
                        </div>

                        <div style="display: flex; gap: 12px;">
                            <div class="field" style="flex: 1;">
                                <label class="field-label">本次評估日期 <span style="color:var(--danger)">*</span></label>
                                <input type="date" id="input-eval-date" required class="field-input">
                            </div>
                            <div class="field" style="flex: 1;">
                                <label class="field-label">評估結果 <span style="color:var(--danger)">*</span></label>
                                <select id="input-eval-result" required class="field-select">
                                    <option value="">請選擇結果</option>
                                    <option value="通過">通過</option>
                                    <option value="有條件通過">有條件通過</option>
                                    <option value="不通過">不通過</option>
                                </select>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label">評估說明 / 備註</label>
                            <textarea id="input-eval-remarks" class="field-input custom-scroll" placeholder="請簡述機構審查與評估狀況..." style="min-height: 80px; resize: none; padding: 10px; line-height: 1.5;"></textarea>
                        </div>

                        <div style="text-align: right; margin-top: 8px;">
                            <button type="button" id="btn-submit" class="btn btn-primary" style="background: var(--indigo); border-color: var(--indigo); width: 100%;" onclick="submitEvaluation()">
                                <i class="ti ti-device-floppy"></i> 確認批次儲存
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, writeBatch, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY", authDomain: "thu-isac-review.firebaseapp.com", projectId: "thu-isac-review", storageBucket: "thu-isac-review.firebasestorage.app", messagingSenderId: "453299876735", appId: "1:453299876735:web:1d8babca3315423161a04a" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        const institutionsCol = collection(db, "internship_institutions");
        const recordsCol = collection(db, "internship_records"); 
        
        let allInstitutions = [];
        let allRecords = []; 
        let globalDepts = [];
        let aggregatedData = [];
        let filteredData = [];
        
        let currentFilter = 'all';
        let currentPage = 1; 
        let itemsPerPage = 15;
        
        let currentActiveInst = null;

        // 民國年字串轉西元年 Date 物件
        function parseROCStartDate(durationStr) {
            if (!durationStr || !durationStr.includes('-')) return null;
            let startPart = durationStr.split('-')[0].trim(); 
            let parts = startPart.split('/');
            if (parts.length !== 3) return null;
            let year = parseInt(parts[0], 10) + 1911;
            let month = parseInt(parts[1], 10) - 1; 
            let day = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const deptSnap = await getDocs(collection(db, "departments"));
                globalDepts = deptSnap.docs.map(d => d.data());

                onSnapshot(institutionsCol, (instSnap) => {
                    allInstitutions = instSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    aggregateData();
                });
                onSnapshot(recordsCol, (recSnap) => {
                    allRecords = recSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    aggregateData();
                });
            } else {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="empty-state">請先登入系統以存取資料。</td></tr>`;
            }
        });

        const getDeptShort = (n) => { 
            const d = globalDepts.find(x => x.name === n); 
            return d && d.shortName ? d.shortName : n; 
        };

        // ─── 核心彙整邏輯 (逐筆獨立計算) ───
        function aggregateData() {
            if (allInstitutions.length === 0) return;

            aggregatedData = allInstitutions.map(inst => {
                let instRecords = allRecords.filter(r => r.inst_raw === inst.name);
                
                let deptsObj = {};
                let totalStudents = 0;

                instRecords.forEach(r => {
                    let targetDept = r.resp_dept || '未設定系所';

                    if(!deptsObj[targetDept]) {
                        deptsObj[targetDept] = { records: [] };
                    }

                    let sDateObj = parseROCStartDate(r.duration);
                    let sDateStr = r.duration ? r.duration.split('-')[0].trim() : '-';
                    let statusObj = calculateRecordStatus(sDateObj, r.eval_date);

                    deptsObj[targetDept].records.push({
                        ...r,
                        start_date_obj: sDateObj,
                        start_date_str: sDateStr,
                        statusObj: statusObj
                    });

                    totalStudents++;
                });

                let departments = Object.keys(deptsObj).map(deptName => {
                    let d = deptsObj[deptName];
                    let totalInDept = d.records.length;
                    let validCount = d.records.filter(r => r.statusObj.code === 'pass').length;
                    
                    let deptStatus;
                    if (totalInDept === 0) deptStatus = { code: 'empty', label: '無紀錄', class: 'badge-secondary' };
                    else if (validCount === totalInDept) deptStatus = { code: 'pass', label: '皆在效期內', class: 'badge-success' };
                    else deptStatus = { code: 'attention', label: '部分逾期/未評估', class: 'badge-warning' };

                    return { 
                        dept_name: deptName, 
                        records: d.records, 
                        totalCount: totalInDept,
                        validCount: validCount,
                        status: deptStatus 
                    };
                });

                let overallStatus = getOverallStatus(departments);

                return { 
                    ...inst, 
                    departments, 
                    deptCount: departments.length,
                    totalStudents,
                    overallStatus 
                };
            });

            processAndRender();
        }

        function calculateRecordStatus(startDateObj, evalDateStr) {
            if (!startDateObj) return { code: 'none', label: '無實習起日', class: 'badge-secondary' };
            if (!evalDateStr) return { code: 'none', label: '未評估', class: 'badge-secondary' };

            const evalDateObj = new Date(evalDateStr);
            const diffTime = startDateObj.getTime() - evalDateObj.getTime();
            const diffDays = diffTime / (1000 * 3600 * 24);

            if (diffDays >= 0 && diffDays <= 365) return { code: 'pass', label: '有效 (1年內)', class: 'badge-success' };
            else if (diffDays < 0) return { code: 'expired', label: '異常 (晚於實習)', class: 'badge-warning' };
            else return { code: 'expired', label: '逾期 (>1年)', class: 'badge-danger' };
        }

        function getOverallStatus(departments) {
            if (departments.length === 0) return { code: 'empty', label: '無關聯實習紀錄', class: 'badge-secondary', icon: 'ti-inbox' };
            let hasAttention = departments.some(d => d.status.code === 'attention');
            if (hasAttention) return { code: 'attention', label: '需注意 (含逾期/未評估)', class: 'badge-warning', icon: 'ti-alert-circle' };
            return { code: 'pass', label: '全部系所皆通過', class: 'badge-success', icon: 'ti-circle-check' };
        }

        window.setFilter = (filterVal) => {
            currentFilter = filterVal;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filterVal}`).classList.add('active');
            currentPage = 1;
            processAndRender();
        };

        function processAndRender() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            filteredData = aggregatedData.filter(d => {
                const searchStr = `${d.name || ''} ${d.tax_id || ''}`.toLowerCase();
                const matchSearch = searchStr.includes(searchTerm);
                const matchFilter = currentFilter === 'all' || d.overallStatus.code === currentFilter;
                return matchSearch && matchFilter;
            });

            filteredData.sort((a, b) => b.totalStudents - a.totalStudents);
            renderTable();
            
            // Modal 呈現時即時更新畫面狀態 (保持目前的選項)
            if(document.getElementById('manage-modal').classList.contains('open') && currentActiveInst) {
                const updatedInst = aggregatedData.find(i => i.id === currentActiveInst.id);
                if(updatedInst) {
                    currentActiveInst = updatedInst;
                    
                    // 紀錄當前選取的系所，更新後還原
                    const activeRow = document.querySelector('.dept-row.active');
                    const activeDeptName = activeRow ? activeRow.getAttribute('data-dept') : null;
                    
                    renderDeptListTable();
                    renderEvalDeptSelect();

                    if(activeDeptName) {
                        window.selectDeptForEval(activeDeptName);
                    } else if (currentActiveInst.departments.length > 0) {
                        // 預設選擇第一筆
                        window.selectDeptForEval(currentActiveInst.departments[0].dept_name);
                    }
                }
            }
        }

        window.renderTable = () => {
            const tbody = document.getElementById('table-body');
            const total = filteredData.length;
            const totalPages = Math.max(1, Math.ceil(total / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filteredData.slice(start, start + itemsPerPage);

            document.getElementById('pagination-info').innerHTML = total > 0 
                ? `共 <strong>${total}</strong> 筆機構，顯示第 ${start + 1}–${Math.min(start + itemsPerPage, total)} 筆`
                : `共 <strong>0</strong> 筆機構`;

            let pHtml = `<button class="page-btn" onclick="window.changePage(${currentPage-1})" ${currentPage<=1?'disabled':''}><i class="ti ti-chevron-left"></i></button>`;
            for (let p=1; p<=totalPages; p++) {
                if (p===1 || p===totalPages || Math.abs(p-currentPage)<=1) {
                    pHtml += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="window.changePage(${p})">${p}</button>`;
                }
            }
            pHtml += `<button class="page-btn" onclick="window.changePage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}><i class="ti ti-chevron-right"></i></button>`;
            document.getElementById('pagination-controls').innerHTML = pHtml;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="ti ti-inbox" style="font-size:24px; margin-bottom:8px; display:block;"></i>找不到符合條件的機構。</td></tr>`;
                return;
            }

            let html = '';
            paginatedItems.forEach(data => {
                const st = data.overallStatus;
                const dispTaxId = (data.country === '中華民國' && data.tax_id) ? data.tax_id : '<span style="color: var(--text-muted)">-</span>';

                html += `
                <tr>
                    <td><div class="cell-primary bold">${data.name}</div></td>
                    <td class="text-center"><div class="cell-primary" style="font-family: monospace;">${dispTaxId}</div></td>
                    <td class="text-center"><div class="cell-primary">${data.deptCount} 系</div></td>
                    <td class="text-center"><div class="cell-primary">${data.totalStudents} 人</div></td>
                    <td class="text-center">
                        <span class="badge ${st.class}"><i class="ti ${st.icon}"></i> ${st.label}</span>
                    </td>
                    <td class="text-center">
                        <button onclick="window.openManageModal('${data.id}')" class="btn btn-secondary btn-sm" ${data.deptCount === 0 ? 'disabled' : ''}>
                            <i class="ti ti-clipboard-list"></i> 管理各系評估
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        };

        window.changePage = (page) => { currentPage = page; renderTable(); };
        window.changePerPage = (val) => { itemsPerPage = Number(val); currentPage = 1; processAndRender(); };
        document.getElementById('search-input').addEventListener('input', () => { currentPage = 1; processAndRender(); });

        // ─── 綜合管理 Modal (左右連動邏輯) ───
        window.openManageModal = (instId) => {
            currentActiveInst = aggregatedData.find(i => i.id === instId);
            if (!currentActiveInst) return;

            document.getElementById('view-inst-name').innerText = currentActiveInst.name;
            
            // 初始化表單
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('input-eval-date').value = today;
            document.getElementById('input-eval-result').value = '';
            document.getElementById('input-eval-remarks').value = '';

            renderDeptListTable();
            renderEvalDeptSelect();

            if (currentActiveInst.departments.length > 0) {
                // 預設點擊展開並選擇第一筆系所
                window.selectDeptForEval(currentActiveInst.departments[0].dept_name);
            }

            document.getElementById('manage-modal').classList.add('open');
        };

        window.closeManageModal = () => {
            document.getElementById('manage-modal').classList.remove('open');
            currentActiveInst = null;
        };

        // 渲染左側系所表
        function renderDeptListTable() {
            const tbody = document.getElementById('dept-list-tbody');
            
            let depts = [...currentActiveInst.departments];
            depts.sort((a, b) => {
                if(a.status.code === 'attention' && b.status.code !== 'attention') return -1;
                if(a.status.code !== 'attention' && b.status.code === 'attention') return 1;
                return b.totalCount - a.totalCount;
            });

            if (depts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 30px; color: var(--text-muted);">無關聯的系所紀錄。</td></tr>`;
                return;
            }

            let html = '';
            depts.forEach(d => {
                const dispDept = getDeptShort(d.dept_name);
                const safeId = d.dept_name.replace(/[^a-zA-Z0-9]/g, '_');
                const coverageColor = d.validCount === d.totalCount ? 'var(--success)' : 'var(--danger)';

                // 系所摘要列 (綁定點擊事件，自動連動右側)
                html += `
                <tr class="dept-row dept-row-id-${safeId}" data-dept="${d.dept_name}" onclick="window.selectDeptForEval('${d.dept_name}')">
                    <td style="text-align: left; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                        <i id="icon-expand-${safeId}" class="ti ti-chevron-right" style="color: var(--text-muted); transition: 0.2s;"></i>
                        ${dispDept}
                    </td>
                    <td>${d.totalCount} 人</td>
                    <td>
                        <div style="font-weight: 700; color: ${coverageColor};">${d.validCount} / ${d.totalCount}</div>
                    </td>
                    <td><span class="badge ${d.status.class}">${d.status.label}</span></td>
                </tr>`;

                // 展開的學生名單
                d.records.sort((a, b) => (b.start_date_obj || 0) - (a.start_date_obj || 0)); 
                d.records.forEach(r => {
                    const stuName = (r.student_raw || '').split(' - ')[1] || r.student_raw;
                    html += `
                    <tr class="student-row student-row-${safeId}">
                        <td colspan="4" class="student-cell">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding-right: 16px;">
                                <div style="display: flex; align-items: center; gap: 16px;">
                                    <span style="font-weight: 600; color: var(--text-primary); width: 80px;">${stuName}</span>
                                    <span><i class="ti ti-calendar" style="font-size: 14px; vertical-align: text-bottom;"></i> 實習起日：<span style="font-family: monospace; color: var(--brand); font-weight: 600;">${r.start_date_str}</span></span>
                                    <span><i class="ti ti-clipboard-check" style="font-size: 14px; vertical-align: text-bottom;"></i> 評估日：<span style="font-family: monospace;">${r.eval_date || '無'}</span></span>
                                </div>
                                <span class="badge ${r.statusObj.class}" style="transform: scale(0.9);">${r.statusObj.label}</span>
                            </div>
                        </td>
                    </tr>`;
                });
            });
            tbody.innerHTML = html;
        }

        // 渲染右側系所下拉選單
        function renderEvalDeptSelect() {
            const selectEl = document.getElementById('input-eval-dept');
            if(!currentActiveInst) return;

            let html = '<option value="">請選擇要評估的系所...</option>';
            currentActiveInst.departments.forEach(d => {
                html += `<option value="${d.dept_name}">${getDeptShort(d.dept_name)} (共 ${d.totalCount} 人)</option>`;
            });
            selectEl.innerHTML = html;
        }

        // 左側點擊連動右側
        window.selectDeptForEval = (deptName) => {
            const safeId = deptName.replace(/[^a-zA-Z0-9]/g, '_');
            
            // 處理左側 UI 樣式與展開
            document.querySelectorAll('.dept-row').forEach(r => {
                r.classList.remove('active');
                const i = r.querySelector('i');
                if(i) i.classList.replace('ti-chevron-down', 'ti-chevron-right');
            });
            document.querySelectorAll('.student-row').forEach(r => r.classList.remove('show'));

            const targetRow = document.querySelector(`.dept-row-id-${safeId}`);
            if(targetRow) {
                targetRow.classList.add('active');
                const i = targetRow.querySelector('i');
                if(i) i.classList.replace('ti-chevron-right', 'ti-chevron-down');
            }

            document.querySelectorAll(`.student-row-${safeId}`).forEach(r => r.classList.add('show'));

            // 連動右側下拉選單並觸發更新學生名單
            const selectEl = document.getElementById('input-eval-dept');
            selectEl.value = deptName;
            window.onEvalDeptChange();
        };

        // 當右側下拉選單改變時，更新學生勾選清單
        window.onEvalDeptChange = () => {
            const deptName = document.getElementById('input-eval-dept').value;
            const listContainer = document.getElementById('eval-student-list');
            
            if (!deptName) {
                listContainer.innerHTML = '<div class="empty-state" style="padding: 20px;"><i class="ti ti-hand-click" style="font-size:24px; margin-bottom:8px;"></i><br>請先選擇上方系所</div>';
                return;
            }

            const deptData = currentActiveInst.departments.find(d => d.dept_name === deptName);
            if(!deptData) return;

            let checkHtml = '';
            
            // 異常者排前面
            let sortedRecords = [...deptData.records].sort((a,b) => {
                let aFail = a.statusObj.code !== 'pass';
                let bFail = b.statusObj.code !== 'pass';
                if(aFail && !bFail) return -1;
                if(!aFail && bFail) return 1;
                return 0;
            });

            sortedRecords.forEach(r => {
                const stuName = (r.student_raw || '').split(' - ')[1] || r.student_raw;
                const isPass = r.statusObj.code === 'pass';
                const checkedStr = isPass ? '' : 'checked';
                const colorStr = isPass ? 'var(--text-muted)' : 'var(--text-primary)';
                
                checkHtml += `
                <label class="student-check-item">
                    <input type="checkbox" class="eval-stu-checkbox" value="${r.id}" ${checkedStr}>
                    <span style="color: ${colorStr};">
                        <strong style="width: 70px;">${stuName}</strong> 
                        <div style="color: var(--text-muted); font-size: 11px;">起日: <span style="font-family: monospace;">${r.start_date_str}</span></div>
                        <div style="font-size: 10px; padding: 2px 6px; border-radius: 4px; background: ${isPass ? 'var(--bg)' : 'var(--warning-bg)'}; color: ${isPass ? 'var(--text-muted)' : 'var(--warning)'}; border: 1px solid ${isPass ? 'var(--border)' : '#fcd34d'};">
                            ${r.statusObj.label}
                        </div>
                    </span>
                </label>`;
            });
            
            listContainer.innerHTML = checkHtml;

            // 若使用者是手動去改動右側下拉，則也要反向把左側焦點同步
            const safeId = deptName.replace(/[^a-zA-Z0-9]/g, '_');
            const targetRow = document.querySelector(`.dept-row-id-${safeId}`);
            if(targetRow && !targetRow.classList.contains('active')) {
                // 模擬點擊來展開左側對應列
                window.selectDeptForEval(deptName); 
            }
        };

        window.submitEvaluation = async () => {
            const deptName = document.getElementById('input-eval-dept').value;
            if (!currentActiveInst || !deptName) {
                alert("請先選擇要評估的系所！"); return;
            }

            const evalDate = document.getElementById('input-eval-date').value;
            const evalResult = document.getElementById('input-eval-result').value;
            const evalRemarks = document.getElementById('input-eval-remarks').value.trim();

            if (!evalDate || !evalResult) {
                alert("請填寫「本次評估日期」與「評估結果」！");
                return;
            }

            const checkboxes = document.querySelectorAll('.eval-stu-checkbox:checked');
            const selectedRecordIds = Array.from(checkboxes).map(cb => cb.value);

            if (selectedRecordIds.length === 0) {
                alert("請至少勾選一位要套用此評估紀錄的學生！");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> 批次儲存中...';

            try {
                const batch = writeBatch(db);
                
                selectedRecordIds.forEach(recordId => {
                    const recordRef = doc(db, "internship_records", recordId);
                    batch.update(recordRef, {
                        eval_date: evalDate,
                        eval_result: evalResult,
                        eval_remarks: evalRemarks,
                        updated_at: serverTimestamp()
                    });
                });

                await batch.commit();
                // 成功後不關閉視窗，讓使用者能直接看到左側與右側狀態翻綠 (由 snapshot 觸發 UI 更新)
                
            } catch (err) {
                alert("儲存失敗：" + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="ti ti-device-floppy"></i> 確認批次儲存';
            }
        };

    </script>
</body>
</html>
