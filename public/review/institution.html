<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機構審查作業 (依機構彙整)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
/* ─── 核心樣式變數 ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #1a56db;
  --brand-hover: #1649c0;
  --brand-light: #eff4ff;
  --brand-border: #c3d2f9;
  --topbar-h: 56px;
  --bg: #f8f9fc;
  --surface: #ffffff;
  --border: #e5e7ef;
  --border-strong: #cdd0dd;
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --success: #059669;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --indigo: #4f46e5;
  --indigo-bg: #e0e7ff;
  --indigo-border: #c7d2fe;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --transition: 150ms cubic-bezier(0.4,0,0.2,1);
}

html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: var(--text-primary); background: var(--bg); display: flex; flex-direction: column; }
.custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.custom-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.ti-spin { animation: spin 1s linear infinite; display: inline-block; }

/* ─── TOOLBAR & FILTER ─── */
.toolbar { padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.search-wrap { position: relative; flex: 0 0 260px; }
.search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
.search-input { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px 0 34px; font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
.flex-spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; height: 34px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; white-space: nowrap; transition: 0.2s; }
.btn-primary { background: var(--brand); color: white; border: 1px solid var(--brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg); border-color: var(--border-strong); color: var(--text-primary); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.filter-row { padding: 10px 24px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.filter-pill { padding: 0 12px; height: 28px; border: 1px solid var(--border); border-radius: 99px; background: var(--surface); font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
.filter-pill:hover { border-color: var(--border-strong); }
.filter-pill.active { border-color: var(--brand); background: var(--brand-light); color: var(--brand); }

/* ─── MAIN TABLE ─── */
.table-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); }
.table-scroll { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 900px; }
th { padding: 12px 16px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); position: sticky; top: 0; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); }
td { padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid var(--border); }
tr:hover td { background: #fafbff; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.badge-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #fcd34d; }
.badge-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border-strong); }

/* ─── MODALS ─── */
.dialog-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
.dialog-overlay.open { display: flex; }
/* 層級設定 */
#manage-modal { z-index: 200; }
#add-eval-modal { z-index: 210; }

.dialog-box { background: var(--surface); border-radius: var(--radius-xl); box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 100%; display: flex; flex-direction: column; overflow: hidden; animation: dialogIn 0.2s ease-out; }
@keyframes dialogIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.dialog-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.dialog-header h3 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.dialog-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
.dialog-body { padding: 24px; overflow-y: auto; max-height: calc(90vh - 80px); }

/* ─── SPLIT LAYOUT ─── */
.split-layout { display: flex; gap: 24px; align-items: stretch; }
.split-left { flex: 5; min-width: 0; display: flex; flex-direction: column; }
.split-right { flex: 4; min-width: 350px; background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

.right-header { padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.right-content { padding: 16px; overflow-y: auto; flex: 1; }

.inner-table { width: 100%; border-collapse: collapse; min-width: 500px; }
.inner-table th { background: var(--bg); font-size: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
.inner-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: center; }
.inner-table tr.cohort-row { cursor: pointer; transition: 0.2s; }
.inner-table tr.cohort-row:hover { background: var(--brand-light); }
.inner-table tr.cohort-row.active { background: var(--indigo-bg); border-left: 4px solid var(--indigo); }

/* 評估卡片 */
.eval-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; }
.eval-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }

/* ─── FORMS ─── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.field-input, .field-select { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); padding: 0 12px; font-size: 13px; outline: none; }
.field-input:focus, .field-select:focus { border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
</style>
</head>
<body>

    <div class="toolbar">
        <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="search-input" placeholder="搜尋機構名稱..." class="search-input">
        </div>
    </div>

    <div class="filter-row">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 8px;">機構審查狀態：</span>
        <button class="filter-pill active" onclick="setFilter('all')">全部</button>
        <button class="filter-pill" onclick="setFilter('pass')">審查皆通過有效</button>
        <button class="filter-pill" onclick="setFilter('attention')">有梯次逾期/未評估</button>
    </div>

    <div class="table-wrap">
        <div class="table-scroll custom-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">實習機構名稱</th>
                        <th style="width: 15%;">歷史總實習梯次</th>
                        <th style="width: 15%;">關聯學生總數</th>
                        <th style="width: 20%;">機構整體狀態 (依梯次判定)</th>
                        <th style="width: 20%;">操作</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="manage-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 1200px; width: 95%;">
            <div class="dialog-header">
                <h3><i class="ti ti-building"></i> <span id="view-inst-name"></span> - 各系梯次與評估狀況</h3>
                <button type="button" class="dialog-close" onclick="closeManageModal()"><i class="ti ti-x"></i></button>
            </div>
            
            <div class="dialog-body custom-scroll" style="padding: 20px; background: var(--bg);">
                <div class="split-layout">
                    
                    <div class="split-left">
                        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                            <i class="ti ti-list-details"></i> 各系實習梯次清單
                            <span style="font-weight: normal; font-size: 12px; color: var(--text-muted); margin-left: 8px;">(同系所+同學年期+同開始日為一梯次)</span>
                        </div>
                        <table class="inner-table" style="background: var(--surface); box-shadow: var(--shadow-sm);">
                            <thead>
                                <tr>
                                    <th style="text-align: left; width: 25%;">負責學系</th>
                                    <th style="width: 20%;">課程學年期</th>
                                    <th style="width: 20%;">實習開始日</th>
                                    <th style="width: 15%;">梯次人數</th>
                                    <th style="width: 20%;">該梯次審查狀態</th>
                                </tr>
                            </thead>
                            <tbody id="cohort-list-tbody">
                                </tbody>
                        </table>
                    </div>

                    <div class="split-right">
                        <div class="right-header">
                            <div style="font-size: 14px; font-weight: 700; color: var(--indigo);">
                                <i class="ti ti-history"></i> <span id="right-panel-title">請選擇左側梯次</span>
                            </div>
                            <button id="btn-open-add" class="btn btn-primary btn-sm" style="display: none; background: var(--indigo); border-color: var(--indigo);" onclick="openAddEvalModal()">
                                <i class="ti ti-plus"></i> 新增評估
                            </button>
                        </div>
                        <div class="right-content custom-scroll" id="eval-history-list">
                            <div style="text-align:center; padding:40px; color:var(--text-muted); font-size:13px;">點擊左側梯次以檢視相關評估紀錄</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="add-eval-modal" class="dialog-overlay">
        <div class="dialog-box" style="max-width: 450px;">
            <div class="dialog-header" style="border-bottom-color: var(--indigo-border);">
                <h3 style="color: var(--indigo);"><i class="ti ti-clipboard-plus"></i> 登錄機構評估紀錄</h3>
                <button type="button" class="dialog-close" onclick="closeAddEvalModal()"><i class="ti ti-x"></i></button>
            </div>
            
            <div class="dialog-body">
                <div style="margin-bottom: 16px; padding: 12px; background: var(--indigo-bg); border-radius: var(--radius); color: var(--indigo); font-size: 12px; font-weight: 600;">
                    您正在為 <strong id="add-eval-dept"></strong> 於 <strong id="add-eval-inst"></strong> 新增一筆獨立的評估紀錄。<br>
                    此紀錄將會自動套用於未來或過去一年內的相關實習梯次。
                </div>

                <div class="field">
                    <label class="field-label">本次評估日期 (西元年) <span style="color:var(--danger)">*</span></label>
                    <input type="date" id="input-eval-date" required class="field-input">
                </div>
                <div class="field">
                    <label class="field-label">評估結果 <span style="color:var(--danger)">*</span></label>
                    <select id="input-eval-result" required class="field-select">
                        <option value="">請選擇</option>
                        <option value="通過">通過</option>
                        <option value="有條件通過">有條件通過</option>
                        <option value="不通過">不通過</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label">評估說明 / 備註</label>
                    <textarea id="input-eval-remarks" class="field-input" placeholder="可選填..." style="min-height: 80px; resize: none; padding: 10px;"></textarea>
                </div>
            </div>
            
            <div class="dialog-header" style="background: var(--bg); justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn btn-secondary" onclick="closeAddEvalModal()">取消</button>
                <button type="button" id="btn-submit-eval" class="btn btn-primary" style="background: var(--indigo); border-color: var(--indigo);" onclick="submitEvaluation()">
                    <i class="ti ti-check"></i> 確認儲存
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY", authDomain: "thu-isac-review.firebaseapp.com", projectId: "thu-isac-review", storageBucket: "thu-isac-review.firebasestorage.app", messagingSenderId: "453299876735", appId: "1:453299876735:web:1d8babca3315423161a04a" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        // 資料集
        const institutionsCol = collection(db, "internship_institutions");
        const recordsCol = collection(db, "internship_records"); 
        const evaluationsCol = collection(db, "institution_evaluations"); // 【新獨立資料表】
        
        let allInstitutions = [];
        let allRecords = []; 
        let allEvaluations = [];
        
        let aggregatedData = [];
        let filteredData = [];
        let currentFilter = 'all';
        
        let activeInstId = null;
        let activeCohortKey = null;

        // 轉換民國年日期
        function parseROCStartDate(durationStr) {
            if (!durationStr || !durationStr.includes('-')) return null;
            let startPart = durationStr.split('-')[0].trim(); 
            let parts = startPart.split('/');
            if (parts.length !== 3) return null;
            return new Date(parseInt(parts[0], 10) + 1911, parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(institutionsCol, (snap) => { allInstitutions = snap.docs.map(d => ({ id: d.id, ...d.data() })); runAggregation(); });
                onSnapshot(recordsCol, (snap) => { allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() })); runAggregation(); });
                onSnapshot(evaluationsCol, (snap) => { allEvaluations = snap.docs.map(d => ({ id: d.id, ...d.data() })); runAggregation(); });
            } else {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="5" style="text-align:center;">請先登入。</td></tr>`;
            }
        });

        // ─── 核心彙整邏輯 (依系所+學年期+開始日分群) ───
        function runAggregation() {
            if (allInstitutions.length === 0 || allRecords.length === 0) return;

            aggregatedData = allInstitutions.map(inst => {
                let instRecords = allRecords.filter(r => r.inst_raw === inst.name);
                
                let cohortsObj = {};
                let totalStudents = 0;

                instRecords.forEach(r => {
                    let dept = r.resp_dept || '未設定系所';
                    // 取得課程學年期 (假設欄位為 term 或 semester)
                    let term = r.term || r.semester || '未指定學年期';
                    let sDateObj = parseROCStartDate(r.duration);
                    let sDateStr = r.duration ? r.duration.split('-')[0].trim() : '未知日期';
                    
                    let cohortKey = `${dept}_${term}_${sDateStr}`;

                    if(!cohortsObj[cohortKey]) {
                        cohortsObj[cohortKey] = {
                            cohortKey: cohortKey,
                            dept: dept,
                            term: term,
                            startDateStr: sDateStr,
                            startDateObj: sDateObj,
                            count: 0
                        };
                    }
                    cohortsObj[cohortKey].count++;
                    totalStudents++;
                });

                // 為每個梯次計算狀態：去 allEvaluations 找該系對該機構的「有效評估」
                let cohorts = Object.values(cohortsObj).map(cohort => {
                    // 找出該機構、該系的所有歷史評估
                    let evalsForDept = allEvaluations.filter(e => e.inst_name === inst.name && e.dept_name === cohort.dept);
                    
                    let hasValidEval = false;
                    if(cohort.startDateObj) {
                        for(let e of evalsForDept) {
                            if(!e.eval_date) continue;
                            let eDate = new Date(e.eval_date);
                            let diffDays = (cohort.startDateObj.getTime() - eDate.getTime()) / (1000 * 3600 * 24);
                            if(diffDays >= 0 && diffDays <= 365) {
                                hasValidEval = true;
                                break;
                            }
                        }
                    }

                    cohort.status = hasValidEval 
                        ? { code: 'pass', label: '合規 (有涵蓋評估)', class: 'badge-success' }
                        : { code: 'attention', label: '異常/未涵蓋', class: 'badge-danger' };
                    
                    return cohort;
                });

                // 機構整體狀態
                let overallStatus;
                if(cohorts.length === 0) overallStatus = { code: 'empty', label: '無關聯紀錄', class: 'badge-secondary', icon: 'ti-minus' };
                else if(cohorts.some(c => c.status.code === 'attention')) overallStatus = { code: 'attention', label: '需注意 (部分梯次異常)', class: 'badge-warning', icon: 'ti-alert-circle' };
                else overallStatus = { code: 'pass', label: '全部梯次皆合規', class: 'badge-success', icon: 'ti-check' };

                return { ...inst, cohorts, totalStudents, overallStatus };
            });

            processAndRenderMain();
        }

        window.setFilter = (f) => { currentFilter = f; document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); processAndRenderMain(); };

        function processAndRenderMain() {
            filteredData = aggregatedData.filter(d => (currentFilter === 'all' || d.overallStatus.code === currentFilter));
            filteredData.sort((a,b) => b.totalStudents - a.totalStudents);
            
            const tbody = document.getElementById('table-body');
            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px;">找不到符合的機構。</td></tr>`;
                return;
            }

            let html = '';
            filteredData.forEach(d => {
                html += `
                <tr>
                    <td><div class="cell-primary bold">${d.name}</div></td>
                    <td class="text-center"><div class="cell-primary">${d.cohorts.length} 梯次</div></td>
                    <td class="text-center"><div class="cell-primary">${d.totalStudents} 人</div></td>
                    <td class="text-center"><span class="badge ${d.overallStatus.class}"><i class="ti ${d.overallStatus.icon}"></i> ${d.overallStatus.label}</span></td>
                    <td class="text-center">
                        <button class="btn btn-secondary btn-sm" onclick="openManageModal('${d.id}')">
                            <i class="ti ti-list"></i> 管理審查
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;

            // 若 Modal 開啟中則重新渲染內容
            if(document.getElementById('manage-modal').classList.contains('open') && activeInstId) {
                renderManageModalContent();
            }
        }

        // ─── 綜合管理視窗 邏輯 ───
        window.openManageModal = (id) => {
            activeInstId = id;
            activeCohortKey = null;
            document.getElementById('manage-modal').classList.add('open');
            renderManageModalContent();
        };

        window.closeManageModal = () => { document.getElementById('manage-modal').classList.remove('open'); };

        function renderManageModalContent() {
            let inst = aggregatedData.find(i => i.id === activeInstId);
            if(!inst) return;
            document.getElementById('view-inst-name').innerText = inst.name;

            // 渲染左側梯次表
            let tbody = document.getElementById('cohort-list-tbody');
            if(inst.cohorts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">無實習梯次</td></tr>`;
            } else {
                // 排序：異常排前，然後依開始日新到舊
                let sortedCohorts = [...inst.cohorts].sort((a,b) => {
                    if(a.status.code === 'attention' && b.status.code !== 'attention') return -1;
                    if(a.status.code !== 'attention' && b.status.code === 'attention') return 1;
                    return (b.startDateObj || 0) - (a.startDateObj || 0);
                });

                let html = '';
                sortedCohorts.forEach(c => {
                    let safeId = c.cohortKey.replace(/[^a-zA-Z0-9]/g, '_');
                    let isActive = (activeCohortKey === c.cohortKey) ? 'active' : '';
                    html += `
                    <tr class="cohort-row ${isActive}" id="row-${safeId}" onclick="selectCohort('${c.cohortKey}')">
                        <td style="text-align:left; font-weight:700;">${c.dept}</td>
                        <td>${c.term}</td>
                        <td style="font-family:monospace;">${c.startDateStr}</td>
                        <td>${c.count} 人</td>
                        <td><span class="badge ${c.status.class}">${c.status.label}</span></td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            }

            // 如果有選定梯次，更新右側，否則重置右側
            if(activeCohortKey) {
                renderRightPanel();
            } else if (inst.cohorts.length > 0) {
                // 預設點選第一筆
                selectCohort(inst.cohorts[0].cohortKey);
            }
        }

        window.selectCohort = (key) => {
            activeCohortKey = key;
            document.querySelectorAll('.cohort-row').forEach(r => r.classList.remove('active'));
            let safeId = key.replace(/[^a-zA-Z0-9]/g, '_');
            document.getElementById(`row-${safeId}`).classList.add('active');
            
            renderRightPanel();
        };

        function renderRightPanel() {
            let inst = aggregatedData.find(i => i.id === activeInstId);
            let cohort = inst.cohorts.find(c => c.cohortKey === activeCohortKey);
            if(!cohort) return;

            document.getElementById('right-panel-title').innerText = `${cohort.dept} - 歷史評估紀錄`;
            document.getElementById('btn-open-add').style.display = 'inline-flex';

            let listDiv = document.getElementById('eval-history-list');
            
            // 找出該系所有的歷史評估
            let evals = allEvaluations.filter(e => e.inst_name === inst.name && e.dept_name === cohort.dept);
            evals.sort((a,b) => new Date(b.eval_date) - new Date(a.eval_date)); // 新到舊

            if(evals.length === 0) {
                listDiv.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">此系所尚未建立針對本機構的評估紀錄。</div>`;
                return;
            }

            let html = '';
            evals.forEach(e => {
                // 判斷這筆歷史紀錄是否能涵蓋 "當前選定的梯次"
                let isCovering = false;
                if(cohort.startDateObj && e.eval_date) {
                    let eDate = new Date(e.eval_date);
                    let diffDays = (cohort.startDateObj.getTime() - eDate.getTime()) / (1000 * 3600 * 24);
                    if(diffDays >= 0 && diffDays <= 365) isCovering = true;
                }

                let coverBadge = isCovering 
                    ? `<span style="font-size:12px; color:var(--success); font-weight:700;"><i class="ti ti-circle-check"></i> 可涵蓋本梯次 (${cohort.count}人)</span>`
                    : `<span style="font-size:12px; color:var(--text-muted);"><i class="ti ti-x"></i> 無法涵蓋本梯次</span>`;

                html += `
                <div class="eval-card" style="${isCovering ? 'border-left: 4px solid var(--success);' : ''}">
                    <div class="eval-card-header">
                        <div style="font-weight: 700; font-family: monospace; font-size: 15px;"><i class="ti ti-calendar"></i> ${e.eval_date}</div>
                        <span class="badge ${e.eval_result === '通過' ? 'badge-success' : 'badge-warning'}">${e.eval_result}</span>
                    </div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">備註：${e.eval_remarks || '無'}</div>
                    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
                        ${coverBadge}
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        // ─── 新增評估彈窗 邏輯 ───
        window.openAddEvalModal = () => {
            let inst = aggregatedData.find(i => i.id === activeInstId);
            let cohort = inst.cohorts.find(c => c.cohortKey === activeCohortKey);
            if(!inst || !cohort) return;

            document.getElementById('add-eval-dept').innerText = cohort.dept;
            document.getElementById('add-eval-inst').innerText = inst.name;
            
            document.getElementById('input-eval-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('input-eval-result').value = '';
            document.getElementById('input-eval-remarks').value = '';

            document.getElementById('add-eval-modal').classList.add('open');
        };

        window.closeAddEvalModal = () => { document.getElementById('add-eval-modal').classList.remove('open'); };

        window.submitEvaluation = async () => {
            let inst = aggregatedData.find(i => i.id === activeInstId);
            let cohort = inst.cohorts.find(c => c.cohortKey === activeCohortKey);
            if(!inst || !cohort) return;

            const dateVal = document.getElementById('input-eval-date').value;
            const resVal = document.getElementById('input-eval-result').value;
            const remVal = document.getElementById('input-eval-remarks').value.trim();

            if(!dateVal || !resVal) { alert("請填寫評估日期與結果！"); return; }

            const btn = document.getElementById('btn-submit-eval');
            btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> 儲存中...';

            try {
                // 將新評估寫入獨立的 institution_evaluations 資料表
                await addDoc(evaluationsCol, {
                    inst_name: inst.name,
                    dept_name: cohort.dept,
                    eval_date: dateVal,
                    eval_result: resVal,
                    eval_remarks: remVal,
                    created_at: serverTimestamp()
                });

                closeAddEvalModal();
                // 儲存成功後，onSnapshot 會偵測到新資料並自動重新執行 runAggregation()，畫面會自動更新
            } catch(e) {
                alert("儲存失敗：" + e.message);
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> 確認儲存';
            }
        };

    </script>
</body>
</html>
