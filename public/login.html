<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登入 - 東海大學學生校外實習管理系統</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --brand: #1a56db;
            --brand-hover: #1649c0;
            --brand-light: #eff4ff;
            --bg: #f8f9fc;
            --surface: #ffffff;
            --border: #e5e7ef;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --radius-xl: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --transition: 0.2s ease;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
        .input-field { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; font-size: 14px; transition: all var(--transition); }
        .input-field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); background: var(--surface); }
        .btn-primary { width: 100%; background: var(--brand); color: white; padding: 14px; border-radius: 8px; font-weight: 600; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all var(--transition); }
        .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
        .btn-primary:disabled { cursor: not-allowed; opacity: 0.7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1.2s linear infinite; display: inline-block; }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4">

    <form id="loginForm" class="w-full max-w-md animate-fade" style="background: var(--surface); padding: 40px; border-radius: var(--radius-xl); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border);">
        <div class="flex flex-col items-center mb-8 text-center">
            <div style="width: 56px; height: 56px; border-radius: 12px; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 28px; box-shadow: var(--shadow-sm);">
                <i class="ti ti-user-key"></i>
            </div>
            <h1 style="font-size: 18px; font-weight: 700;">東海大學實習中心</h1>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">實習課程書面審查作業系統</p>
        </div>

        <div id="errorMsg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium bg-red-50 text-red-600 border border-red-200"></div>

        <div class="space-y-4">
            <div>
                <input type="text" id="email" placeholder="請輸入帳號或電子郵件 (@thu.edu.tw)" class="input-field" required autocomplete="username">
            </div>
            <div class="relative">
                <input type="password" id="password" placeholder="請輸入密碼" class="input-field pr-10" required autocomplete="current-password">
                <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none text-lg">
                    <i class="ti ti-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">進入系統</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcsGfvVKnGmCzWfK5F03saydFpNc1ReYY",
            authDomain: "thu-isac-review.firebaseapp.com",
            projectId: "thu-isac-review",
            storageBucket: "thu-isac-review.firebasestorage.app",
            messagingSenderId: "453299876735",
            appId: "1:453299876735:web:1d8babca3315423161a04a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const errorMsg = document.getElementById('errorMsg');

        // 💡【安全防護機制修正】全域狀態監聽器：確保本地資料完整才允許跳轉放行
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // 如果已經登入，且快取完備，直接安全跳轉
                if (localStorage.getItem('user_role')) {
                    window.location.replace('index.html');
                    return;
                }

                // 如果被搶跑或重新整理導致快取缺失，由監聽器在跳轉前補抓
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    let role = 'user', name = '使用者', theme = 'blue';
                    
                    if (userDoc.exists()) {
                        const d = userDoc.data();
                        role = d.role || 'user';
                        name = d.name || '使用者';
                        theme = d.theme || 'blue';
                    } else if (user.email === 'thu.isac.review@gmail.com') {
                        role = 'admin'; name = '最高權限管理者';
                    }

                    localStorage.setItem('user_name', name);
                    localStorage.setItem('user_role', role);
                    localStorage.setItem('user_theme', theme);
                    
                    window.location.replace('index.html');
                } catch (err) {
                    console.error("觀測鏈快取補強失敗:", err);
                }
            }
        });

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePasswordBtn.innerHTML = type === 'password' ? '<i class="ti ti-eye"></i>' : '<i class="ti ti-eye-off"></i>';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="ti ti-loader-2 icon-spin text-lg"></i> 安全驗證中...';

            let emailVal = emailInput.value.trim();
            const passwordVal = passwordInput.value;

            if (emailVal && !emailVal.includes('@')) {
                emailVal += '@thu.edu.tw';
                emailInput.value = emailVal;
            }

            try {
                // 執行登入（接下來會交由上面的 onAuthStateChanged 進行完備的快取補網與跳轉）
                await signInWithEmailAndPassword(auth, emailVal, passwordVal);
            } catch (error) {
                console.error("Login Event Error:", error);
                errorMsg.textContent = "登入失敗：請檢查您的特權帳號或密碼設定。";
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '進入系統';
            }
        });
    </script>
</body>
</html>
