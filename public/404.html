<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 找不到頁面 - 東海大學實習系統</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <style>
        /* 沿用主系統的色彩與變數 */
        :root {
            --brand: #1a56db; 
            --brand-hover: #1649c0; 
            --brand-light: #eff4ff; 
            --bg: #f8f9fc; 
            --surface: #ffffff; 
            --border: #e5e7ef;
            --text-primary: #111827; 
            --text-secondary: #4b5563; 
            --text-muted: #9ca3af;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-primary); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            -webkit-font-smoothing: antialiased;
        }
        
        .error-container {
            text-align: center;
            padding: 40px 24px;
            max-width: 480px;
            width: 100%;
        }
        
        .icon-box {
            width: 100px;
            height: 100px;
            background-color: var(--brand-light);
            color: var(--brand);
            border-radius: 24px; /* 乾淨的圓角方形 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .icon-box i {
            font-size: 56px;
        }
        
        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        
        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--brand);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s ease;
            box-shadow: none; /* 移除陰影與漸層，保持扁平實體 */
            border: none;
        }
        
        .btn-home:hover {
            background-color: var(--brand-hover);
        }
        
        .btn-home i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="icon-box">
            <i class="ti ti-map-pin-off"></i>
        </div>
        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">找不到該頁面</h2>
        <p class="error-desc">
            抱歉，您要前往的頁面不存在，或是已經被移除。<br>
            請確認網址是否正確，或返回系統首頁繼續操作。
        </p>
        
        <a href="/index.html" class="btn-home">
            <i class="ti ti-home"></i> 返回系統首頁
        </a>
    </div>

</body>
</html>
